    const r=x.r, h=x.h;
    return '<section class="sheet">'+
      '<div class="sh-head"><b>'+esc(r.name)+'</b>'+
        '<span>'+esc(term.name)+'　'+esc(normalizeUnit((ASG_BY_TERM[term.id][r.id]||{}).unit)||'—')+
        '　UL：'+esc(x.to)+'</span>'+
        '<span>G'+r.cg+' '+esc(tierOf(r.cg).name)+'／在籍'+(r.months==null?'—':r.months.toFixed(1)+'ヶ月')+
        '／全体'+r.overall+'%</span></div>'+
      '<div class="sh-cols">'+
        '<div>'+HO_FIELDS.map(f=>'<div class="sh-f"><b>'+esc(f.n)+'</b><p>'+
          esc(h[f.k]||'—')+'</p></div>').join('')+'</div>'+
        '<div>'+
          '<div class="sh-f"><b>強み・弱み（カテゴリ別）</b><p>'+
            (r.cats||[]).map(c=>esc(c.n)+' '+c.pct+'%').join('　／　')+'</p></div>'+
          '<div class="sh-f"><b>いまの稼働</b><p>'+
            (r.work.hours==null?'—':r.work.hours+'h／週')+'　担当'+accTotal(r.work)+'社'+
            '（ｽﾀﾝﾀﾞｰﾄﾞ'+(r.work.accStd||0)+'／ｱﾄﾞﾊﾞﾝｽ'+(r.work.accAdv||0)+'）'+
            (r.work.until? '　卒業予定 '+fmtDateFull(r.work.until):'')+
            (r.work.skills.length? '<br>得意：'+esc(r.work.skills.join('・')):'')+'</p></div>'+
          '<div class="sh-f"><b>本人が気にしていること</b><p>'+esc(r.concern||'—')+'</p></div>'+
          '<div class="sh-f"><b>いま詰まっているところ</b><p>'+
            (stuckDisplay(r).slice(0,3).map(it=>esc(it.cat.split('｜')[0])+'／'+esc(it.t)).join('<br>')||'—')+'</p></div>'+
          '<div class="sh-f"><b>前のULからの記入</b><p>'+esc(h.filled_by||'—')+'　'+
            (h.filled_at?fmtDateTime(h.filled_at):'')+'</p></div>'+
        '</div>'+
      '</div></section>';
  }).join('');
  document.body.classList.add('psheet');
  let done=false;
  const off=()=>{ if(done) return; done=true;
    document.body.classList.remove('psheet');
    box.innerHTML='';
    window.removeEventListener('afterprint',off); };
  window.addEventListener('afterprint',off);
  setTimeout(()=>{ window.print(); setTimeout(off,1500); },40);
}

/* ------------------------------------------------------------
   期の作成・取り込み・保存・確定
   ------------------------------------------------------------ */
/* 「2026上期」のような名前を、いまの日付から作っておく */
function suggestTermName(d){
  const t=d||new Date();
  return t.getFullYear()+(t.getMonth()<6?'上期':'下期');
}
function halfRange(d){
  const t=d||new Date(), y=t.getFullYear(), first=t.getMonth()<6;
  return first? {s:y+'-01-01',e:y+'-06-30'} : {s:y+'-07-01',e:y+'-12-31'};
}
async function newTermFlow(){
  const def=suggestTermName();
  const name=prompt('期の名前を入れてください（例：'+def+'）',def);
  if(name==null) return;
  if(!String(name).trim()){ toast('名前を入れてください','bad'); return; }
  if(TERMS.some(t=>t.name===String(name).trim())){ toast('同じ名前の期がすでにあります','bad'); return; }
  const r=halfRange();
  const starts=prompt('開始日（YYYY-MM-DD）',r.s); if(starts==null) return;
  const ends=prompt('終了日（YYYY-MM-DD・空でもOK）',r.e);
  try{
    const t=await Store.createTerm({name:String(name).trim(),starts_on:starts,ends_on:ends||null});
    await loadAll();
    V.term=t&&t.id||''; ASG_EDIT={termId:'',rows:{},dirty:false};
    render();
    toast('期をつくりました。「いまの名簿から取り込む」で割当の下地を作れます','xp',6000);
  }catch(e){ toast(e.message||'作成に失敗しました','bad',6000); }
}
async function delTermFlow(id){
  const t=termById(id); if(!t) return;
  const n=Object.keys(ASG_BY_TERM[id]||{}).length;
  if(!confirm(t.name+' を削除します。\n\nこの期の割当'+n+'件も一緒に消えます。元に戻せません。\n'+
    'メンバーのチェック・申し送り・テスト結果は消えません。\n\nよろしいですか？')) return;
  try{
    await Store.deleteTerm(id);
    if(V.term===id) V.term='';
    ASG_EDIT={termId:'',rows:{},dirty:false};
    await loadAll(); render(); toast('削除しました');
  }catch(e){ toast(e.message||'削除に失敗しました','bad'); }
}
/* いまの名簿とマイシートの稼働を、その期の割当の下地として保存する */
async function seedTermFlow(id){
  const t=termById(id); if(!t) return;
  const saved=ASG_BY_TERM[id]||{};
  const rows=termMembers().filter(r=>!saved[r.id]).map(r=>({
    term_id:id, member_id:r.id,
    unit:r.m.unit||null, ul:r.m.ul||null, mentor:r.m.mentor||null,
    weekly_hours:r.work.hours, acc_std:r.work.accStd, acc_adv:r.work.accAdv
  }));
  if(!rows.length){ toast('取り込む人がいません'); return; }
  try{
    await Store.saveAssignments(rows);
    ASG_EDIT={termId:'',rows:{},dirty:false};
    await loadAll(); render(); toast(rows.length+'人ぶんを取り込みました');
  }catch(e){ toast(e.message||'取り込みに失敗しました','bad',6000); }
}
/* 画面で編集した割当をまとめて保存する（まだ名簿には反映しない） */
async function saveAsgFlow(id){
  const t=termById(id); if(!t) return;
  const num=v=>{ const x=String(v==null?'':v).trim(); if(!x) return null; const n=+x; return isNaN(n)?null:n; };
  const rows=termMembers().map(r=>{
    const a=asgOf(id,r);
    return { term_id:id, member_id:r.id,
      unit:a.unit||null, ul:a.ul||null, mentor:a.mentor||null,
      weekly_hours:num(a.weekly_hours), acc_std:num(a.acc_std), acc_adv:num(a.acc_adv) };
  });
  try{
    await Store.saveAssignments(rows);
    ASG_EDIT={termId:'',rows:{},dirty:false};
    await loadAll(); render(); toast(rows.length+'人ぶんを保存しました');
  }catch(e){ toast(e.message||'保存に失敗しました','bad',6000); }
}
/* 期を確定する。名簿に書き戻し、動いた人には申し送りを1件ずつ残す */
async function applyTermFlow(id){
  const t=termById(id); if(!t) return;
  if(ASG_EDIT.termId===id && ASG_EDIT.dirty){
    if(!confirm('未保存の変更があります。先に保存してから確定しますか？')) return;
    await saveAsgFlow(id);
  }
  /* 確定前に、誰がどう動くかをそのまま文にして確認する */
  const moves=[];
  termMembers().forEach(r=>{
    const a=(ASG_BY_TERM[id]||{})[r.id]; if(!a) return;
    const bu=r.unit, au=normalizeUnit(a.unit)||'（未設定）';
    const bl=String(r.m.ul||'').trim(), al=String(a.ul||'').trim();
    if(bu!==au||bl!==al) moves.push({r:r,bu:bu,au:au,bl:bl,al:al});
  });
  const head=t.name+' を確定します。\n\n'+
    'いまの名簿の 所属Unit・UL・メンター が、この期の割当で置き換わります。\n'+
    (moves.length? moves.length+'人が動きます：\n'+
      moves.slice(0,12).map(m=>'  '+m.r.name+'：'+
        (m.bu!==m.au? m.bu+'→'+m.au : m.au)+
        (m.bl!==m.al? '／UL '+(m.bl||'—')+'→'+(m.al||'—') : ''))
        .join('\n')+(moves.length>12?'\n  ほか'+(moves.length-12)+'人':'')
    : '所属とULが変わる人はいません。')+
    '\n\n前の期の割当は消えません。よろしいですか？';
  if(!confirm(head)) return;
  try{
    const n=await Store.applyTerm(id);
    /* 動いた人に申し送りを残す。あとから「いつ誰から誰に移ったか」を追えるように */
    for(const m of moves){
      const parts=[];
      if(m.bu!==m.au) parts.push('所属が '+m.bu+' から '+m.au+' に変わりました');
      if(m.bl!==m.al) parts.push('ULが '+(m.bl||'未設定')+' から '+(m.al||'未設定')+' に変わりました');
      try{
        await Store.addNote({ member_id:m.r.id, kind:'handover', occurred_on:todayStr(),
          body:'【'+t.name+'】'+parts.join('。')+'。', visibility:'shared' });
      }catch(e){}
    }
    ASG_EDIT={termId:'',rows:{},dirty:false};
    await loadAll(); render();
    toast(t.name+' を確定しました（'+n+'人に反映）','xp',6000);
  }catch(e){ toast(e.message||'確定に失敗しました','bad',6000); }
}

function mtgText(){
  const unit=V.mtgUnit||unitsInUse()[0]||'';

  const L=['【'+unit+'｜キャリアステップ確認 '+fmtDateFull(todayStr())+'】',''];
  list.forEach(r=>{
    L.push('■ '+r.name+'（G'+r.cg+' '+tierOf(r.cg).name+'／在籍'+(r.months==null?'—':r.months.toFixed(1))+'ヶ月）');
    L.push('　進捗：'+r.done+'/'+r.total+'（'+r.pct+'%）／全体 '+r.overall+'%'+
      (r.readyPromo?'　★昇格面談の対象':''));
    L.push('　昇格予定：'+fmtDateFull(r.outlook.targetDate)+
      (r.delay!=null&&!isSeniorTier(r.cg)? '（標準比 '+(r.delay>=0?'+':'')+r.delay.toFixed(1)+'ヶ月）':''));
    if(stuckDisplay(r).length) L.push('　詰まり：'+stuckDisplay(r).slice(0,3).map(it=>it.cat.split('｜')[0]+'／'+it.t).join(' ／ '));

  });
  return L.join('\n');
}

/* カルテ（読む）とチェック（書く）を分ける。
   引き継ぎMTG中に一覧を見ているつもりで誤タップし、
   本人画面にまで反映されてしまうのを避けるため。 */
const DW_TABS=[['summary','カルテ'],['step','チェック'],['handover','引き継ぎ'],
               ['notes','申し送り'],['scores','テスト'],['profile','設定']];
function openDrawer(id){ V.drawer=id; V.dwTab='summary'; renderDrawer(); }
function closeDrawer(){ V.drawer=null; document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }
function renderDrawer(){

function dwBody(r){

/* ------------------------------------------------------------
   強み・弱み。グレードは「どこまで来たか」しか表さないので、
   「運用は強いが組織運営が弱い」を見る軸をここで別に出す。
   分母は Grade 1〜挑戦中グレード（まだ開いていない上のグレードまで
   入れると全員がほぼ0%になって比較にならない）。
   ------------------------------------------------------------ */
function dwCatCard(r){
  const cs=r.cats||[];
  if(!cs.length) return '';
  let h='<div class="card"><h2>強み・弱み <span class="cnt">Grade 1〜'+r.cg+' の項目をカテゴリでまとめたもの</span></h2>'+
    '<div style="display:flex;flex-direction:column;gap:7px">';
  cs.forEach(c=>{
    const col = c.pct>=80?'var(--mint)' : c.pct>=50?'var(--violet)' : 'var(--coral)';
    h+='<div class="cbar"><span class="cl">'+esc(c.n)+'</span>'+
      '<span class="mini" style="flex:1;height:9px"><i style="width:'+c.pct+'%;background:'+col+'"></i></span>'+
      '<b class="mono cn">'+c.d+'/'+c.t+'・'+c.pct+'%</b></div>';
  });
  h+='</div>';
  const sortd=cs.slice().sort((a,b)=>b.pct-a.pct);
  const best=sortd[0], worst=sortd[sortd.length-1];
  if(cs.length>1 && best.pct!==worst.pct)
    h+='<p class="tiny muted" style="margin:11px 0 0">いちばん進んでいるのは<b>'+esc(best.n)+'</b>（'+best.pct+'%）、'+
       'いちばん手がついていないのは<b>'+esc(worst.n)+'</b>（'+worst.pct+'%）です。</p>';

}

/* ------------------------------------------------------------
   進捗の推移。progress.checked_at はこれまで「最終更新日」を出すためだけに
   使っていたが、月ごとに数えれば「3ヶ月前から止まっている」「先月から急に
   伸びた」が読める。引き継ぎで「最近どうだったか」を聞かれたときの答え。
   ------------------------------------------------------------ */
function monthlyChecks(r,months){
  const n=months||6, now=new Date(), out=[], idx={};
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    idx[k]=out.length; out.push({k:k, label:(d.getMonth()+1)+'月', c:0});
  }
  Object.keys(r.raw||{}).forEach(k=>{
    const v=r.raw[k]; if(!v||v===true) return;
    const m=String(v).slice(0,7);
    if(idx[m]!=null) out[idx[m]].c++;
  });
  return out;
}
function dwTrendCard(r){
  const ms=monthlyChecks(r,6);
  const mx=Math.max(1,...ms.map(m=>m.c));
  const sum=ms.reduce((a,m)=>a+m.c,0);
  let h='<div class="card"><h2>進捗の推移 <span class="cnt">直近6ヶ月に入ったチェックの数</span></h2>'+
    '<div class="spark">'+ms.map(m=>
      '<div><b class="mono tiny">'+(m.c||'')+'</b>'+
      '<i class="'+(m.c?'':'zero')+'" style="height:'+(m.c?Math.max(6,Math.round(m.c/mx*100)):2)+'%"></i>'+
      '<span>'+m.label+'</span></div>').join('')+'</div>';
  h+='<p class="tiny muted" style="margin:10px 0 0">'+
    (sum? 'この6ヶ月で '+sum+' 件。最終更新は '+(r.quiet==null?'記録なし':r.quiet+'日前')+'です。'
        : 'この6ヶ月はチェックが入っていません。'+(r.quiet==null?'':'最終更新は '+r.quiet+'日前です。'))+'</p>';
  return h+'</div>';
}

function dwStep(r){
  let h='';
  h+='<div class="card"><h2>グレードごとの達成状況</h2>';
  GRADES.forEach(g=>{
    const p=gPct(r.checks,g.n), t=tierOf(g.n), dn=gDone(r.checks,g.n);
    h+='<div class="gbar"><span class="gl" style="color:'+(p===100?'var(--mint)':(g.n===r.cg?t.hex:'var(--ink2)'))+'">'+
      'G'+g.n+' '+t.name.slice(0,5)+(g.n===r.cg?' ●':'')+'</span>'+
      '<span class="mini"><i style="width:'+p+'%;background:'+(p===100?'var(--mint)':t.hex)+'"></i></span>'+
      '<span class="gn">'+dn+'/'+gTotal(g.n)+'</span></div>';
  });
  h+='</div>';
  const notYet=ITEMS[r.cg].filter(i=>!r.checks[i.id]);
  h+='<div class="card"><h2>まだチェックが入っていない項目 <span class="cnt">Grade '+r.cg+'・'+notYet.length+'件</span></h2>'+
    '<p class="tiny muted" style="margin:-4px 0 8px">面談しながらここでチェックを入れられます。'+
    '本人の画面にもすぐ反映されます。</p>';
  if(!notYet.length) h+='<div class="empty">Grade '+r.cg+' はすべて手がついています。</div>';
  else{
    let lastCat='';
    notYet.forEach(it=>{
      if(it.cat!==lastCat){ lastCat=it.cat;
        h+='<div class="tiny" style="font-weight:700;color:var(--ink2);margin:9px 0 1px">'+esc(it.cat)+'</div>'; }
      h+='<button class="item" data-act="dwSet" data-id="'+esc(it.id)+'" data-s="on" role="checkbox" aria-checked="false">'+
        '<span class="box">'+CHECK+'</span><span class="txt">'+esc(it.t)+'</span></button>';
    });
  }
  h+='</div>';
  /* 済みの項目もたためる形で見せる */
  const doneItems=ITEMS[r.cg].filter(i=>r.checks[i.id]);
  if(doneItems.length){
    h+='<div class="card"><h2>Grade '+r.cg+' で達成済み <span class="cnt">'+doneItems.length+'件</span></h2>';
    doneItems.forEach(it=>{
      const at=r.raw[it.id];
      h+='<button class="item on" data-act="dwSet" data-id="'+esc(it.id)+'" data-s="off" role="checkbox" aria-checked="true">'+
        '<span class="box on">'+CHECK+'</span><span class="txt">'+esc(it.t)+
        (at&&at!==true?'<span class="tiny muted"> ／ '+fmtDate(at)+'</span>':'')+
        '</span></button>';
    });
    h+='</div>';
  }
  /* アタリマエ。判定はUL・メンターが入れる（本人の自己申告にすると全員○になるため） */
  const am=r.state.atarimae||{};
  h+='<div class="card"><h2>アタリマエ <span class="cnt">判定はUL・メンターが入れます</span></h2>';
  ATARIMAE.forEach(a=>{
    const v=am[a.k];
    h+='<div style="display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)">'+
      '<b style="font-size:12.5px;width:88px">'+esc(a.n)+'</b>'+
      '<span class="radios" style="flex:0 0 auto">'+
        '<button data-act="setAtari" data-id="'+r.id+'" data-k="'+a.k+'" data-v="ok" class="'+(v==='ok'?'on':'')+'">○</button>'+
        '<button data-act="setAtari" data-id="'+r.id+'" data-k="'+a.k+'" data-v="ng" class="'+(v==='ng'?'on':'')+'">✕</button>'+
      '</span>'+
      '<span class="tiny muted" style="flex:1">'+esc(cut(a.d,70))+'</span></div>';
  });
  h+='</div>';
  return h;

async function resetLoginFor(id){
  const r=BY_ID[id];
  if(!confirm((r?r.name:'この人')+' さんのログインをリセットします。\n\n'+
    'これまでの記録は消えません。このあと画面に出る「ログイン用コード」を'+
    '本人に渡すと、本人がパスワードを決め直せます。\n\nよろしいですか？')) return;
  try{

/* ---------- UL・メンターの引き継ぎ ----------
   ULやメンターが変わったときの付け替えに加えて、各自が自己申告で入力した
   結果ばらついた表記（スペースの有無・旧字/新字・複数名の連記など）を
   まとめて1つの表記に統一する「表記ゆれの解消」にも使う。
   そのため引き継ぎ元は複数選べるようにしてある（選んだもの全部を、
   1つの引き継ぎ先にまとめて付け替える）。 */
let HANDOVER={ field:'ul', froms:[], to:'' };
function currentCharges(field){
  const set=new Set();
  ROWS.forEach(r=>{ const v=r.m[field]; if(v&&String(v).trim()) set.add(String(v).trim()); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ja'));
}
function allMemberNames(){
  return Array.from(new Set(ROWS.map(r=>r.name).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ja'));
}
/* UL欄に入れる名前の候補。実際に育成・UL権限に上がっている人＋KNOWN_ULS。
   自己申告のUL欄の値そのものは候補にしない。「小林直樹・直井理子」のように
   2人ぶんが1つの欄に入った値を、候補から選べる形で広めないため。 */
function ulNameOptions(){
  const managers=ROWS.filter(r=>r.role!=='member').map(r=>r.name);
  return Array.from(new Set(managers.concat(CFG.KNOWN_ULS||[]).filter(Boolean)))
    .sort((a,b)=>a.localeCompare(b,'ja'));
}

  const list=currentCharges(HANDOVER.field);

    '<p class="tiny muted" style="margin:0 0 10px">担当が変わったときの付け替えにも、各自の自己申告でばらついた表記'+
    '（スペースの有無・同じ人の別表記など）を1つにまとめるのにも使えます。'+
    '下から表記を<b>複数選ぶと</b>、それら全部をまとめて右の名前に付け替えます。'+
    '付け替えた人ごとに申し送り（本人にも見える「申し送り」種別）が1件残ります。</p>'+

      (affected.length? '（'+affected.slice(0,8).map(r=>esc(r.name)).join('、')+(affected.length>8?' ほか':'')+'）':'')+'</p>' : '')+

    '<button class="btn vio" data-act="saveSettings">保存する</button>'+
    '<p class="tiny muted" style="margin:8px 0 0">'+
      (Store.caps.settings? 'この設定は'+MANAGER_LABEL+'全員で共有されます。'
                          : 'いまはこのブラウザだけの設定です。全員で共有するには supabase/schema.sql を貼り直してください。')+
    '</p></div>';

  /* パスコードの状態 */
  h+='<div class="card"><h2>パスコード</h2><div class="tiny muted">'+
    '共通パスコード：'+(CONFIG_STATUS&&CONFIG_STATUS.team===false?'<b style="color:var(--coral)">未設定</b>（URLを知る人が誰でも登録できます）':'設定済み')+'<br>'+
    '管理者キー：'+(CONFIG_STATUS&&CONFIG_STATUS.admin===false?'<b style="color:var(--coral)">未設定</b>':'設定済み')+'<br>'+
    '変更のしかたは SETUP.md 手順5にあります（SQL Editorから直接更新します）。</div></div>';

  /* サーバー側の対応状況 */
  const caps=Store.caps||{};
  h+='<div class="card"><h2>この環境で使える機能</h2><div class="tiny muted">'+
    [['チェックの保存（関数経由）',caps.rpcCheck],
     ['ログイン画面の名前検索',caps.rosterSearch],
     ['しきい値の共有',caps.settings],
     ['期・ユニット編成（履歴を残す）',caps.terms]]
    .map(x=>'<div>'+(x[1]?'✓ ':'— ')+x[0]+(x[1]?'':'（supabase/schema.sql の貼り直しで有効になります）')+'</div>').join('')+
    '</div></div>';
  return h;
}

function render(){
  const v=document.getElementById('view');
  const y=v.scrollTop;
  withFocus(()=>{
  if(V.tab==='dash')        v.innerHTML=vDash();
  else if(V.tab==='roster') v.innerHTML=vRoster();
  else if(V.tab==='promo')  v.innerHTML=vPromo();
  else if(V.tab==='notes')  v.innerHTML=vNotes();
  else if(V.tab==='scores') v.innerHTML=vScores();
  else if(V.tab==='terms')  v.innerHTML=vTerms();
  else if(V.tab==='settings')v.innerHTML=vSettings();
  else                      v.innerHTML=vMtg();
  renderNav();
  bindFilters();
  });
  const nk=document.getElementById('nkind'); if(nk) nk.onchange=e=>{ NFILTER.kind=e.target.value; render(); };
  const nv=document.getElementById('nvis');  if(nv) nv.onchange=e=>{ NFILTER.vis=e.target.value; render(); };
  const mu=document.getElementById('mtgUnit'); if(mu) mu.onchange=e=>{ V.mtgUnit=e.target.value; render(); };
  const hs=document.getElementById('hoTermSel'); if(hs) hs.onchange=e=>{ V.hoTerm=e.target.value; renderDrawer(); };
  const ht=document.getElementById('hoTo'); if(ht) ht.oninput=e=>{ HANDOVER.to=e.target.value; };
  if(V.drawer) renderDrawer();
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a!=='open') e.preventDefault();

  if(a==='tab'){ V.tab=el.dataset.tab; F.alert=''; render(); window.scrollTo(0,0); }
  else if(a==='sort'){ const k=el.dataset.k; if(V.sort===k) V.dir=-V.dir; else { V.sort=k; V.dir=(k==='name'||k==='unit'||k==='target'||k==='until')?1:-1; } render(); }
  else if(a==='alert'){ F.alert=el.dataset.a; V.tab='roster'; render(); window.scrollTo(0,0); }
  else if(a==='open'){ e.preventDefault(); openDrawer(el.dataset.id); }
  else if(a==='closeDw'){ closeDrawer(); }
  else if(a==='dwTab'){ V.dwTab=el.dataset.t; renderDrawer(); }
  else if(a==='dwSet'){
    const r=BY_ID[V.drawer]; const id=el.dataset.id; const on=el.dataset.s!=='off';
    try{
      await Store.setCheckFor(r.id,id,on);
      /* 本人が基準を満たさないままチェックしてしまったときのため、
         外した操作は申し送りに記録を残す（付けた操作は残さない。頻度が違うため）。 */
      if(!on){
        const it=ITEM_BY_ID[id];
        await Store.addNote({ member_id:r.id, kind:'memo', occurred_on:todayStr(),
          body:'チェックを外しました：'+(it?it.t:id)+'（管理画面からの操作です）', visibility:'admin' });
      }
      await loadAll();
      const nr=BY_ID[V.drawer];
      renderDrawer(); render();
      if(on && nr.cg>r.cg) toast('Grade '+r.cg+' が埋まりました','xp');
    }catch(err){ toast(err.message||'更新に失敗しました','bad'); }
  }
  else if(a==='setAtari'){
    const r=BY_ID[el.dataset.id]; if(!r) return;
    const k=el.dataset.k, v=el.dataset.v;
    const cur=Object.assign({},r.state.atarimae||{});
    cur[k]=(cur[k]===v?null:v);
    try{
      await Store.saveStateFor(r.id,{atarimae:cur});
      await loadAll(); renderDrawer(); render();
    }catch(err){ toast(err.message||'保存に失敗しました','bad'); }
  }
  else if(a==='clearProgress'){
    const r=BY_ID[el.dataset.id]; if(!r) return;
    const typed=(document.getElementById('pfConfirm')||{}).value||'';
    if(typed.replace(/[\s　]/g,'')!==String(r.name).replace(/[\s　]/g,'')){
      toast('確認のため、氏名を正確に入力してください','bad'); return;
    }
    if(!confirm(r.name+' さんのチェックを全件消します。元に戻せません。よろしいですか？')) return;
    try{
      const n=await Store.clearProgressFor(r.id);
      await loadAll(); renderDrawer(); render();
      toast(n?n+'件を消去しました':'消去しました');
    }catch(err){ toast(err.message||'消去に失敗しました','bad'); }
  }
  else if(a==='saveWork'){ await saveWorkFor(el.dataset.id); }
  else if(a==='wkSkill'){
    const r=BY_ID[el.dataset.id]; if(!r) return;
    const list=(r.work.skills||[]).slice();
    const i=list.indexOf(el.dataset.t);
    if(i>=0) list.splice(i,1); else list.push(el.dataset.t);
    try{
      await saveWorkPatch(r,{skills:list});
      await loadAll(); renderDrawer(); render();
    }catch(err){ toast(err.message||'保存に失敗しました','bad'); }
  }
  /* ---------- 期・ユニット編成 ---------- */
  else if(a==='pickTerm'){ V.term=el.dataset.id; ASG_EDIT={termId:'',rows:{},dirty:false}; render(); window.scrollTo(0,0); }
  else if(a==='newTerm'){ await newTermFlow(); }
  else if(a==='delTerm'){ await delTermFlow(el.dataset.id); }
  else if(a==='seedTerm'){ await seedTermFlow(el.dataset.id); }
  else if(a==='saveAsg'){ await saveAsgFlow(el.dataset.id); }
  else if(a==='applyTerm'){ await applyTermFlow(el.dataset.id); }
  else if(a==='asgView'){ V.asgView=el.dataset.v; render(); }
  else if(a==='autoAsg'){
    const t=termById(el.dataset.id); if(!t) return;
    if(!confirm('いまの割当を、自動で作った叩き台で置き換えます。\n\n'+
      '稼働時間のバランスと、面倒を見られる人（G5以上）が各ユニットに\n'+
      '行きわたることだけを見ています。\n'+
      '相性・本人の希望・クライアントの事情は入っていません。\n\n'+
      '（保存を押すまでサーバーには送りません）\n\nよろしいですか？')) return;
    const n=autoAssign(t);
    render();
    toast(n? n+'人ぶんの叩き台を作りました。ここから手で直してください':'割り振る人がいません','xp',6000);
  }
  else if(a==='addPair'){
    const g=x=>(document.getElementById(x)||{}).value;
    const a2=g('pairA'), b2=g('pairB');

    if(list.some(p=>(p.a===a2&&p.b===b2)||(p.a===b2&&p.b===a2))){ toast('その組み合わせはすでにあります','bad'); return; }

    try{ await savePairs(list); render(); toast('決めごとを足しました'); }
    catch(err){ toast(err.message||'保存に失敗しました','bad',6000); }
  }
  else if(a==='delPair'){
    const list=pairs().slice(); list.splice(+el.dataset.i,1);
    try{ await savePairs(list); render(); toast('消しました'); }
    catch(err){ toast(err.message||'保存に失敗しました','bad',6000); }
  }
  else if(a==='openHo'){
    V.hoTerm=el.dataset.term; V.drawer=el.dataset.id; V.dwTab='handover'; renderDrawer();
  }
  else if(a==='saveHo'){ await saveHoFor(el.dataset.id,el.dataset.term); }
  else if(a==='printSheets'){ printSheets(el.dataset.id); }
  else if(a==='hoField'){ HANDOVER={ field:el.dataset.f, froms:[], to:'' }; render(); }
  else if(a==='hoFrom'){

  }
  else if(a==='doHandover'){

    if(!froms.length){ toast('引き継ぎ元を選んでください（統一先と同じ表記だけが選ばれています）','bad'); return; }
    if(!to){ toast('引き継ぎ先の名前を入力してください','bad'); return; }
    const n=ROWS.filter(r=>froms.indexOf(String(r.m[HANDOVER.field]||'').trim())>=0).length;
    const fromLabel=froms.map(f=>'「'+f+'」').join('・');
    if(!confirm((HANDOVER.field==='mentor'?'メンター':'UL')+' '+fromLabel+' を「'+to+'」に、'+
      n+'人ぶん一括で付け替えます。よろしいですか？')) return;
    try{
      const cnt=await Store.reassignCharge(HANDOVER.field,froms,to);
      HANDOVER={ field:HANDOVER.field, froms:[], to:'' };

      toast(cnt+'人分を引き継ぎました','xp');
    }catch(err){ toast(err.message||'引き継ぎに失敗しました','bad'); }
  }
  else if(a==='retireMember'){
    const r=BY_ID[el.dataset.id]; if(!r) return;
    const type=(document.getElementById('rtType')||{}).value||'卒業';
    const date=(document.getElementById('rtDate')||{}).value||todayStr();
    const reason=((document.getElementById('rtReason')||{}).value||'').trim();

      'チェック・申し送り・テスト結果は消えません。本人はログインできなくなります。\n'+
      '設定タブの「卒業・退職した人」からいつでも現役に戻せます。\n\nよろしいですか？')) return;

      await Store.upsertMember({id:r.id, active:false});

      closeDrawer();
      await loadAll(); render();
      toast(r.name+' さんを'+type+'として記録しました','xp');
    }catch(err){ toast(err.message||'記録に失敗しました','bad'); }
  }
  else if(a==='reactivateMember'){
    const m=A.members.find(x=>x.id===el.dataset.id); if(!m) return;
    if(!confirm(m.name+' さんを現役に戻します。よろしいですか？')) return;
    try{
      await Store.upsertMember({id:m.id, active:true});
      await Store.addNote({member_id:m.id, kind:'memo', occurred_on:todayStr(),
        body:'現役に戻しました。', visibility:'admin'});
      await loadAll(); render();
      toast(m.name+' さんを現役に戻しました','xp');
    }catch(err){ toast(err.message||'更新に失敗しました','bad'); }

    V.preset=el.dataset.p;

  else if(a==='clearFilters'){ F.unit=''; F.q=''; F.role='all'; F.alert=''; F.mine=false; render(); }

  else if(a==='remind'){

  }
  else if(a==='reload'){
    el.disabled=true; el.textContent='更新中…';
    try{ await loadAll(); render(); toast('最新の状態にしました'); }
    catch(err){ toast(err.message||'更新に失敗しました','bad'); render(); }
  }
  else if(a==='resetPick'){
    const id=(document.getElementById('rsWho')||{}).value;
    if(!id){ toast('だれのログインをリセットするか選んでください'); return; }

  }
  else if(a==='copyReset'){
    const id=el.dataset.id;
    if(!ISSUED_CODES[id]){
      toast('ログイン用コードがこの画面に残っていません。「ログインをリセットする」を押して発行し直してください','bad',7000);

  else if(a==='closeCode'){ document.querySelectorAll('.codecard').forEach(n=>n.remove()); }
  else if(a==='saveSettings'){

      { stale_days:Math.max(1,+g('stStale')||14), delay_months:Math.max(0,+g('stDelay')||0) });
    STALE_DAYS=s.stale_days; DELAY_ALERT=s.delay_months; APP_SETTINGS=s;
    try{ localStorage.setItem('careerstep:settings',JSON.stringify(s)); }catch(err){}
    try{
      if(Store.caps.settings){ await Store.saveSettings(s); toast('保存しました（'+MANAGER_LABEL+'全員に反映されます）'); }
      else toast('このブラウザに保存しました');

  else if(a==='pick'){

  else if(a==='toPick'){ GATE.mode='pick'; GATE.q=''; GATE.hits=[]; GATE.picked=null; showGate(); }
  else if(a==='toClaim'){ GATE.mode='claim'; GATE.q=''; GATE.hits=[]; GATE.picked=null; showGate(); }
  else if(a==='wantRole'){

  else if(a==='newNote'){ NF.open=true; NF.editing=null; NF.member_id=''; NF.body=''; NF.next_action=''; NF.kind='memo'; NF.grade=''; NF.occurred_on=todayStr(); render(); }

  else if(a==='delNote'){
    if(!confirm('この記録を削除します。よろしいですか？')) return;
    try{ await Store.deleteNote(el.dataset.id); await loadAll(); render(); toast('削除しました'); }
    catch(err){ toast(err.message||'削除に失敗しました','bad'); }
  }
  else if(a==='closeNote'){ readNoteForm(); NF.open=false; NF.editing=null; render(); }
  else if(a==='nfKind'){ readNoteForm(); NF.kind=el.dataset.k; if(NF.kind==='promotion'&&!NF.grade&&BY_ID[NF.member_id]) NF.grade=BY_ID[NF.member_id].cg; render(); }
  else if(a==='nfVis'){ readNoteForm(); NF.visibility=el.dataset.v; render(); }
  else if(a==='saveNote'){ await saveNote(); }

  else if(a==='newScore'){ SF.open=true; render(); }
  else if(a==='newScoreFor'){ SF={open:true,member_id:el.dataset.id,quiz_name:'',score:'',max_score:'10',taken_on:todayStr()}; closeDrawer(); V.tab='scores'; render(); window.scrollTo(0,0); }
  else if(a==='closeScore'){ SF.open=false; render(); }
  else if(a==='saveScore'){ await saveScore(); }
  else if(a==='delScore'){
    if(!confirm('この結果を削除します。よろしいですか？')) return;
    try{ await Store.deleteScore(el.dataset.id); await loadAll(); renderDrawer(); render(); toast('削除しました'); }
    catch(err){ toast(err.message||'削除に失敗しました','bad'); }
  }
  else if(a==='importCSV'){ document.getElementById('csvFile').click(); }

  else if(a==='saveProfile'){ await saveProfileFor(el.dataset.id); }
  else if(a==='resetLogin'){ await resetLoginFor(el.dataset.id); }

  else if(a==='csvRoster'){ csvRoster(); }
  else if(a==='csvStuck'){ csvStuck(); }
  else if(a==='csvNotes'){ csvNotes(); }
  else if(a==='csvScores'){ csvScores(); }
  else if(a==='copyMtg'){
    const t=mtgText();
    try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }
    catch(err){ downloadBlob('リーダーMTG_'+todayStr()+'.txt',t,'text/plain'); toast('テキストで書き出しました'); }
  }
  else if(a==='printMtg'){ window.print(); }
  /* カルテを1人1枚で印刷する。body に pdw を付けている間だけ、
     印刷用CSSがドロワーだけを紙に出す。 */
  else if(a==='printDw'){
    document.body.classList.add('pdw');
    let done=false;
    const off=()=>{ if(done) return; done=true;
      document.body.classList.remove('pdw');
      window.removeEventListener('afterprint',off); };
    window.addEventListener('afterprint',off);
    setTimeout(()=>{ window.print(); setTimeout(off,1500); },40);
  }
});
/* ---------- 編成ボードのドラッグ＆ドロップ ----------
   render() で中身を作り直すので、個々のカードではなく document で受ける。 */
document.addEventListener('dragstart',e=>{
  const c=e.target.closest&&e.target.closest('[data-drag]'); if(!c) return;
  DRAG=c.dataset.drag;
  c.classList.add('dragging');
  try{ e.dataTransfer.setData('text/plain',DRAG); e.dataTransfer.effectAllowed='move'; }catch(err){}
});
document.addEventListener('dragend',e=>{
  const c=e.target.closest&&e.target.closest('[data-drag]'); if(c) c.classList.remove('dragging');
  document.querySelectorAll('.bcol.over').forEach(x=>x.classList.remove('over'));
  DRAG=null;
});
document.addEventListener('dragover',e=>{
  if(!DRAG) return;
  const col=e.target.closest&&e.target.closest('[data-drop]'); if(!col) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect='move'; }catch(err){}
  if(!col.classList.contains('over')){
    document.querySelectorAll('.bcol.over').forEach(x=>x.classList.remove('over'));
    col.classList.add('over');
  }
});
document.addEventListener('drop',e=>{
  const col=e.target.closest&&e.target.closest('[data-drop]'); if(!col||!DRAG) return;
  e.preventDefault();
  const t=currentTerm(); if(!t){ DRAG=null; return; }
  const to=col.dataset.drop;
  asgSet(t.id,DRAG,'unit', to===NOUNIT? '' : to);
  DRAG=null;
  render();
});

/* 割当表の入力。1文字ごとに描き替えるとカーソルが飛ぶので、
   メモリだけ更新し、select（Unit・UL）を変えたときだけ集計を描き直す。 */
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act="asg"]'); if(!el) return;
  const t=currentTerm(); if(!t) return;
  asgSet(t.id,el.dataset.id,el.dataset.k,el.value);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act="asg"]'); if(!el) return;
  const t=currentTerm(); if(!t) return;
  asgSet(t.id,el.dataset.id,el.dataset.k,el.value);
  if(el.dataset.k==='unit'||el.dataset.k==='ul') render();
});
document.getElementById('scrim').onclick=()=>{ closeDrawer(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && V.drawer) closeDrawer();
});
document.getElementById('csvFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ importCSVText(String(rd.result)); };
  rd.readAsText(f,'utf-8');
  e.target.value='';
};

/* サーバーに届くかどうかだけ確かめる。名前の一覧は取りにいかない

async function boot(){
  const s=await Store.restore();
  if(!s || !Store.isManager){
    await loadRoster();
    showGate(s&&!Store.isManager?'このアカウントには管理者ツールを使う権限がありません。育成かULを選び、管理者キーを入れてください':'');
    return;
  }
  document.getElementById('gate').style.display='none';
  document.getElementById('shell').style.display='grid';
  await loadAll();
  render();
}
(async()=>{
  try{
    await Store.init();
    if(Store.mode!=='cloud'){ showGate(''); return; }
    await boot();
  }catch(e){ GATE.offline=true; showGate(e.message||String(e)); }
})();
</script>
</body>
</html>
