<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEP 管理｜キャリアステップ管理コンソール</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#151C2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#181240; --ink2:#615C88; --ink3:#9A95B8;
  --base:#F1F0F9; --surface:#FFFFFF; --line:#E4E2F3; --line2:#EFEEF8;
  --violet:#5B3DF5; --violet-soft:#EEEAFF;
  --mint:#17B98A;  --mint-soft:#E1F8F0;
  --sky:#2E8FE0;   --sky-soft:#E4F1FC;
  --amber:#F59E17; --amber-soft:#FDF0DA;
  --coral:#F2536A; --coral-soft:#FDE7EA;
  --radius:16px;
  --shadow:0 1px 2px rgba(24,18,64,.04), 0 8px 20px -12px rgba(24,18,64,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:var(--ink);background:var(--base);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:13px;color:var(--ink)}
a{color:var(--violet)}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.disp{font-family:'Bricolage Grotesque','Noto Sans JP',sans-serif;font-weight:800;letter-spacing:-.01em}
.mono{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}
aside{background:#151C2E;color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:baseline;gap:7px;padding:2px 8px 16px}
.logo .mark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em}
.logo .sub{font-size:9.5px;color:#8E96AE;letter-spacing:.14em}
aside nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border-radius:10px;
  color:#C3C8D8;font-weight:500;letter-spacing:.01em;transition:.14s}
aside nav button:hover{background:rgba(255,255,255,.07);color:#fff}
aside nav button.on{background:var(--violet);color:#fff;font-weight:700}
aside nav button .n{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.16);border-radius:99px;padding:1px 7px}
aside nav button.on .n{background:rgba(255,255,255,.25)}
aside svg{width:17px;height:17px;flex:0 0 auto}
.aside-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8E96AE}
.aside-foot b{color:#fff;display:block;font-size:12.5px;font-weight:700}
.aside-foot button{color:#C3C8D8;text-decoration:underline;margin-top:8px;font-size:11px}
main{min-width:0;padding:20px 22px 60px}

/* ---------- header / filters ---------- */
.h1{font-size:21px;margin:0 0 2px}
.lead{color:var(--ink2);font-size:12.5px;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input[type=search],.bar input[type=text],.bar select,.bar input[type=date]{
  border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px}
.bar input[type=search]{min-width:190px}
.seg2{display:inline-flex;background:#E5E3F2;border-radius:10px;padding:2px;gap:2px}
.seg2 button{padding:6px 12px;border-radius:8px;font-weight:700;color:var(--ink2);font-size:12px}
.seg2 button.on{background:#fff;color:var(--violet);box-shadow:0 1px 2px rgba(24,18,64,.1)}
.btn{padding:8px 13px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.vio{background:var(--violet)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;margin-bottom:14px}
.card > h2{font-size:13.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card > h2 .cnt{font-size:11px;color:var(--ink2);font-weight:400}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
.kpi{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px}
.kpi .lab{font-size:11px;color:var(--ink2);letter-spacing:.04em;font-weight:700}
.kpi .val{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:27px;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;color:var(--ink2);margin-left:3px;font-weight:600}
.kpi .sub{font-size:11px;color:var(--ink2);margin-top:1px}
.kpi.click{cursor:pointer;transition:.14s}
.kpi.click:hover{transform:translateY(-1px);box-shadow:0 4px 8px rgba(24,18,64,.07),0 14px 28px -14px rgba(24,18,64,.24)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.chip.v{background:var(--violet-soft);color:var(--violet)}
.chip.m{background:var(--mint-soft);color:#0E8F69}
.chip.s{background:var(--sky-soft);color:#1B6FB4}
.chip.a{background:var(--amber-soft);color:#B0700A}
.chip.c{background:var(--coral-soft);color:#C9273D}
.chip.g{background:#EDECF6;color:var(--ink2)}
/* 自分が担当している人の行。強すぎない程度に敷く */
tbody tr.mine td{background:var(--violet-soft)}
tbody tr.mine td.nm{box-shadow:inset 3px 0 0 var(--violet)}
.muted{color:var(--ink2)}
.tiny{font-size:11px;line-height:1.6}
.empty{padding:26px 10px;text-align:center;color:var(--ink3);font-size:12.5px}

/* ---------- table ---------- */
.tw{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line2)}
thead th{position:sticky;top:0;z-index:3;background:#FAF9FE;font-size:10.5px;letter-spacing:.03em;color:var(--ink2);
  font-weight:700;border-bottom:1.5px solid var(--line);cursor:pointer;user-select:none}
thead th.nos{cursor:default}
thead th .ar{color:var(--violet);margin-left:2px}
tbody tr:hover{background:#FBFAFF}
td.nm{position:sticky;left:0;background:var(--surface);z-index:2;font-weight:700}
th.nm{position:sticky;left:0;z-index:4;background:#FAF9FE}
tbody tr:hover td.nm{background:#FBFAFF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.st{position:sticky;right:0;background:var(--surface);z-index:2;box-shadow:-8px 0 12px -10px rgba(24,18,64,.3)}
th.st{position:sticky;right:0;z-index:4;background:#FAF9FE;box-shadow:-8px 0 12px -10px rgba(24,18,64,.3)}
tbody tr:hover td.st{background:#FBFAFF}
.lnk{color:var(--violet);font-weight:700;text-decoration:none}
.lnk:hover{text-decoration:underline}

/* 10グレードのヒートマップ */
.hm{display:flex;gap:2px}
.hm i{width:15px;height:15px;border-radius:4px;background:#F3F1FA;border:1px solid #E2DFF0;display:block;position:relative}
.hm i.p,.hm i.p2,.hm i.f{border-color:transparent}
.hm i.p{background:var(--violet);opacity:.34}
.hm i.p2{background:var(--violet);opacity:.62}
.hm i.f{background:var(--mint);opacity:1}
.hm i.cur{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--violet)}
.mini{height:6px;border-radius:99px;background:#EDEBF8;overflow:hidden;min-width:52px}
.mini > i{display:block;height:100%;border-radius:99px}

/* ---------- notes ---------- */
.note{border-bottom:1px solid var(--line2);padding:11px 0;display:flex;gap:11px}
.note:last-child{border-bottom:0}
.note .when{flex:0 0 74px;font-size:11px;color:var(--ink2);padding-top:1px}
.note .when b{display:block;font-size:12px;color:var(--ink);font-weight:700}
.note .bd{flex:1;min-width:0}
.note .hdr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px}
.note .body{white-space:pre-wrap;word-break:break-word;font-size:12.5px}
.note .na{margin-top:5px;font-size:11.5px;background:var(--amber-soft);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
/* 本人がマイシートに書いた文をそのまま出すブロック（カルテで使う） */
.quote{font-size:12px;line-height:1.8;background:var(--violet-soft);border-radius:9px;
  padding:7px 10px;white-space:pre-wrap;word-break:break-word;margin:0 0 6px}
.quote.warn{background:var(--amber-soft)}
.quote b{font-weight:800;color:var(--ink2);margin-right:5px}
/* カテゴリ別の達成率の1行 */
.cbar{display:flex;align-items:center;gap:10px}
.cbar .cl{width:118px;flex:0 0 auto;font-size:12px;font-weight:700}
.cbar .cn{width:74px;text-align:right;font-size:11.5px}
.note .acts{opacity:0;transition:.14s;display:flex;gap:6px;margin-left:auto}
.note:hover .acts{opacity:1}
.note .acts button{font-size:11px;color:var(--ink2);text-decoration:underline}

/* ---------- forms ---------- */
.f{margin-bottom:10px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:4px;letter-spacing:.03em}
.f input[type=text],.f input[type=date],.f input[type=number],.f input[type=email],.f input[type=password],.f textarea,.f select{
  width:100%;border:1.5px solid var(--line);background:#FBFAFF;border-radius:10px;padding:9px 11px}
.f textarea{min-height:74px;resize:vertical;line-height:1.7}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--violet);background:#fff;outline:none}
.fr{display:flex;gap:10px}
.fr > *{flex:1;min-width:0}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios button{padding:6px 11px;border-radius:9px;background:#F3F1FC;font-weight:700;font-size:11.5px;color:var(--ink2)}
.radios button.on{background:var(--violet);color:#fff}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(19,14,52,.42);z-index:50;display:none}
#scrim.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:var(--base);z-index:51;
  box-shadow:-20px 0 50px -20px rgba(24,18,64,.4);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.9,.25,1);
  display:flex;flex-direction:column}
#drawer.on{transform:none}
/* 中身は #drawerInner の中に入るので、ここも縦フレックスにしないと
   .dw-body の flex:1 が効かず、下までスクロールできなくなる */
#drawerInner{flex:1;min-height:0;display:flex;flex-direction:column}
.dw-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 52px 14px 18px;position:sticky;top:0;z-index:2;flex:0 0 auto}
.dw-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 40px;flex:1;min-height:0}
.dw-close{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:#F2F0FA;display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.dw-tabs{display:flex;gap:4px;margin-top:11px;flex-wrap:wrap}
.dw-tabs button{padding:6px 11px;border-radius:9px;font-weight:700;font-size:12px;color:var(--ink2);background:#F3F1FC}
.dw-tabs button.on{background:var(--ink);color:#fff}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2);width:100%;text-align:left}
.item:first-child{border-top:0}
.box{width:19px;height:19px;border-radius:6px;border:2px solid #D6D2ED;flex:0 0 auto;margin-top:1px;display:grid;place-items:center;background:#fff;transition:.14s}
.box svg{opacity:0;transform:scale(.5);transition:.14s}
.box.on{background:var(--violet);border-color:var(--violet)}
.box.on svg{opacity:1;transform:scale(1)}
.item .txt{font-size:12.5px;line-height:1.55;flex:1}
.item.on .txt{color:var(--ink2);text-decoration:line-through;text-decoration-color:#CFCBE6}
.gbar{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line2);font-size:11.5px}
.gbar:first-child{border-top:0}
.gbar .gl{width:104px;flex:0 0 auto;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .mini{flex:1}
.gbar .gn{width:52px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(800px 500px at 12% -10%,#DCD8FB,transparent 60%),radial-gradient(700px 460px at 100% 0,#D9F3EA,transparent 58%),var(--base)}
.gbox{background:var(--surface);border-radius:24px;box-shadow:0 3px 6px rgba(24,18,64,.05),0 24px 60px -24px rgba(24,18,64,.3);
  padding:26px 26px 24px;max-width:400px;width:100%}
.gbox h1{font-size:21px;margin:10px 0 4px}
.err{background:var(--coral-soft);color:#C9273D;border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.banner{background:var(--amber-soft);border:1px solid #F2DFB8;border-radius:12px;padding:10px 14px;font-size:12px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.banner b{color:#8A5606}
.gnote{background:var(--violet-soft);border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.75;margin-bottom:14px}
.glist{max-height:264px;overflow:auto;border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px}
.gunit{position:sticky;top:0;background:var(--base);font-size:10.5px;font-weight:700;color:var(--ink2);
  letter-spacing:.08em;padding:6px 13px;border-bottom:1px solid var(--line2)}
.gitem{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:var(--surface);border:0;border-top:1px solid var(--line2);
  font-size:13.5px;text-align:left;cursor:pointer}
.gitem:first-of-type{border-top:0}
.gitem:hover{background:var(--violet-soft)}
.gitem span{font-size:11px;color:var(--ink2);white-space:nowrap}
.gempty{padding:24px 12px;text-align:center;font-size:12px;color:var(--ink2)}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:99px;box-shadow:0 10px 24px -8px rgba(24,18,64,.5)}
.toast.xp{background:var(--violet)}
.toast.bad{background:var(--coral)}

/* ---------- ログイン用コードの表示 ----------
   一度しか出ない値なので、消えるトーストではなく
   自分で閉じるまで残るカードで出す。 */
.codecard{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:rgba(20,16,44,.55);padding:20px}
.codecard .cc-in{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;
  box-shadow:0 24px 60px -18px rgba(24,18,64,.5);text-align:center}
.codecard .cc-h{font-size:13px;font-weight:700;color:var(--ink2)}
.codecard .cc-code{font-size:34px;font-weight:800;letter-spacing:.22em;margin:14px 0 4px;
  color:var(--violet);font-variant-numeric:tabular-nums;word-break:break-all;
  /* 読み上げ・書き写しのために、指でなぞって選べるようにしておく */
  user-select:all;-webkit-user-select:all}
.codecard .cc-note{font-size:11.5px;line-height:1.7;color:var(--ink3);margin:10px 0 16px;text-align:left}
.codecard .cc-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (max-width:420px){ .codecard .cc-code{font-size:27px;letter-spacing:.14em} }

/* ---------- 今日のアクション ---------- */
.actions .act{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.actions .act:first-of-type{border-top:0}
/* 手順の3ステップ（設定タブ） */
.steps3{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px}
.stp3{flex:1;min-width:210px;display:flex;gap:9px;align-items:flex-start}
.stp3>i{flex:0 0 21px;height:21px;border-radius:50%;background:var(--violet);color:#fff;font-style:normal;
  font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.stp3 b{display:block;font-size:13px}
.stp3 span{display:block;font-size:11px;color:var(--ink2);line-height:1.7;margin-top:2px}
.act-n{flex:0 0 62px;font-size:17px;color:var(--violet)}
.act-b{flex:1;min-width:0;display:flex;flex-direction:column}
.act-b b{font-size:13px}
/* 自分が対応する分は、左に線を引いて先に目に入るようにする */
.actions .act.mine{background:var(--violet-soft);border-radius:12px;padding-left:10px;padding-right:10px;
  box-shadow:inset 3px 0 0 var(--violet)}
.card .act{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.card .act:first-of-type{border-top:0}

/* ---------- 項目の行 ---------- */
.pitem{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line2)}
.pitem:first-of-type{border-top:0}
.pitem .txt{flex:1;min-width:0;font-size:12.5px;line-height:1.55}
td .wrap,.wrap{white-space:normal;display:inline-block;max-width:320px}
thead th .q{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;
  background:#E8E5F5;color:var(--ink2);font-size:9px;margin-left:4px;vertical-align:1px}
.fetched{margin:8px 0 6px;font-size:10.5px}
.fetched button{color:#C3C8D8;text-decoration:underline;margin:0}

@media (max-width:900px){
  #shell{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .logo{padding:2px 8px}
  aside nav{display:flex;flex-wrap:wrap;gap:2px;width:100%}
  aside nav button{width:auto}
  .aside-foot{margin:0;border:0;padding:0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .aside-foot b{display:inline}
  .fetched{margin:0}
  main{padding:14px 12px 50px}
  /* 面談モード：スマホでは、右から出るパネルを全画面にして1人分だけを見る。
     1on1は会議室やカフェで、スマホ片手に行われるため。 */
  #drawer{width:100vw}
  .dw-head{padding:12px 46px 12px 14px}
  .dw-body{padding:12px 14px 40px}
  .bar{gap:6px}
  .bar input[type=search]{min-width:0;flex:1}
  .act-n{flex-basis:48px;font-size:15px}
}
/* 進捗の推移（月ごとに何項目チェックが入ったか） */
.spark{display:flex;align-items:flex-end;gap:5px;height:56px}
.spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.spark i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--violet);min-height:2px}
.spark i.zero{background:#E6E3F4}
.spark span{font-size:9.5px;color:var(--ink3);line-height:1;white-space:nowrap}
/* グレード帯（編成のバランスで使う）。平均より分布のほうが判断に効く */
.tierbar{display:flex;height:16px;min-width:130px;border-radius:5px;overflow:hidden;background:#EDEBF8}
.tierbar i{display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:10px;font-weight:800;color:#fff;font-family:'Bricolage Grotesque',sans-serif;min-width:14px}
/* 編成ボード。列＝ユニット、カード＝メンバー。横に並べてドラッグで動かす */
.board{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;align-items:flex-start}
.bcol{flex:0 0 218px;background:#F6F5FC;border:1.5px solid var(--line);border-radius:12px;
  min-height:120px;transition:.12s}
.bcol.none{background:#FBFAFF;border-style:dashed}
.bcol.over{border-color:var(--violet);background:var(--violet-soft)}
.bhead{display:flex;align-items:baseline;gap:6px;padding:9px 10px 5px}
.bhead b{font-size:13px}
.bhead .mono{margin-left:auto;font-size:11px;color:var(--ink2)}
.bstat{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 6px}
.bstat span{font-size:10.5px;font-weight:700;color:var(--ink2);background:#fff;
  border-radius:99px;padding:2px 7px;border:1px solid var(--line2)}
.bstat span.bad{color:#C0344B;border-color:#F5CBD3;background:var(--coral-soft)}
.bwarn{margin:0 8px 6px;font-size:10.5px;line-height:1.65;color:#C0344B;
  background:var(--coral-soft);border-radius:8px;padding:5px 8px}
.bbody{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:46px}
.bempty{font-size:11px;color:var(--ink3);text-align:center;padding:14px 4px;
  border:1.5px dashed var(--line);border-radius:9px}
.mcard{background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:9px;
  padding:7px 9px;cursor:grab;user-select:none}
.mcard:active{cursor:grabbing}
.mcard.dragging{opacity:.4}
.mc-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mc-top b{font-size:12.5px}
.mc-top .chip{font-size:9.5px;padding:1px 5px}
.mc-sub{font-size:10.5px;color:var(--ink2);margin-top:3px}
.mc-sk{font-size:10px;color:var(--ink3);margin-top:2px}
/* 割当表の入力欄。行数が多いので小さめに */
td .asg{width:100%;border:1.5px solid var(--line);background:#FBFAFF;border-radius:8px;
  padding:5px 7px;font-size:12px;min-width:92px}
td .asg.num{min-width:58px;text-align:right}
td .asg:focus{border-color:var(--violet);background:#fff;outline:none}
/* カルテの小見出し付きブロック */
.kv{display:flex;flex-wrap:wrap;gap:6px 18px}
.kv > div{min-width:118px}
.kv b.v{font-size:14px}
/* 引き継ぎシート（1人1枚）。画面では出さず、印刷のときだけ出す */
#printSheets{display:none}
.sheet{padding:0 0 10mm;break-after:page;page-break-after:always}
.sheet:last-child{break-after:auto;page-break-after:auto}
.sh-head{border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px;
  display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.sh-head b{font-size:19px}
.sh-head span{font-size:11px;color:var(--ink2)}
.sh-cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.sh-f{margin-bottom:11px;break-inside:avoid;page-break-inside:avoid}
.sh-f b{display:block;font-size:10.5px;letter-spacing:.04em;color:var(--ink2);margin-bottom:3px}
.sh-f p{margin:0;font-size:12px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
  border-left:3px solid var(--line);padding-left:9px;min-height:20px}
@media print{aside,.bar,.dw-close{display:none}#shell{grid-template-columns:1fr}.tw{max-height:none}
  /* カルテ1人ぶんを印刷するとき（body.pdw）。ドロワーだけを紙に出す */
  /* #shell は起動時に style="display:grid" を直接書き込んでいるので !important が要る */
  body.pdw #shell,body.pdw #scrim{display:none !important}
  body.pdw #drawer{position:static;width:auto;max-width:none;height:auto;transform:none;box-shadow:none;border:0}
  body.pdw .dw-body{overflow:visible;max-height:none;height:auto;padding:0}
  body.pdw .dw-head{position:static;padding:0 0 10px;border-bottom:1.5px solid #ccc}
  body.pdw .dw-tabs,body.pdw .dw-print{display:none}
  /* 紙に押せないボタンを残さない（チェック欄の .item は残す） */
  body.pdw .dw-body .btn,body.pdw .dw-body button.lnk{display:none}
  body.pdw .card{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  /* 引き継ぎシートの一括印刷（body.psheet）。シートだけを紙に出す */
  body.psheet{background:#fff}
  body.psheet #shell,body.psheet #drawer,body.psheet #scrim,body.psheet #toasts{display:none !important}
  body.psheet #printSheets{display:block}
  body.psheet .sh-f p{border-left-color:#bbb}
}
</style>
</head>
<body>

<!-- ===================== ログイン ===================== -->
<div id="gate" style="display:none">
  <div class="gbox">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="disp" style="font-size:18px;letter-spacing:.06em">STEP</span>
      <span class="tiny muted" style="letter-spacing:.14em">ADMIN CONSOLE</span>
    </div>
    <h1 class="disp">管理者ツール</h1>
    <p class="tiny muted" style="margin:0 0 16px">育成・UL用の画面です。インターン本人の画面は <a href="./">こちら</a>。</p>
    <div id="gateErr"></div>
    <div id="gateBody"></div>
  </div>
</div>

<!-- ===================== 本体 ===================== -->
<div id="shell" style="display:none">
  <aside>
    <div class="logo"><span class="mark">STEP</span><span class="sub">ADMIN</span></div>
    <nav id="nav"></nav>
    <div class="aside-foot" id="asideFoot"></div>
  </aside>
  <main id="view"></main>
</div>

<div id="scrim"></div>
<div id="drawer"><div id="drawerInner"></div></div>
<div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="csvFile" accept=".csv,text/csv" style="display:none">
<!-- 引き継ぎシートの一括印刷。印刷のときだけ中身を作って、終わったら空にする -->
<div id="printSheets"></div>

<script src="shared/config.js"></script>
<script src="shared/steps.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/store.js"></script>
<script>
/* ============================================================
   STEP 管理コンソール
   ------------------------------------------------------------
   進捗の計算は shared/steps.js の関数をそのまま使っている。
   本人の画面と管理者画面で数字がズレないように、計算式は1か所だけ。
   ============================================================ */

const CFG = window.STEP_CONFIG || {};
/* しきい値は管理画面の「設定」から変えられる。
   サーバーに保存できない環境では、この端末だけの設定として残る。 */
let STALE_DAYS  = CFG.STALE_DAYS || 14;
let DELAY_ALERT = CFG.DELAY_ALERT_MONTHS != null ? CFG.DELAY_ALERT_MONTHS : 1;
function loadLocalSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('careerstep:settings')||'{}');
    if(s.stale_days)  STALE_DAYS=+s.stale_days;
    if(s.delay_months!=null) DELAY_ALERT=+s.delay_months;
  }catch(e){}
}
loadLocalSettings();

/* 生データ */
let A = { members:[], progress:{}, states:{}, notes:[], scores:[], terms:[], assignments:[] };
let CONFIG_STATUS = null;   /* パスコード・管理者キーが設定済みか */
/* app_config.settings の中身。set_app_settings は丸ごと置き換えるので、
   しきい値だけを保存して編成の決めごとを消す、ということが起きないよう
   ここに読んだ全体を持っておき、保存するときは必ず混ぜてから送る。 */
let APP_SETTINGS = {};
/* メンバーごとに計算済みの行 */
let ROWS = [], BY_ID = {};
/* 画面の状態 */
let V = { tab:'dash', sort:'name', dir:1, drawer:null, dwTab:'summary', mtgUnit:'', term:'', hoTerm:'',
          asgView:'board' };
/* 期（半期）まわり。compute() で組み立てる */
let TERMS=[], ASG_BY_TERM={}, ASG_BY_MEMBER={};
/* 編集中の割当。保存を押すまでサーバーには送らない。{member_id:{unit,ul,...}} */
let ASG_EDIT={ termId:'', rows:{}, dirty:false };
let F = { unit:'', q:'', role:'member', alert:'', mine:false };

/* ============================================================
   ログイン
   ------------------------------------------------------------
   デモ用の入口は持たない。実際に本人画面から登録した人だけが入れる。

   画面は3つ。
     pick  … 育成・ULとして登録済みの人の一覧から自分を選ぶ
     pass  … 自分のパスワードを入れる
     claim … まだ育成・ULになっていない人が、どちらとして入るかを選び、
             自分の名前・パスワード・管理者キーを入れて権限を付ける

   パスワードは本人画面で登録したときに自分で決めたもの。
   共通パスコードではログインできない（それだと共通パスコードを知っている
   メンバー全員がULになりすませてしまうため）。
   ============================================================ */
let GATE={ hits:[], picked:null, q:'', searching:false, mode:'pick', offline:false, want:'mentor' };

function gateHTML(){
  if(Store.mode!=='cloud'){
    return '<div class="banner"><span>⚠️</span><div><b>接続先が設定されていません</b><br>'+
      'shared/config.js に Supabase の情報を入れると、実際のデータで動きます。'+
      '手順はリポジトリの SETUP.md にあります。</div></div>';
  }
  /* 名簿が読めていない。「該当者が1人もいません」と出すと嘘になるので分ける */
  if(GATE.offline){
    return '<div class="banner"><span>⚠️</span><div><b>通信できませんでした</b><br>'+
      'Supabaseに接続できていません。接続情報（shared/config.js）と回線を確認してください。'+
      'データは消えていません。</div></div>'+
      '<button class="btn vio" data-act="retry" style="width:100%;padding:12px">もう一度ためす</button>';
  }

  if(GATE.mode==='claim'){
    return '<div class="gnote">まだ'+MANAGER_LABEL+'になっていない方はこちらです。'+
        '本人画面で登録した名前とパスワードに、ULから共有されている管理者キーを添えて入ってください。'+
        'キーが合っていれば、その場で使えるようになります（承認待ちはありません）。</div>'+
      '<div class="f"><label>どちらとして入りますか</label>'+
        '<div class="seg2" id="cRole" style="display:flex;width:100%">'+ROLES.filter(r=>r.k!=='member').map(r=>
          '<button type="button" data-act="wantRole" data-r="'+r.k+'" style="flex:1;padding:9px 6px;font-size:13px" '+
          'class="'+(GATE.want===r.k?'on':'')+'">'+r.n+'</button>').join('')+'</div>'+
        '<p class="tiny muted" style="margin:6px 0 0">できることは同じです。表示上の役割が変わります。</p></div>'+
      '<div class="f"><label>自分の名前</label>'+
        '<input type="text" id="cQuery" placeholder="名前（2文字以上）" autocomplete="off" value="'+esc(GATE.q)+'">'+
        '<div id="cHits" class="tiny muted" style="margin-top:6px">'+
          (GATE.picked?'選択中：<b style="color:var(--ink)">'+esc(GATE.picked.name)+'</b>':'名前を2文字以上入れてください。')+
        '</div></div>'+
      '<div class="f"><label>パスワード</label><input type="password" id="cPass" autocomplete="current-password" placeholder="本人画面で決めたパスワード"></div>'+
      '<div class="f"><label>管理者キー</label><input type="password" id="cKey" autocomplete="off" placeholder="UL間で共有されているキー"></div>'+
      '<button class="btn vio" data-act="claim" style="width:100%;padding:12px">'+roleName(GATE.want)+'として入る</button>'+
      '<button class="btn ghost" data-act="toPick" style="width:100%;padding:10px;margin-top:8px">戻る</button>';
  }

  if(GATE.mode==='pass'){
    return '<div class="gnote"><b>'+esc(GATE.picked.name)+'</b>'+
        (GATE.picked.unit?' ・ '+esc(GATE.picked.unit):'')+'</div>'+
      '<div class="f"><label>パスワード</label><input type="password" id="gPass" autocomplete="current-password" placeholder="本人画面で決めたパスワード"></div>'+
      '<button class="btn vio" data-act="login" style="width:100%;padding:12px">ログイン</button>'+
      '<button class="btn ghost" data-act="toPick" style="width:100%;padding:10px;margin-top:8px">名前を選びなおす</button>'+
      '<p class="tiny muted" style="margin:12px 0 0">パスワードを忘れたときは、他のULに「ログインのリセット」を頼んでください。</p>';
  }

  /* 管理者の名前も一覧では出さない。名前を入れた人にだけ候補を返す */
  return '<div class="f"><label>自分の名前</label>'+
      '<input type="text" id="gq" placeholder="名前（2文字以上）" autocomplete="off" value="'+esc(GATE.q)+'"></div>'+
    '<div id="gHits"></div>'+
    '<button class="btn ghost" data-act="toClaim" style="width:100%;padding:12px;margin-top:10px">'+
      'まだ'+MANAGER_LABEL+'になっていない方はこちら</button>';
}
/* 検索結果だけを描き替える（入力欄を作り直さないのでカーソルが飛ばない） */
function paintHits(boxId,managersOnly){
  const box=document.getElementById(boxId);
  if(!box) return;
  const q=String(GATE.q).trim();
  if(q.length<2){ box.innerHTML='<p class="tiny muted" style="margin:8px 2px">名前を2文字以上入れてください。</p>'; return; }
  if(GATE.searching){ box.innerHTML='<p class="tiny muted" style="margin:8px 2px">探しています…</p>'; return; }
  if(!GATE.hits.length){
    box.innerHTML='<p class="tiny muted" style="margin:8px 2px">見つかりませんでした。'+
      (managersOnly?'まだ'+MANAGER_LABEL+'になっていない場合は、下のボタンから入ってください。'
                   :'先に本人画面（<a href="./">こちら</a>）で登録してください。')+'</p>';
    return;
  }
  /* 同姓同名がいても区別できるよう、Unitに加えてULも見せる */
  box.innerHTML='<div class="glist">'+GATE.hits.map(m=>
    '<button class="gitem" data-act="pick" data-id="'+m.id+'"><b>'+esc(m.name)+'</b>'+
    '<span>'+esc([m.unit,m.ul].filter(Boolean).join(' ・ '))+(m.linked?' ・ 選ぶ ›':' ・ パスワード未設定')+'</span></button>').join('')+'</div>';
}
let searchT=null;
function gateSearch(q,boxId,managersOnly){
  GATE.q=q;
  clearTimeout(searchT);
  if(String(q).trim().length<2){ GATE.hits=[]; GATE.searching=false; paintHits(boxId,managersOnly); return; }
  GATE.searching=true; paintHits(boxId,managersOnly);
  searchT=setTimeout(async()=>{
    try{ GATE.hits=await Store.searchRoster(q,managersOnly); }
    catch(e){ GATE.hits=[]; }
    GATE.searching=false; paintHits(boxId,managersOnly);
  },260);
}
function showGate(err){
  document.getElementById('shell').style.display='none';
  document.getElementById('gate').style.display='grid';
  document.getElementById('gateErr').innerHTML = err? '<div class="err">'+esc(err)+'</div>' : '';
  document.getElementById('gateBody').innerHTML = gateHTML();

  const gq=document.getElementById('gq');
  if(gq){ gq.oninput=e=>gateSearch(e.target.value,'gHits',true); gq.focus(); paintHits('gHits',true); }
  const cq=document.getElementById('cQuery');
  if(cq){ cq.oninput=e=>gateSearch(e.target.value,'cHits',false); cq.focus(); }
  const gp=document.getElementById('gPass');
  if(gp) gp.focus();
}
function gateBusy(sel,label){
  const b=document.querySelector(sel);
  if(b){ b.disabled=true; b.textContent=label; }
}
async function doLogin(){
  const pw=(document.getElementById('gPass')||{}).value||'';
  if(!pw){ showGate('パスワードを入力してください'); return; }
  gateBusy('[data-act="login"]','確認しています…');
  try{
    await Store.signInManager(GATE.picked, pw);
    await boot();
  }catch(e){ showGate(e.message||String(e)); }
}
async function doClaim(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const who=GATE.picked;
  if(!who){ showGate('自分の名前を入力して、候補から選んでください'); return; }
  if(!g('cPass')){ showGate('パスワードを入力してください'); return; }
  if(!g('cKey')){  showGate('管理者キーを入力してください'); return; }
  gateBusy('[data-act="claim"]','確認しています…');
  try{
    await Store.signInManager(who, g('cPass'), g('cKey'), GATE.want);
    await boot();
    toast(roleName(Store.me&&Store.me.member&&Store.me.member.role)+'として入りました','xp');
  }catch(e){ showGate(e.message||String(e)); }
}

/* ============================================================
   読み込み＆計算
   ============================================================ */
async function loadAll(){
  A = await Store.adminLoad();
  compute();
  if(CONFIG_STATUS===null) CONFIG_STATUS = await Store.configStatus();
  /* しきい値をサーバーに置いてあるなら、そちらを優先する（UL全員で同じ基準になる） */
  try{
    const s=await Store.getSettings();
    if(s){
      APP_SETTINGS=s;
      if(s.stale_days) STALE_DAYS=+s.stale_days;
      if(s.delay_months!=null) DELAY_ALERT=+s.delay_months;
    }
  }catch(e){}
  if(!Store.caps.settings){
    /* しきい値の共有が使えない環境では、決めごともこのブラウザに置く */
    try{ APP_SETTINGS=JSON.parse(localStorage.getItem('careerstep:settings')||'{}'); }catch(e){ APP_SETTINGS={}; }
  }
}
function compute(){
  const now=new Date();
  /* 表示順はここで決める（cloudはSQLでも並べているが、モードによらず同じ順にする） */
  A.notes.sort((a,b)=>String(b.occurred_on).localeCompare(String(a.occurred_on))
    || String(b.created_at||'').localeCompare(String(a.created_at||'')));
  const notesBy={}, scoresBy={};
  A.notes.forEach(n=>(notesBy[n.member_id]=notesBy[n.member_id]||[]).push(n));
  A.scores.forEach(s=>(scoresBy[s.member_id]=scoresBy[s.member_id]||[]).push(s));

  const myName=normName(meName());
  ROWS = A.members.filter(m=>m.active!==false).map(m=>{
    /* 「自分が対応する人」＝その人のUL欄・メンター欄に自分の名前が入っている人。
       名前の表記ゆれ（空白・全角空白・大文字小文字）は吸収する。 */
    const mineUl     = !!(myName && normName(m.ul)===myName);
    const mineMentor = !!(myName && normName(m.mentor)===myName);
    const raw=A.progress[m.id]||{};
    /* 承認はないので、チェックが入っていればそのまま達成として数える。 */
    const checks=checksOf(raw);
    const certified=m.certified_grade||null;
    const cg=gCurrentGrade(checks,certified), cleared=gClearedCount(checks,certified);
    const st=A.states[m.id]||{};
    const notes=(notesBy[m.id]||[]).slice().sort((a,b)=>String(b.occurred_on).localeCompare(String(a.occurred_on)));
    const scores=(scoresBy[m.id]||[]);
    let last=null;
    Object.keys(raw).forEach(k=>{ const v=raw[k]; if(v&&v!==true&&(!last||String(v)>String(last))) last=v; });
    /* 「動きなし」の判定には、チェックだけでなく申し送りの記録日も数える。
       面談して記録を残しているのに「しばらく動きなし」と出るのはおかしいため。 */
    let lastAct=last? String(last).slice(0,10) : null;
    notes.forEach(n=>{ const d=String(n.occurred_on||'').slice(0,10);
      if(d && (!lastAct || d>lastAct)) lastAct=d; });
    const outlook=promotionOutlook(m,checks,now);
    const atarimae=st.atarimae||{};
    return {
      /* 自由入力だった頃の表記ゆれ（「Unit F」「ユニットF」など）は
         ここで正の表記に寄せる。以降の絞り込み・集計は r.unit を見ている。 */
      m:m, id:m.id, name:m.name, unit:normalizeUnit(m.unit)||'（未設定）', role:roleKey(m.role),
      mineUl:mineUl, mineMentor:mineMentor, mine:(mineUl||mineMentor),
      noCharge: !(String(m.ul||'').trim() || String(m.mentor||'').trim()),
      checks:checks, raw:raw,
      concern:(st.custom&&st.custom.__concern)||'',
      /* 本人がマイシートに書いたもの。これまで管理者側で一度も表示しておらず、
         引き継ぎでいちばん効く情報が使われずに捨てられていた。 */
      buddy: st.buddy||'',
      /* いまの稼働（週の稼働時間・担当社数・卒業予定・得意領域）。
         本人がマイシートで申告し、UL側もカルテの「設定」から直せる。 */
      work: workOf(st.custom),
      goals: Object.assign({basic:'',skill:''},st.goals||{}),
      creed: (Array.isArray(st.creed)?st.creed:[]).filter(c=>c&&String(c.t||'').trim()),
      state:st,
      cg:cg, cleared:cleared, done:gDone(checks,cg), total:gTotal(cg), pct:gPct(checks,cg),
      overall:gOverallPct(checks), checked:gTotalChecked(checks),
      certified:certified,
      outlook:outlook,
      months: outlook.elapsedMonths,
      delay: outlook.delayMonths,
      lastCheck:last, stale: last? daysAgo(last) : null,
      /* 申し送りは未来日でも登録できるので、負の日数にならないよう下限0にする */
      lastActivity:lastAct, quiet: lastAct? Math.max(0,daysAgo(lastAct)||0) : null,
      registeredAt:m.created_at||null, regDays: m.created_at? daysAgo(m.created_at) : null,
      stuck: stuckItems(checks,null,certified),
      /* 強み・弱みの軸。挑戦中グレードまでを分母にする */
      cats: catProfile(checks,cg),
      notes:notes, lastNote:notes[0]||null,
      noteCount:notes.length,
      scores:scores,
      quizAvg: scores.length? Math.round(scores.reduce((a,s)=>a+(s.max_score?(+s.score/+s.max_score):0),0)/scores.length*100) : null,
      ngAtarimae: Object.keys(atarimae).filter(k=>atarimae[k]==='ng'),
      /* 認定グレードの内容を終えている＝昇格面談の対象。
         cleared は挑戦中グレードのひとつ下なので、これは
         「認定グレードの項目が全部埋まった」と同じ意味になる。 */
      readyPromo: !!(certified && cleared>=certified)
    };
  });
  BY_ID={}; ROWS.forEach(r=>BY_ID[r.id]=r);
  computeTerms();
}
/* ------------------------------------------------------------
   期（半期）と、その期の割当を引ける形にしておく。
   ・TERMS         … 新しい期が先（starts_on の降順）
   ・ASG_BY_TERM   … 期ID → { メンバーID: 割当 }
   ・ASG_BY_MEMBER … メンバーID → 割当の配列（新しい期が先）
   ------------------------------------------------------------ */
function computeTerms(){
  TERMS=(A.terms||[]).slice().sort((a,b)=>String(b.starts_on).localeCompare(String(a.starts_on)));
  const order={}; TERMS.forEach((t,i)=>order[t.id]=i);
  ASG_BY_TERM={}; ASG_BY_MEMBER={};
  (A.assignments||[]).forEach(a=>{
    (ASG_BY_TERM[a.term_id]=ASG_BY_TERM[a.term_id]||{})[a.member_id]=a;
    (ASG_BY_MEMBER[a.member_id]=ASG_BY_MEMBER[a.member_id]||[]).push(a);
  });
  Object.keys(ASG_BY_MEMBER).forEach(k=>
    ASG_BY_MEMBER[k].sort((x,y)=>(order[x.term_id]==null?99:order[x.term_id])-(order[y.term_id]==null?99:order[y.term_id])));
}
function termById(id){ return TERMS.find(t=>t.id===id)||null; }
function activeTerm(){ return TERMS.find(t=>t.status==='active')||null; }
/* いま画面で選んでいる期。未選択なら 編成中 → いまの期 → 最新 の順で選ぶ */
function currentTerm(){
  if(V.term && termById(V.term)) return termById(V.term);
  return TERMS.find(t=>t.status==='draft') || activeTerm() || TERMS[0] || null;
}
/* その期のひとつ前の期（開始日順で next） */
function prevTermOf(t){
  if(!t) return null;
  const i=TERMS.findIndex(x=>x.id===t.id);
  return i>=0? (TERMS[i+1]||null) : null;
}
function termLabel(t){
  if(!t) return '—';
  return t.name+'（'+fmtDateFull(t.starts_on)+(t.ends_on?'〜'+fmtDateFull(t.ends_on):'〜')+'）';
}

/* いま名簿に入っているUnitの生の値。shared/ui.js の選択肢を作るときに渡す */
function rosterUnitValues(){ return ROWS.map(r=>r.m.unit).filter(Boolean); }
/* 実際にメンバーが居るUnitだけ（リーダーMTGのサマリはここから選ぶ。
   誰も居ないUnitを開いても空の資料にしかならないため）。 */
function unitsInUse(){
  return Array.from(new Set(ROWS.filter(r=>r.role==='member').map(r=>r.unit)))
    .sort((a,b)=>String(a).localeCompare(String(b),'ja'));
}
/* Unitの絞り込みに出す一覧。
   名簿に居るUnitだけだと、まだ誰も登録していないUnit（unitHなど）が
   選べず「そのUnitは無い」ように見えてしまうので、選択肢のほうも足す。
   「（未設定）」は、該当者が居るときだけ inUse 側から入る。 */
function units(){
  const inUse=Array.from(new Set(ROWS.map(r=>r.unit)));
  const all=unitOptions(rosterUnitValues()).concat(inUse);
  return Array.from(new Set(all)).sort((a,b)=>String(a).localeCompare(String(b),'ja'));
}
/* リーダー等級（G7）以上は在籍月数の標準期間という考え方がそぐわないため、
   「遅れ」の対象から外す。 */
function isDelayed(r){ return r.delay!=null && r.delay>=DELAY_ALERT && !isSeniorTier(r.cg); }
/* 「しばらく動きなし」の判定。
   ・登録したばかりの人は、まだ何も無くて当然なので対象外にする
     （初日から赤い印が付くと、アラート全体が信用されなくなる）
   ・チェックだけでなく申し送りの記録日も「動き」に数える（r.quiet）
     面談して記録を残しているのに動きなし扱いになるのはおかしいため。 */
function isStale(r){
  if(r.regDays!=null && r.regDays<STALE_DAYS) return false;
  return r.quiet==null || r.quiet>=STALE_DAYS;
}
/* 「詰まり」も同じ理由でリーダー等級以上は対象外にする（表示・集計のみ。
   棚卸し用CSVには実データを残したいので、そちらは r.stuck をそのまま使う）。 */
function stuckDisplay(r){ return isSeniorTier(r.cg) ? [] : r.stuck; }
function alertsOf(r){
  const out=[];
  if(isDelayed(r)) out.push('delay');
  if(isStale(r)) out.push('stale');
  if(r.readyPromo) out.push('promo');
  if(r.ngAtarimae.length) out.push('atarimae');
  return out;
}
function filtered(){
  const q=F.q.trim().toLowerCase();
  return ROWS.filter(r=>{
    if(F.unit && r.unit!==F.unit) return false;
    if(F.role==='member' && r.role!=='member') return false;
    if(F.role==='manager' && r.role==='member') return false;
    if(F.mine && !r.mine) return false;
    if(F.alert && alertsOf(r).indexOf(F.alert)<0) return false;
    if(q && (r.name+' '+r.unit+' '+(r.m.ul||'')+' '+(r.m.mentor||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function sorted(list){
  const k=V.sort, d=V.dir;
  const val=r=>({
    name:r.name, unit:r.unit, months:r.months==null?-1:r.months, certified:r.certified||0,
    cleared:r.cleared, cg:r.cg, pct:r.pct, overall:r.overall,
    delay:r.delay==null?-99:r.delay, stale:r.quiet==null?9999:r.quiet,
    target:r.outlook.targetDate||'9999', notes:r.noteCount, quiz:r.quizAvg==null?-1:r.quizAvg,
    registered:r.registeredAt||'',
    hours:r.work.hours==null?-1:r.work.hours,
    acc:(r.work.accStd==null&&r.work.accAdv==null)?-1:accTotal(r.work),
    until:r.work.until||'9999',
    /* 自分の担当 → 担当あり → 未登録 の順に寄せる */
    charge:r.mine?2:(r.noCharge?0:1)
  })[k];
  return list.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(typeof x==='string') return d*String(x).localeCompare(String(y),'ja');
    return d*((x||0)-(y||0));
  });
}

    '見えているのは'+MANAGER_LABEL+'全員ぶんです。'+
    '<button class="lnk" data-act="mine" style="color:var(--violet);font-weight:700">自分の担当だけに絞る</button></p>';
  h+='</div>';

  h+='<div class="grid g3" style="margin-bottom:14px">'+
    kpi('メンバー数',all.length,'人',filterNote(),'')+
    kpi('平均進捗',avg,'%','チェック済みの項目で計算','')+
    kpi('昇格面談の対象',promo.length,'人','認定グレードの項目を完了','promo')+
  '</div>';
  h+='<div class="grid g3" style="margin-bottom:14px">'+
    kpi('標準期間より遅れ',delayed.length,'人',DELAY_ALERT+'ヶ月以上の超過','delay')+
    kpi('しばらく動きなし',stale.length,'人',STALE_DAYS+'日以上動きなし','stale')+
    kpi('アタリマエに✕',ng.length,'人','UL・メンターの判定に✕がある','atarimae')+
  '</div>';

  /* グレードの分布 */
  h+='<div class="grid g2">';
  h+='<div class="card"><h2>グレードの分布 <span class="cnt">いま挑戦しているグレード</span></h2>';
  const dist={}; all.forEach(r=>dist[r.cg]=(dist[r.cg]||0)+1);
  const mx=Math.max(1,...Object.values(dist));
  h+='<div style="display:flex;align-items:flex-end;gap:6px;height:132px;padding-top:6px">';
  for(let g=1;g<=10;g++){
    const c=dist[g]||0, t=tierOf(g);
    h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end">'+
      '<span class="tiny mono" style="color:'+(c?t.hex:'#C9C5DE')+'">'+(c||'')+'</span>'+
      '<div title="Grade '+g+' '+t.name+'：'+c+'人" style="width:100%;border-radius:6px 6px 3px 3px;background:'+t.hex+
        ';opacity:'+(c?0.85:0.14)+';height:'+Math.max(3,c/mx*100)+'%"></div>'+
      '<span class="tiny muted">'+g+'</span></div>';
  }
  h+='</div><div class="tiny muted" style="margin-top:8px;display:flex;gap:12px;flex-wrap:wrap">'+
    Object.keys(TIERS).map(k=>'<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+TIERS[k].hex+';margin-right:4px"></i>'+TIERS[k].name+'</span>').join('')+
    '</div></div>';

  /* Unitごとの状況 */
  h+='<div class="card"><h2>Unitごとの状況</h2><div class="tw" style="max-height:none;box-shadow:none">'+
    '<table><thead><tr><th class="nos">Unit</th><th class="nos num">人数</th><th class="nos num">平均進捗</th>'+
    '<th class="nos num">遅れ</th><th class="nos num">動きなし</th><th class="nos num">昇格対象</th></tr></thead><tbody>';
  const byUnit={};
  ROWS.filter(r=>r.role==='member').forEach(r=>(byUnit[r.unit]=byUnit[r.unit]||[]).push(r));
  Object.keys(byUnit).sort().forEach(u=>{
    const l=byUnit[u];
    const ulName=(l[0]&&l[0].m.ul)||'';
    h+='<tr><td class="nm">'+esc(u)+(ulName?'<span class="tiny muted" style="font-weight:400"> / '+esc(ulName)+'</span>':'')+'</td>'+
      '<td class="num">'+l.length+'</td>'+
      '<td class="num">'+Math.round(l.reduce((a,r)=>a+r.overall,0)/l.length)+'%</td>'+
      '<td class="num">'+cnt(l.filter(isDelayed).length,'c')+'</td>'+
      '<td class="num">'+cnt(l.filter(isStale).length,'a')+'</td>'+
      '<td class="num">'+cnt(l.filter(r=>r.readyPromo).length,'m')+'</td></tr>';
  });
  h+='</tbody></table></div></div></div>';

  /* 登録状況 — 一括投入ではなく、使い始めた人から順に増えていく。
     ここの数字は上のKPIと同じ filtered() を通す。以前は「登録済み」だけが
     絞り込みを無視した全件（ROWS.length）だったため、上の「メンバー数」と
     食い違って見えていた。 */
  const reg=filtered();
  const newest=reg.filter(r=>r.registeredAt).sort((a,b)=>String(b.registeredAt).localeCompare(String(a.registeredAt)));
  const last7=newest.filter(r=>r.regDays!=null&&r.regDays<=7).length;
  const noProfile=reg.filter(r=>!r.m.join_date||!r.m.unit);
  const hidden=ROWS.length-reg.length;
  h+='<div class="card"><h2>登録状況 <span class="cnt">メンバーが自分で登録した分だけ集まります</span></h2>'+
    '<div class="grid g3" style="margin-bottom:12px">'+
      kpi('登録済み',reg.length,'人',filterNote(),'')+
      kpi('直近7日の新規登録',last7,'人',filterNote(),'')+
      kpi('情報が足りない人',noProfile.length,'人','Unitか入社日が未入力','')+
    '</div>';
  if(hidden>0) h+='<p class="tiny muted" style="margin:0 0 10px">'+
    'いまの絞り込みで <b>'+hidden+'人</b> を表示から外しています（登録は全部で'+ROWS.length+'人）。'+
    '<button class="lnk" data-act="clearFilters" style="color:var(--violet);font-weight:700">絞り込みをすべて外す</button></p>';
  if(noProfile.length){
    h+='<p class="tiny muted" style="margin:0 0 8px">入社日が空の人は昇格予定を計算できません。'+
      '名前を押して<b>設定</b>タブから補ってください（本人にマイシートで入れてもらってもOK）。</p>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">'+
      noProfile.slice(0,18).map(r=>'<span class="chip a">'+esc(r.name)+
        (!r.m.unit?'（Unit）':'')+(!r.m.join_date?'（入社日）':'')+'</span>').join('')+
      (noProfile.length>18?'<span class="tiny muted">ほか'+(noProfile.length-18)+'名</span>':'')+'</div>';
  }
  h+='<div class="tiny muted" style="font-weight:700;margin-bottom:4px">最近登録した人</div>'+
    '<div class="tw" style="max-height:none;box-shadow:none"><table><thead><tr>'+
    '<th class="nos nm">名前</th><th class="nos">Unit</th><th class="nos">UL</th>'+
    '<th class="nos">入社日</th><th class="nos">登録日</th></tr></thead><tbody>'+
    newest.slice(0,6).map(r=>'<tr><td class="nm">'+memberLink(r)+'</td><td>'+esc(r.unit)+'</td>'+
      '<td>'+esc(r.m.ul||'—')+'</td><td>'+(r.m.join_date?fmtDateFull(r.m.join_date):'<span class="chip a">未入力</span>')+'</td>'+
      '<td>'+fmtDateFull(r.registeredAt)+'<span class="tiny muted"> ・'+relDays(r.registeredAt)+'</span></td></tr>').join('')+
    '</tbody></table></div></div>';

  /* いま見るべき人 */
  const focus=all.map(r=>({r:r,a:alertsOf(r)}))
    .filter(x=>x.a.indexOf('delay')>=0||x.a.indexOf('stale')>=0||x.a.indexOf('promo')>=0)
    .sort((a,b)=>b.a.length-a.a.length).slice(0,12);
  h+='<div class="card"><h2>いま見るべき人 <span class="cnt">遅れ・動きなし・昇格対象を優先で</span></h2>';
  if(!focus.length) h+='<div class="empty">気になる人はいません。</div>';
  else{
    h+='<div class="tw" style="max-height:none;box-shadow:none"><table><thead><tr>'+
      '<th class="nos nm">名前</th><th class="nos">Unit</th><th class="nos">挑戦中</th><th class="nos num">進捗</th>'+
      '<th class="nos">状況</th><th class="nos">いちばん詰まっているところ</th></tr></thead><tbody>';
    focus.forEach(x=>{
      const r=x.r;
      const st=stuckDisplay(r);
      h+='<tr><td class="nm">'+memberLink(r)+'</td><td>'+esc(r.unit)+'</td><td>'+gradeChip(r.cg)+'</td>'+
        '<td class="num">'+r.pct+'%</td><td>'+x.a.map(a=>alertChip(a)).join(' ')+'</td>'+
        '<td style="white-space:normal;max-width:340px" class="tiny">'+(st[0]?esc(st[0].cat.split('｜')[0])+'：'+esc(cut(st[0].t,46)):'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  /* 直近の申し送り */
  const recent=A.notes.filter(n=>!F.unit||(BY_ID[n.member_id]&&BY_ID[n.member_id].unit===F.unit)).slice(0,8);
  h+='<div class="card"><h2>直近の申し送り <span class="cnt">最新8件</span>'+
    '<span class="spacer"></span><button class="btn ghost sm" data-act="tab" data-tab="notes">すべて見る</button></h2>';
  h+= recent.length? recent.map(noteHTML).join('') : '<div class="empty">まだ記録がありません。</div>';
  h+='</div>';
  return h;
}
function kpi(lab,val,unit,sub,alert){
  return '<div class="kpi'+(alert?' click':'')+'"'+(alert?' data-act="alert" data-a="'+alert+'"':'')+'>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+'<small>'+unit+'</small></div>'+
    '<div class="sub">'+esc(sub)+'</div></div>';
}
function cnt(n,c){ return n? '<span class="chip '+c+'">'+n+'</span>' : '<span class="muted">0</span>'; }

/* ------------------------------------------------------------
   いま効いている絞り込みを、そのまま言葉にして返す。
   KPIの数字が減っているとき「なぜこの数なのか」をその場で読めるように、
   Unitだけでなく役割・自分の担当・アラート・検索語まで全部書き出す。
   （以前は Unit しか出していなかったため、検索が残っていても
     「全Unit」と表示されて数字だけ減って見えていた）
   ------------------------------------------------------------ */
function filterNote(){
  const p=[F.unit||'全Unit'];
  p.push(F.role==='member' ? 'メンバーのみ'
       : F.role==='manager'? MANAGER_LABEL+'のみ'
       :                     MANAGER_LABEL+'を含む');
  if(F.mine) p.push('自分の担当だけ');
  if(F.alert) p.push((ALERT_LABEL[F.alert]||[F.alert])[0]+'だけ');
  if(F.q.trim()) p.push('検索「'+F.q.trim()+'」');
  return p.join(' / ');
}

/* ------------------------------------------------------------
   リマインド文をつくってコピーする。
   Slackに貼るところまでが1動作で終わるように、宛名と期限と
   URLを入れた定型文にしている。
   ------------------------------------------------------------ */
const APP_URL=location.origin+location.pathname.replace(/admin\.html$/,'');
function remindText(){
  const list=filtered().filter(r=>r.role==='member')
    .filter(isStale);
  if(!list.length) return null;
  return '【キャリアステップの更新をお願いします】\n'+list.map(r=>'@'+r.name).join(' ')+'\n'+
    STALE_DAYS+'日以上、チェックが動いていません。できたことがあれば入れておいてください。\n'+APP_URL;
}
const ALERT_LABEL={delay:['遅れ','c'],stale:['動きなし','a'],promo:['昇格対象','m'],atarimae:['アタリマエ✕','c']};
function alertChip(a){ const x=ALERT_LABEL[a]||[a,'g']; return '<span class="chip '+x[1]+'">'+x[0]+'</span>'; }
function cut(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }

/* ------------------------------------------------------------
   一覧が空のとき、「まだ誰も登録していない」のか
   「絞り込みで消えているだけ」なのかを区別して出す。
   既定の絞り込みは「メンバーのみ」なので、管理者キーでULに昇格した人
   （UL・メンター）しか登録していない段階では0件になる。

function rosterEmpty(){
  if(!ROWS.length) return '<b>まだ誰も登録していません</b>'+
    '<p class="tiny muted" style="margin:8px 0 0;line-height:1.9">'+
    'メンバーが本人用の画面から自分の情報を登録すると、ここに順に増えていきます。<br>'+
    'アプリのURLと共通パスコードを共有してください。</p>';
  const managers=ROWS.filter(r=>r.role!=='member').length;
  const why=[];
  if(F.role==='member')  why.push('「メンバーのみ」で絞っています'+
    (managers?'（'+MANAGER_LABEL+'が'+managers+'人いますが、この絞り込みでは出ません）':''));
  if(F.role==='manager') why.push('「'+MANAGER_LABEL+'のみ」で絞っています');
  if(F.mine)             why.push('「自分の担当だけ」で絞っています');
  if(F.unit)  why.push('Unitを「'+esc(F.unit)+'」で絞っています');
  if(F.alert) why.push('アラートで絞っています');
  if(F.q)     why.push('「'+esc(F.q)+'」で検索しています');
  return '<b>絞り込みに合う人がいません</b>'+
    '<p class="tiny muted" style="margin:8px 0 0;line-height:1.9">登録は'+ROWS.length+'人あります。<br>'+
    (why.length?why.join('<br>')+'<br>':'')+'</p>'+
    '<button class="btn ghost" style="margin-top:10px" data-act="clearFilters">絞り込みをすべて外す</button>';

function vRoster(){

    (cols.indexOf('heat')>=0?'マスの並びは Grade 1〜10 で、'+
      '<i class="hm" style="display:inline-flex;vertical-align:-3px"><i class="f"></i></i> 完了 '+

  h+='<div class="tw"><table><thead><tr>'+th('name','名前','nm')+

      return c.sort? th(c.sort,c.h,c.cls,c.tip)

    '見出しにカーソルを合わせると、その列の意味が出ます。</p>';

}
function csvRoster(){
  const rows=[['名前','Unit','UL','メンター','入社日','在籍月数','認定グレード','完了グレード数','挑戦中グレード',
    '挑戦中の進捗%','全体進捗%','昇格予定','標準比（月）','最終更新','テスト平均%','申し送り件数','アタリマエ✕',
    '強いカテゴリ','弱いカテゴリ','週の稼働時間','スタンダード社数','アドバンス社数','卒業予定','得意領域',
    '詰まっている項目1','詰まっている項目2','登録日']];
  /* 強み・弱みは、編成をスプレッドシートで検討するときに使う */
  const topCat=(r,worst)=>{
    const cs=(r.cats||[]).slice().sort((a,b)=>worst? a.pct-b.pct : b.pct-a.pct);
    return cs.length? cs[0].n+'（'+cs[0].pct+'%）' : '';
  };
  sorted(filtered()).forEach(r=>rows.push([r.name,r.unit,r.m.ul||'',r.m.mentor||'',r.m.join_date||'',
    r.months==null?'':r.months.toFixed(1),r.certified||'',r.cleared,r.cg,r.pct,r.overall,
    r.outlook.targetDate||'',r.delay==null?'':r.delay,r.lastCheck?String(r.lastCheck).slice(0,10):'',
    r.quizAvg==null?'':r.quizAvg,r.noteCount,
    r.ngAtarimae.length?r.ngAtarimae.join(' / '):'',
    topCat(r,false), topCat(r,true),
    r.work.hours==null?'':r.work.hours, r.work.accStd==null?'':r.work.accStd,
    r.work.accAdv==null?'':r.work.accAdv, r.work.until||'', r.work.skills.join(' / '),
    r.stuck[0]?r.stuck[0].cat+'：'+r.stuck[0].t:'', r.stuck[1]?r.stuck[1].cat+'：'+r.stuck[1].t:'',
    r.registeredAt?String(r.registeredAt).slice(0,10):'']));
  downloadCSV('キャリアステップ現状一覧_'+todayStr()+'.csv',rows);
  toast('CSVを書き出しました');
}

function vPromo(){
  const list=filtered().filter(r=>r.role==='member');
  let h='<h1 class="h1 disp">昇格と詰まり</h1>'+
    '<p class="lead">誰がいつ昇格しそうか、どこで止まっているか。リーダーMTGの前にここだけ見れば足ります。</p>';

  h+='<div class="card"><h2>昇格面談の対象 <span class="cnt">認定グレードの項目を完了している人</span></h2>';
  if(!ready.length) h+='<div class="empty">いまはいません。</div>';
  else{
    h+='<div class="tw" style="max-height:none;box-shadow:none"><table><thead><tr>'+
      '<th class="nos nm">名前</th><th class="nos">Unit</th><th class="nos num">認定G</th><th class="nos num">完了G</th>'+
      '<th class="nos num">在籍</th><th class="nos">直近の面談記録</th><th class="nos"></th></tr></thead><tbody>';
    ready.forEach(r=>{
      const iv=r.notes.filter(n=>n.kind==='promotion'||n.kind==='interview')[0];
      h+='<tr><td class="nm">'+memberLink(r)+'</td><td>'+esc(r.unit)+'</td>'+
        '<td class="num">G'+r.certified+'</td><td class="num"><b style="color:var(--mint)">'+r.cleared+'</b></td>'+
        '<td class="num">'+(r.months==null?'—':r.months.toFixed(1)+'ヶ月')+'</td>'+
        '<td class="tiny">'+(iv?fmtDateFull(iv.occurred_on)+'　'+esc(cut(iv.body,44)):'<span class="muted">記録なし</span>')+'</td>'+
        '<td><button class="btn vio sm" data-act="openNote" data-id="'+r.id+'" data-kind="promotion">昇格面談メモを書く</button></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  /* 昇格予定のタイムライン（リーダー等級以上は「遅れ」と同じ理由で対象外） */
  const withT=list.filter(r=>r.outlook.targetDate && !isSeniorTier(r.cg))
    .sort((a,b)=>String(a.outlook.targetDate).localeCompare(String(b.outlook.targetDate)));
  const byMonth={};
  withT.forEach(r=>{ const k=String(r.outlook.targetDate).slice(0,7); (byMonth[k]=byMonth[k]||[]).push(r); });
  h+='<div class="card"><h2>昇格予定の時期 <span class="cnt">入社日＋標準期間（手動の上書きがあればそちら）。リーダー等級以上は対象外</span></h2>';
  const keys=Object.keys(byMonth).sort();
  if(!keys.length) h+='<div class="empty">入社日が未登録のため計算できません。</div>';
  else{
    h+='<div class="grid g3">';
    keys.forEach(k=>{
      const past=k<monthlyPeriod();
      h+='<div style="border:1.5px solid '+(past?'#F5CBD3':'var(--line)')+';border-radius:12px;padding:11px 12px'+(past?';background:#FFFAFB':'')+'">'+
        '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:7px">'+
        '<b class="mono" style="font-size:14px">'+k.replace('-','/')+'</b>'+
        '<span class="tiny muted">'+byMonth[k].length+'人</span>'+
        (past?'<span class="chip c" style="margin-left:auto">予定を過ぎている</span>':'')+'</div>';
      byMonth[k].forEach(r=>{
        h+='<div style="display:flex;gap:6px;align-items:center;padding:3px 0;font-size:12px">'+
          memberLink(r)+'<span class="tiny muted">→G'+(r.cg+1>10?10:r.cg+1)+'</span>'+
          '<span class="tiny muted" style="margin-left:auto">'+r.pct+'%</span></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';

  /* 詰まっている項目のランキング（リーダー等級以上は集計に含めない） */
  const tally={};
  list.forEach(r=>stuckDisplay(r).forEach(it=>{
    const k=it.t;
    (tally[k]=tally[k]||{t:it.t,cat:it.cat,grades:{},who:[]});
    tally[k].grades[gradeOf(it.id)]=true;
    tally[k].who.push(r);
  }));
  const rank=Object.values(tally).sort((a,b)=>b.who.length-a.who.length).slice(0,20);
  h+='<div class="card"><h2>詰まっている項目 <span class="cnt">挑戦中グレードで未達の人が多い順・上位20</span></h2>';
  if(!rank.length) h+='<div class="empty">未達の項目はありません。</div>';
  else{
    const mx=rank[0].who.length;
    h+='<div class="tw" style="max-height:none;box-shadow:none"><table><thead><tr>'+
      '<th class="nos" style="width:70px">人数</th><th class="nos">項目</th><th class="nos">カテゴリ</th><th class="nos">Grade</th><th class="nos">誰が</th></tr></thead><tbody>';
    rank.forEach(x=>{
      h+='<tr><td><div style="display:flex;align-items:center;gap:6px"><b class="mono">'+x.who.length+'</b>'+
        '<span class="mini" style="min-width:34px"><i style="width:'+(x.who.length/mx*100)+'%;background:var(--coral)"></i></span></div></td>'+
        '<td style="white-space:normal;max-width:440px">'+esc(x.t)+'</td>'+
        '<td class="tiny muted">'+esc(x.cat.split('｜')[0])+'</td>'+
        '<td class="tiny">'+Object.keys(x.grades).sort((a,b)=>a-b).map(g=>'G'+g).join(', ')+'</td>'+
        '<td style="white-space:normal;max-width:300px" class="tiny">'+
          x.who.slice(0,6).map(r=>memberLink(r)).join('、')+(x.who.length>6?' ほか'+(x.who.length-6)+'名':'')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  /* カテゴリ別の未達率（リーダー等級以上は集計に含めない） */
  h+='<div class="card"><h2>カテゴリ別のつまずき <span class="cnt">挑戦中グレードの未達項目をカテゴリでまとめたもの</span></h2>';
  const cat={};
  list.forEach(r=>stuckDisplay(r).forEach(it=>{
    const key=CATS.find(c=>c.k==='vision'? it.vision : it.cat.indexOf(c.k)===0);
    const k=key?key.n:'その他';
    cat[k]=(cat[k]||0)+1;
  }));
  const cks=Object.keys(cat).sort((a,b)=>cat[b]-cat[a]);
  if(!cks.length) h+='<div class="empty">—</div>';
  else{
    const mx=cat[cks[0]];
    h+='<div style="display:flex;flex-direction:column;gap:7px">';
    cks.forEach(k=>{
      h+='<div style="display:flex;align-items:center;gap:10px">'+
        '<span style="width:150px;flex:0 0 auto;font-size:12px;font-weight:700">'+esc(k)+'</span>'+
        '<span class="mini" style="flex:1;height:9px"><i style="width:'+(cat[k]/mx*100)+'%;background:linear-gradient(90deg,var(--violet),var(--coral))"></i></span>'+
        '<b class="mono" style="width:44px;text-align:right;font-size:12px">'+cat[k]+'</b></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function csvStuck(){
  const rows=[['名前','Unit','挑戦中グレード','進捗%','カテゴリ','未達の項目']];

    rows.push([r.name,r.unit,r.cg,r.pct,it.cat,it.t])));

}

function readNoteForm(){
  const g=id=>document.getElementById(id);
  NF.member_id=(g('nfMember')||{}).value||NF.member_id;
  NF.occurred_on=(g('nfDate')||{}).value||todayStr();
  NF.grade=(g('nfGrade')||{}).value||'';
  NF.body=(g('nfBody')||{}).value||'';
  NF.next_action=(g('nfNext')||{}).value||'';
}
async function saveNote(){
  readNoteForm();
  if(!NF.member_id){ toast('だれについての記録か選んでください','bad'); return; }
  if(!NF.body.trim()){ toast('内容を入力してください','bad'); return; }
  const payload={ member_id:NF.member_id, kind:NF.kind, occurred_on:NF.occurred_on,
    grade:NF.grade?+NF.grade:null, body:NF.body.trim(), next_action:NF.next_action.trim()||null,
    visibility:NF.visibility };
  try{
    if(NF.editing) await Store.updateNote(NF.editing,payload);
    else await Store.addNote(payload);
    NF={ member_id:'', kind:'memo', occurred_on:'', grade:'', body:'', next_action:'', visibility:'shared', open:false, editing:null };
    await loadAll(); render();
    toast('保存しました');
  }catch(e){ toast(e.message||'保存に失敗しました','bad'); }
}

}

let SF={ open:false, member_id:'', quiz_name:'', score:'', max_score:'10', taken_on:'' };

function quizNames(){
  const s=new Set(); A.scores.forEach(x=>s.add(x.quiz_name));
  return Array.from(s).sort();
}
function vScores(){
  const list=sorted(filtered());
  const qs=quizNames();
  let h='<h1 class="h1 disp">テスト点数</h1>'+
    '<p class="lead">ラーニングボックス等のテスト結果。本人の画面には自分の結果だけが出て、ここでは全員分を並べて見られます。</p>';
  h+='<div class="banner" style="background:var(--sky-soft);border-color:#C9E2F6"><span>📥</span><div>'+
    '<b>ラーニングボックスの結果を取り込む</b><br>'+
    '<a href="https://orient-quiz.vercel.app/admin.html" target="_blank" rel="noopener">クイズの管理画面</a> から結果をCSVで書き出し、'+
    'ここで取り込んでください。列は <code>名前, テスト名, 点数, 満点, 受験日</code> の順、または同名のヘッダー行があれば順不同で読めます。'+
    '同じ（名前・テスト名・受験日）の行は上書きされるので、同じCSVを何度取り込んでも増えません。</div></div>';
  h+=barFilters({right:
    '<button class="btn ghost" data-act="importCSV">CSVを取り込む</button>'+
    '<button class="btn ghost" data-act="csvScores">CSVで書き出す</button>'+
    '<button class="btn vio" data-act="newScore">＋ 手で追加</button>'});

  if(SF.open) h+=scoreFormHTML();

  if(!qs.length){
    h+='<div class="card"><div class="empty">まだテスト結果がありません。CSVを取り込むか、手で追加してください。</div></div>';
    return h;
  }
  /* メンバー × テスト のマトリクス */
  h+='<div class="tw"><table><thead><tr><th class="nos nm">名前</th><th class="nos">Unit</th>'+
    qs.map(q=>'<th class="nos num" title="'+esc(q)+'">'+esc(cut(q,14))+'</th>').join('')+
    '<th class="nos num">平均</th></tr></thead><tbody>';
  list.forEach(r=>{
    h+='<tr><td class="nm">'+memberLink(r)+'</td><td>'+esc(r.unit)+'</td>';
    qs.forEach(q=>{
      /* 同じテストが複数回あるときは最新の受験を見る */
      const hits=r.scores.filter(s=>s.quiz_name===q).sort((a,b)=>String(b.taken_on).localeCompare(String(a.taken_on)));
      const s=hits[0];
      if(!s){ h+='<td class="num"><span class="muted">—</span></td>'; return; }
      const rate=s.max_score? Math.round(+s.score/+s.max_score*100) : null;
      const cls = s.passed===true ? 'm' : (rate!=null&&rate>=90?'m':(rate!=null&&rate>=70?'a':'c'));
      h+='<td class="num" title="'+esc(q)+'　'+fmtDateFull(s.taken_on)+(hits.length>1?'（'+hits.length+'回受験）':'')+'">'+
        '<span class="chip '+cls+'">'+s.score+(s.max_score?'/'+s.max_score:'')+'</span></td>';
    });
    h+='<td class="num mono">'+(r.quizAvg==null?'—':r.quizAvg+'%')+'</td></tr>';
  });
  h+='</tbody></table></div>';

  /* テストごとの状況 */
  h+='<div class="card" style="margin-top:14px"><h2>テストごとの状況</h2>'+
    '<div class="tw" style="max-height:none;box-shadow:none"><table><thead><tr>'+
    '<th class="nos">テスト</th><th class="nos num">受験</th><th class="nos num">未受験</th>'+

/* CSV取込。ヘッダー行があれば列名で、無ければ 名前/テスト名/点数/満点/受験日 の順で読む */
async function importCSVText(text){
  const rows=parseCSV(text);
  if(!rows.length){ toast('CSVを読み取れませんでした','bad'); return; }
  const HEAD={name:['名前','氏名','ユーザー名','user','name','受験者'],
    quiz:['テスト名','テスト','クイズ名','quiz','title','コース名'],
    score:['点数','得点','score','スコア','正答数'],
    max:['満点','配点','max','max_score','問題数'],
    date:['受験日','日付','date','受験日時','完了日']};
  let idx={name:0,quiz:1,score:2,max:3,date:4}, start=0;
  const h0=rows[0].map(c=>String(c).trim().toLowerCase());
  const find=keys=>h0.findIndex(c=>keys.some(k=>c===String(k).toLowerCase()||c.indexOf(String(k).toLowerCase())>=0));
  if(find(HEAD.name)>=0 && find(HEAD.score)>=0){
    idx={name:find(HEAD.name),quiz:find(HEAD.quiz),score:find(HEAD.score),max:find(HEAD.max),date:find(HEAD.date)};
    start=1;
  }
  /* 名前 → メンバー。表記ゆれに強くするため空白を落として比較する */
  const norm=s=>String(s).replace(/[\s　]/g,'').toLowerCase();
  const map={}; ROWS.forEach(r=>{ map[norm(r.name)]=r.id; if(r.m.slug) map[norm(r.m.slug)]=r.id; });

  const out=[], missing=new Set();
  for(let i=start;i<rows.length;i++){
    const c=rows[i];
    const nm=c[idx.name], id=map[norm(nm||'')];
    if(!id){ if(String(nm||'').trim()) missing.add(String(nm).trim()); continue; }
    const quiz=idx.quiz>=0&&c[idx.quiz]?String(c[idx.quiz]).trim():'テスト';
    const sc=parseFloat(String(c[idx.score]).replace(/[^\d.\-]/g,''));
    if(isNaN(sc)) continue;
    const mxRaw=idx.max>=0?parseFloat(String(c[idx.max]||'').replace(/[^\d.\-]/g,'')):NaN;
    const max=isNaN(mxRaw)?null:mxRaw;
    let dt=idx.date>=0?String(c[idx.date]||'').trim():'';
    dt=dt? (dt.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)
        ? dt.replace(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2}).*/, (m,y,mo,d)=>y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'))
        : todayStr()) : todayStr();
    out.push({member_id:id,quiz_name:quiz,score:sc,max_score:max,
      passed: max? (sc/max>=0.9) : null, taken_on:dt, source:'csv'});
  }
  if(!out.length){
    toast('取り込める行がありませんでした','bad');
    if(missing.size) alert('名簿に見つからない名前がありました：\n'+Array.from(missing).slice(0,20).join('\n'));
    return;
  }
  try{
    await Store.saveScores(out);
    await loadAll(); render();
    toast(out.length+'件を取り込みました');
    if(missing.size) alert(out.length+'件を取り込みました。\n\n名簿に見つからず飛ばした名前：\n'+Array.from(missing).slice(0,20).join('\n'));
  }catch(e){ toast(e.message||'取り込みに失敗しました','bad'); }
}

/* ============================================================
   6. 期・ユニット編成
   ------------------------------------------------------------
   半期ごとに編成が変わるのに、members.unit / ul / mentor は
   1カラムしか無いので、上書きすると前期の情報が消えていた。
   ここで「期」を作って、その期の割当を別に残す。
   確定（apply_term）を押したときだけ、名簿の側に書き戻す。
   ============================================================ */
/* 編集中の割当を1人ぶん引く。まだ触っていなければ保存済みの値、
   それも無ければ いまの名簿＋マイシートの稼働 を初期値にする。 */
function asgOf(termId,r){
  if(ASG_EDIT.termId===termId && ASG_EDIT.rows[r.id]) return ASG_EDIT.rows[r.id];
  const saved=(ASG_BY_TERM[termId]||{})[r.id];
  if(saved) return {
    unit:saved.unit||'', ul:saved.ul||'', mentor:saved.mentor||'',
    weekly_hours:saved.weekly_hours==null?'':String(saved.weekly_hours),
    acc_std:saved.acc_std==null?'':String(saved.acc_std),
    acc_adv:saved.acc_adv==null?'':String(saved.acc_adv), saved:true };
  return {
    unit:r.m.unit||'', ul:r.m.ul||'', mentor:r.m.mentor||'',
    weekly_hours:r.work.hours==null?'':String(r.work.hours),
    acc_std:r.work.accStd==null?'':String(r.work.accStd),
    acc_adv:r.work.accAdv==null?'':String(r.work.accAdv), saved:false };
}
/* 描き直したあとに同じ欄へ焦点を戻せるよう、入力欄にはidを振っておく
   （shared/ui.js の withFocus は id を手がかりにしている） */
function asgId(r,k){ return 'asg_'+String(r.id).replace(/[^A-Za-z0-9_-]/g,'')+'_'+k; }
function asgSet(termId,memberId,key,val){
  if(ASG_EDIT.termId!==termId) ASG_EDIT={termId:termId,rows:{},dirty:false};
  const r=BY_ID[memberId]; if(!r) return;
  const cur=Object.assign({},asgOf(termId,r));
  cur[key]=val;
  ASG_EDIT.rows[memberId]=cur; ASG_EDIT.dirty=true;
}
/* 期のメンバー（卒業・退職した人は入れない） */
function termMembers(){ return ROWS.filter(r=>r.role==='member'); }

/* Unitごとの集計。編成のバランスを見るための数字をまとめて出す。
   getUnit は「その人をどのUnitとして数えるか」を返す関数。 */
function unitStats(list,getUnit){
  const by={};
  list.forEach(r=>{
    const u=getUnit(r)||'（未設定）';
    const o=by[u]=by[u]||{unit:u,members:[],hours:0,std:0,adv:0,junior:0,senior:0,
                          promo:0,delayed:0,leaving:0,cats:{}};
    o.members.push(r);
    if(r.work.hours!=null) o.hours+=r.work.hours;
    o.std+=r.work.accStd||0; o.adv+=r.work.accAdv||0;
    if(r.cg<=2) o.junior++;
    if(r.cg>=5) o.senior++;
    if(r.readyPromo) o.promo++;
    if(isDelayed(r)) o.delayed++;
    const d=daysUntil(r.work.until);
    if(d!=null && d>=0 && d<=183) o.leaving++;
    (r.cats||[]).forEach(c=>{ const x=o.cats[c.k]=o.cats[c.k]||{n:c.n,d:0,t:0}; x.d+=c.d; x.t+=c.t; });
  });
  return Object.values(by).map(o=>{
    o.n=o.members.length;
    o.avgOverall=o.n? Math.round(o.members.reduce((a,r)=>a+r.overall,0)/o.n) : 0;
    o.avgGrade=o.n? Math.round(o.members.reduce((a,r)=>a+r.cg,0)/o.n*10)/10 : 0;
    /* 育成負荷比＝スターター／プレイヤー前半の人数 ÷ プロ以上の人数。
       面倒を見られる人が足りているかの目安。senior が0なら「見る人がいない」 */
    o.load = o.senior? Math.round(o.junior/o.senior*10)/10 : (o.junior? null : 0);
    o.catList=Object.keys(o.cats).map(k=>({k:k,n:o.cats[k].n,
      pct:o.cats[k].t? Math.round(o.cats[k].d/o.cats[k].t*100):0}));
    return o;
  }).sort((a,b)=>String(a.unit).localeCompare(String(b.unit),'ja'));
}
/* そのUnitに出す警告。編成の穴を、数字を読まなくても気づけるようにする */
function unitWarnings(o){
  const w=[];
  if(!o.senior) w.push('プロ以上（G5+）が0人。アドバンス対応と面倒見を任せられる人がいません');
  else if(o.load!=null && o.load>=2) w.push('育成負荷が高い（G1-2が'+o.junior+'人に対しG5+が'+o.senior+'人）');
  if(o.leaving>=2) w.push('半年以内に'+o.leaving+'人が卒業・稼働終了の予定');
  if(o.promo>=3) w.push('昇格面談の対象が'+o.promo+'人。面談が集中します');
  /* 弱いカテゴリ。ぜんぶ弱い（＝まだ全員が新人）ときは、
     並べても編成の判断材料にならないので出さない。
     カテゴリ名に「・」が入るものがあるので、区切りは「／」にする。 */
  const weak=o.catList.filter(c=>c.pct<=20).sort((a,b)=>a.pct-b.pct);
  if(weak.length && weak.length<=Math.ceil(o.catList.length/2))
    w.push('手がついていないカテゴリ：'+weak.slice(0,2).map(c=>c.n+'（'+c.pct+'%）').join('／'));
  return w;
}

/* ============================================================
   編成ボード
   ------------------------------------------------------------
   表で1行ずつUnitを選び直すのは、編成を「考える」作業には向かない。
   カードを動かしながら、その場でバランスが変わるのを見られるようにする。
   （表のほうも残してある。キーボードだけで操作したいときはそちら）
   ============================================================ */
let DRAG=null;
const NOUNIT='（未配属）';
/* ボードに出す列。config の UNITS と、名簿にすでに居るUnit。
   誰も居ない列も出す（そこへ動かせないと編成にならないため）。 */
function boardColumns(list,getUnit){
  const inUse=Array.from(new Set(list.map(getUnit)));
  const all=unitOptions(rosterUnitValues()).concat(inUse).filter(u=>u&&u!==NOUNIT);
  const cols=Array.from(new Set(all)).sort((a,b)=>String(a).localeCompare(String(b),'ja'));
  /* 未配属は左端。編成はここから配っていくので、いちばん先に目に入る場所に置く */
  return [NOUNIT].concat(cols);
}
function memberCardHTML(r,getUnit){

/* 自動で割り振る（叩き台）。
   1. 「同じユニットにする」決めごとでまとめたかたまりを作る
   2. プロ以上（G5+）を含むかたまりを各ユニットに1つずつ配る
      （面倒を見られる人が1人もいないユニットを作らない）
   3. 残りを、そのときいちばん稼働時間の合計が少ないユニットへ入れていく
      （「別のユニットにする」決めごとに当たる場所は避ける）
   相性・本人の希望・クライアントの事情は数字に出ないので、あくまで叩き台。 */
function autoAssign(term){
  const list=termMembers();
  if(!list.length) return 0;
  const cols=boardColumns(list,r=>normalizeUnit(asgOf(term.id,r).unit)||NOUNIT).filter(u=>u!==NOUNIT);
  /* 未配属の列には自動では入れない（配るのが目的なので） */
  if(!cols.length) return 0;

  /* 1. かたまりを作る（union-find） */
  const parent={}; list.forEach(r=>parent[r.id]=r.id);
  const find=x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  const uni=(a,b)=>{ const ra=find(a),rb=find(b); if(ra!==rb) parent[ra]=rb; };
  pairs().filter(p=>p.type==='together').forEach(p=>{ if(BY_ID[p.a]&&BY_ID[p.b]) uni(p.a,p.b); });
  const groups={};
  list.forEach(r=>{ const k=find(r.id); (groups[k]=groups[k]||[]).push(r); });
  const gs=Object.values(groups).map(members=>({
    members:members,
    hours:members.reduce((a,r)=>a+(r.work.hours||0),0),
    maxGrade:Math.max.apply(null,members.map(r=>r.cg)),
    hasSenior:members.some(r=>r.cg>=5)
  }));

  /* 「別のユニットにする」は、かたまり同士の禁止関係にする */
  const apart={};
  pairs().filter(p=>p.type==='apart').forEach(p=>{
    if(!BY_ID[p.a]||!BY_ID[p.b]) return;
    const ka=find(p.a), kb=find(p.b);
    (apart[ka]=apart[ka]||new Set()).add(kb);
    (apart[kb]=apart[kb]||new Set()).add(ka);
  });
  const keyOf=g=>find(g.members[0].id);

  const bucket={}; cols.forEach(u=>bucket[u]={hours:0,n:0,keys:[]});
  const place=(g,u)=>{ bucket[u].hours+=g.hours; bucket[u].n++; bucket[u].keys.push(keyOf(g)); g.unit=u; };
  const allowed=(g,u)=>{
    const ban=apart[keyOf(g)]; if(!ban) return true;
    return !bucket[u].keys.some(k=>ban.has(k));
  };
  const pick=g=>{
    const ok=cols.filter(u=>allowed(g,u));
    const pool=ok.length?ok:cols;   /* どこにも置けないときは決めごとより配置を優先する */
    return pool.slice().sort((a,b)=>(bucket[a].hours-bucket[b].hours)||(bucket[a].n-bucket[b].n)
      ||String(a).localeCompare(String(b),'ja'))[0];
  };

  /* 2. 面倒を見られる人を先に配る */
  const seniors=gs.filter(g=>g.hasSenior).sort((a,b)=>b.maxGrade-a.maxGrade||b.hours-a.hours);
  const rest=gs.filter(g=>!g.hasSenior).sort((a,b)=>b.hours-a.hours||b.maxGrade-a.maxGrade);
  let ci=0;
  seniors.forEach(g=>{
    if(ci<cols.length){
      /* まだ誰も居ない列から順に。禁止に当たる場合は置ける列を探す */
      let u=cols[ci];
      if(!allowed(g,u)){ const alt=cols.find(x=>bucket[x].n===0&&allowed(g,x)); if(alt) u=alt; }
      place(g,u); ci++;
    }else place(g,pick(g));
  });
  rest.forEach(g=>place(g,pick(g)));

  /* 3. 結果を編集中の割当に書き戻す */
  gs.forEach(g=>g.members.forEach(r=>asgSet(term.id,r.id,'unit',g.unit)));
  return list.length;
}

/* ============================================================
   引き継ぎシート
   ------------------------------------------------------------
   期が変わるとき、前のULが次のULに渡すぶんを構造化して残す。
   自由記述のメモにすると「書く人は書く／書かない人は書かない」に
   なるので、項目を決めて、記入率で未記入の人を名指しできるようにする。
   ここがいちばん引き継ぎの質を左右する。

   置き場所は「移る先の期」の割当（assignments.handover）。
   書くのは前のULなので、誰に催促すればいいかは「前の期のUL」で束ねる。
   ============================================================ */
const HO_FIELDS=[
  {k:'strength', n:'強み',                   req:true,
   ph:'具体的なエピソードで。「数字に強い」ではなく「先月のCV改善は自分で仮説を立てて検証していた」'},
  {k:'weakness', n:'苦手・つまずきやすいところ', req:true,
   ph:'「納期が重なると抱え込んで黙る」など、次のULが先回りできる形で'},
  {k:'comm',     n:'コミュニケーションのクセ',  req:false,
   ph:'褒め方・詰め方・レスの速さ・テキストと口頭どちらが通じるか'},
  {k:'landmine', n:'地雷',                   req:false,
   ph:'これを言うと固まる／このやり方だと動かない、など'},
  {k:'next',     n:'次のULにまず最初にやってほしいこと', req:true,
   ph:'「初回の1on1で、アドバンス2社目を持つ気があるか確認してほしい」など'}
];
function hoOf(termId,memberId){
  const a=(ASG_BY_TERM[termId]||{})[memberId];
  return (a&&a.handover)||{};
}
/* 必須3つが埋まっていれば「記入済み」とする */
function hoDone(h){
  return HO_FIELDS.filter(f=>f.req).every(f=>String((h||{})[f.k]||'').trim());
}
/* その期の引き継ぎ状況。前の期のUL（いなければいまのUL）ごとに束ねる */
function hoStatus(term){
  const prev=prevTermOf(term);
  const from=prev? (ASG_BY_TERM[prev.id]||{}) : null;
  const cur=ASG_BY_TERM[term.id]||{};
  const rows=termMembers().filter(r=>cur[r.id]).map(r=>{
    const before=from? from[r.id] : null;
    const writer=String((before&&before.ul)||r.m.ul||'').trim()||'（前のULが未登録）';
    return { r:r, writer:writer, h:hoOf(term.id,r.id), done:hoDone(hoOf(term.id,r.id)),
             to:String(cur[r.id].ul||'').trim()||'—' };
  });
  const by={};
  rows.forEach(x=>{ (by[x.writer]=by[x.writer]||[]).push(x); });
  return { rows:rows, byWriter:by,
           done:rows.filter(x=>x.done).length, total:rows.length };
}
function hoCardHTML(term){
  const st=hoStatus(term);
  let h='<div class="card"><h2>引き継ぎシート '+
    '<span class="cnt">前のULが、次のULに渡すぶんを書きます</span>'+
    '<span class="spacer"></span>'+
    (st.done? '<button class="btn ghost sm" data-act="printSheets" data-id="'+term.id+'">'+
      '記入済みをまとめて印刷</button>' : '')+'</h2>';
  if(!st.total) return h+'<div class="empty">この期の割当がまだありません。<br>'+
    '上で割当を取り込むと、1人ずつシートを書けるようになります。</div></div>';

  const pct=Math.round(st.done/st.total*100);
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">'+
    '<b class="mono" style="font-size:17px">'+st.done+' / '+st.total+'</b>'+
    '<span class="mini" style="flex:1;height:10px"><i style="width:'+pct+'%;background:'+
      (pct===100?'var(--mint)':'var(--violet)')+'"></i></span>'+
    '<b class="mono" style="font-size:12px">'+pct+'%</b></div>'+
    '<p class="tiny muted" style="margin:0 0 12px">'+
    (pct===100? '全員ぶんそろいました。上の「まとめて印刷」で新しいULに渡せます。'
      : '「強み」「苦手・つまずきやすいところ」「次のULにまず最初にやってほしいこと」の3つが'+
        '埋まったら記入済みとして数えます。')+'</p>';

  const writers=Object.keys(st.byWriter).sort((a,b)=>a.localeCompare(b,'ja'));
  h+='<div class="tw" style="max-height:none;box-shadow:none"><table><thead><tr>'+
    '<th class="nos nm">書く人（前のUL）</th><th class="nos num">記入</th>'+
    '<th class="nos">まだ書けていない人</th><th class="nos"></th></tr></thead><tbody>';
  writers.forEach(w=>{
    const list=st.byWriter[w], rest=list.filter(x=>!x.done);
    h+='<tr><td class="nm">'+esc(w)+'</td>'+
      '<td class="num"><b class="mono">'+(list.length-rest.length)+'</b>'+
        '<span class="tiny muted">/'+list.length+'</span></td>'+
      '<td style="white-space:normal">'+(rest.length
        ? rest.map(x=>'<button class="chip a" style="margin:2px 3px 2px 0;cursor:pointer" '+
            'data-act="openHo" data-id="'+x.r.id+'" data-term="'+term.id+'">'+esc(x.r.name)+' を書く</button>').join('')
        : '<span class="chip m">そろいました</span>')+'</td>'+
      '<td></td></tr>';
  });
  h+='</tbody></table></div>';
  return h+'</div>';
}

/* ---------- カルテの「引き継ぎ」タブ ---------- */
function dwHandover(r){
  if(!Store.caps.terms) return '<div class="card"><div class="empty">'+
    'この機能を使うには supabase/schema.sql を貼り直してください（SETUP.md 手順2）。</div></div>';
  if(!TERMS.length) return '<div class="card"><div class="empty">'+
    'まだ期がありません。<br>「期・ユニット編成」タブで期をつくると、ここに引き継ぎシートが出ます。</div></div>';
  const term = termById(V.hoTerm) || currentTerm();
  const a=(ASG_BY_TERM[term.id]||{})[r.id];
  const prev=prevTermOf(term);
  const before=prev? (ASG_BY_TERM[prev.id]||{})[r.id] : null;

  let h='<div class="card"><h2>引き継ぎシート<span class="spacer"></span>'+
    '<select id="hoTermSel" style="max-width:190px">'+TERMS.map(t=>
      '<option value="'+t.id+'"'+(t.id===term.id?' selected':'')+'>'+esc(t.name)+'</option>').join('')+
    '</select></h2>';
  if(!a) return h+'<div class="empty">'+esc(term.name)+' の割当に '+esc(r.name)+' さんがいません。<br>'+
    '「期・ユニット編成」タブで取り込んでから書いてください。</div></div>';

  const h0=a.handover||{};
  h+='<p class="tiny muted" style="margin:-4px 0 12px;line-height:1.9">'+
    '<b>'+esc(prev?prev.name:'いま')+'</b> の担当（'+esc((before&&before.ul)||r.m.ul||'未登録')+'）が書いて、'+
    '<b>'+esc(term.name)+'</b> の担当（'+esc(a.ul||'未定')+'）が読みます。'+
    'ここに書いたものは本人の画面には出ません。</p>';
  if(r.concern) h+='<div class="quote warn" style="margin-bottom:12px"><b>本人が気にしていること</b>'+esc(r.concern)+'</div>';
  HO_FIELDS.forEach(f=>{
    h+='<div class="f"><label>'+esc(f.n)+
      (f.req?' <span class="chip c" style="font-weight:700">必須</span>':' <span class="muted" style="font-weight:400">（任意）</span>')+
      '</label><textarea id="ho_'+f.k+'" rows="3" placeholder="'+esc(f.ph)+'">'+esc(h0[f.k]||'')+'</textarea></div>';
  });
  h+='<button class="btn vio" data-act="saveHo" data-id="'+r.id+'" data-term="'+term.id+'">保存する</button>';
  if(h0.filled_by) h+='<p class="tiny muted" style="margin:10px 0 0">'+
    '最終更新：'+esc(h0.filled_by)+'　'+fmtDateTime(h0.filled_at)+'</p>';
  /* 書くときの手がかり。カルテと同じ内容を下に置いておく
     （タブを行き来しないと書けない、という状態にしないため） */
  return h+'</div>'+
    '<p class="tiny muted" style="margin:16px 4px 8px;font-weight:700">'+
    '書くときの手がかり（カルテと同じ内容です）</p>'+
    dwCatCard(r)+dwTrendCard(r);
}

/* 記入済みのシートを、1人1枚でまとめて紙に出す */
function printSheets(termId){
  const term=termById(termId); if(!term) return;
  const st=hoStatus(term);
  const list=st.rows.filter(x=>x.done);
  if(!list.length){ toast('記入済みのシートがありません','bad'); return; }
