<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEP｜キャリアステップシート</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='34' fill='%23151C2E'/><ellipse cx='90' cy='96' rx='70' ry='21' fill='none' stroke='%23FFC44D' stroke-width='10' transform='rotate(-16 90 96)'/><circle cx='90' cy='94' r='46' fill='%23FAF8FF'/><circle cx='75' cy='92' r='7' fill='%232C2748'/><circle cx='105' cy='92' r='7' fill='%232C2748'/><path d='M81 106 q9 9 18 0' stroke='%232C2748' stroke-width='5.5' fill='none' stroke-linecap='round'/><circle cx='146' cy='52' r='9' fill='%23FFC44D'/></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDECF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STEP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#181240;
  --ink2:#615C88;
  --ink3:#9A95B8;
  --base:#EDECF9;
  --surface:#FFFFFF;
  --line:#E4E2F3;
  --violet:#5B3DF5;
  --violet-soft:#EEEAFF;
  --mint:#17B98A;
  --mint-soft:#E1F8F0;
  --sky:#2E8FE0;
  --sky-soft:#E4F1FC;
  --amber:#F59E17;
  --amber-soft:#FDF0DA;
  --coral:#F2536A;
  --coral-soft:#FDE7EA;
  --radius:20px;
  --shadow:0 2px 3px rgba(24,18,64,.04), 0 12px 28px -12px rgba(24,18,64,.18);
  --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -8%, #DCD8FB 0%, transparent 60%),
    radial-gradient(700px 480px at 105% 4%, #D9F3EA 0%, transparent 58%),
    var(--base);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px)}
.disp{font-family:'Bricolage Grotesque','Noto Sans JP',sans-serif;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .mark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em}
.brand .sub{font-size:10.5px;color:var(--ink2);letter-spacing:.16em}
.saved{font-size:10.5px;color:var(--ink2);opacity:0;transition:opacity .3s;letter-spacing:.04em}
.saved.on{opacity:1}
main{padding:0 16px}

/* ---------- generic ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.sec-label{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:700;margin:22px 4px 10px}
.muted{color:var(--ink2)}
.tiny{font-size:11.5px;line-height:1.7}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}

/* ---------- capsule / hero ---------- */
.hero{position:relative;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:20px 20px 18px;margin-bottom:14px;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:28px;border:1px solid rgba(255,255,255,.7)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-grade{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:700}
.hero-title{font-size:26px;line-height:1.15;margin:2px 0 6px}
.hero-name{font-size:12.5px;color:var(--ink2)}
.capsule-wrap{display:flex;justify-content:center;margin:6px 0 2px}
.pct{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1}
.pct small{font-size:15px;margin-left:2px}
.bar{height:9px;border-radius:99px;background:#EDEBF8;overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.25,1)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:16px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800}
.stat span{font-size:10px;color:var(--ink2);letter-spacing:.06em}

/* ---------- next-up list ---------- */
.next-item{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.next-item:first-of-type{border-top:0}
.next-item .cat{font-size:10px;color:var(--ink2);letter-spacing:.04em;display:block;margin-bottom:2px}
.next-item .txt{font-size:13.5px;line-height:1.55}
.box{width:22px;height:22px;border-radius:8px;border:2px solid #D6D2ED;flex:0 0 auto;margin-top:1px;display:grid;place-items:center;transition:.18s;background:#fff}
.box svg{opacity:0;transform:scale(.5);transition:.18s}
.box.on{background:var(--violet);border-color:var(--violet)}
.box.on svg{opacity:1;transform:scale(1)}

/* ---------- grade list ---------- */
.glist{display:flex;flex-direction:column;gap:10px}
.gcard{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);width:100%;text-align:left;transition:transform .15s}
.gcard:active{transform:scale(.985)}
.gcard.done{background:linear-gradient(180deg,#fff,#F7FFFC)}
.gnum{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em}
.gtitle{font-size:14.5px;font-weight:700;line-height:1.35}
.gmeta{font-size:11px;color:var(--ink2);margin-top:2px}
.ring{position:relative;width:46px;height:46px;flex:0 0 auto}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-size:12px;font-weight:800}

/* ---------- detail ---------- */
.dhead{padding:6px 4px 14px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:700;padding:6px 0}
.dtitle{font-size:23px;margin:8px 0 4px}
.block{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 6px;margin-bottom:12px}
.block > h3{font-size:13px;margin:0 0 4px;line-height:1.45;display:flex;gap:8px;align-items:baseline}
.block .grp{font-size:11.5px;font-weight:700;color:var(--ink2);margin:14px 0 2px;letter-spacing:.04em}
.block.ai{background:linear-gradient(180deg,#FFFDF7,#FFF8EA);border:1px solid #F7E7C4}
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-of-type{border-top:0}
.item .txt{font-size:13.5px;line-height:1.6;flex:1}
.item.on .txt{color:var(--ink2);text-decoration:line-through;text-decoration-color:#CFCBE6}
.item.sub{padding-left:30px}
.item.lk{cursor:default}
.item.lk .txt{color:var(--ink3)}
.item.lk .box{border-color:#EAE7F5;background:#F6F5FB}
.box.lkbox{border-color:#EAE7F5;background:#F6F5FB}
.note.lockbox{background:#F1EFFA;color:var(--ink2)}
.gcard.lk .gtitle{color:var(--ink3)}
.item a{color:var(--violet);word-break:break-all}
.note{background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.7;margin-bottom:12px}
.vision{background:linear-gradient(135deg,#F4F1FF,#EAFBF4);border-radius:var(--radius);padding:16px 16px 6px;margin-bottom:12px}
.vision h3{font-size:12px;letter-spacing:.1em;margin:0 0 2px;color:var(--ink2)}

/* ---------- dex ---------- */
.dex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:var(--surface);border-radius:18px;padding:12px 10px 14px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.dcard .stage-no{position:absolute;top:8px;left:11px;font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:800;color:var(--ink3);opacity:.7}
.dcard .nm{font-weight:700;font-size:14px;margin-top:4px}
.dcard .dsc{font-size:10.5px;color:var(--ink2);line-height:1.55;margin-top:3px;min-height:32px}
.dcard.lock{background:#F6F5FC}
.dcard.lock .nm{color:var(--ink3)}
.dcard.now::after{content:'いま';position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;background:var(--violet);color:#fff;padding:2px 7px;border-radius:99px;letter-spacing:.06em}

/* ---------- sheet form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px;letter-spacing:.04em}
.field input[type=text],.field input[type=date],.field input[type=password],.field textarea,.field select{
  width:100%;border:1.5px solid var(--line);background:#FBFAFF;border-radius:12px;padding:11px 12px;font-size:14.5px;transition:.15s
}
.field textarea{min-height:78px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--violet);background:#fff;outline:none}
.creed{border-top:1px solid var(--line);padding:12px 0}
.creed:first-of-type{border-top:0}
.creed .row{display:flex;align-items:center;gap:9px}
.creed .no{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;color:var(--ink3);width:16px;flex:0 0 auto}
.creed input{flex:1;border:0;border-bottom:1.5px solid var(--line);background:none;padding:6px 2px;font-size:14px}
.creed input:focus{border-color:var(--violet);outline:none}
.scores{display:flex;gap:6px;margin:9px 0 0 25px}
.scores button{width:32px;height:32px;border-radius:10px;background:#F4F2FD;font-size:12.5px;font-weight:700;color:var(--ink2);font-family:'Bricolage Grotesque',sans-serif}
.scores button.on{background:var(--violet);color:#fff}
.atari{border-top:1px solid var(--line);padding:13px 0}
.atari:first-of-type{border-top:0}
.atari .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.atari .h b{font-size:13.5px}
.atari p{margin:5px 0 0;font-size:11.5px;color:var(--ink2);line-height:1.65}
.seg{display:flex;gap:5px;flex:0 0 auto}
.seg button{width:36px;height:29px;border-radius:9px;background:#F4F2FD;font-size:12px;font-weight:700;color:var(--ink2)}
.seg button.ok.on{background:var(--mint);color:#fff}
.seg button.ng.on{background:var(--coral);color:#fff}
.danger{width:100%;padding:13px;border-radius:14px;background:#fff;border:1.5px solid var(--coral);color:var(--coral);font-weight:700;font-size:13px;margin-top:6px}


/* ---------- step map ---------- */
.maprail{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.mapgrid{display:grid;grid-template-columns:104px repeat(10,168px);gap:6px;min-width:max-content}
.mh{background:var(--surface);border-radius:12px;padding:9px 8px;text-align:center;box-shadow:var(--shadow);position:relative}
.mh-cat{display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:.06em;position:sticky;left:0;z-index:3}
.mh-g{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px}
.mh-t{display:block;font-size:10px;color:var(--ink2);margin-top:1px}
.mh.now{outline:2px solid var(--violet)}
.mh-now{display:inline-block;margin-top:4px;font-size:9px;font-weight:700;color:#fff;background:var(--violet);border-radius:99px;padding:1px 7px}
.mc-cat{background:var(--surface);border-radius:12px;padding:12px 10px;font-size:11.5px;font-weight:700;line-height:1.4;display:flex;align-items:center;box-shadow:var(--shadow);position:sticky;left:0;z-index:2}
.mc{background:var(--surface);border-radius:12px;padding:10px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:78px;transition:transform .12s}
.mc:active{transform:scale(.98)}
.mc-txt{font-size:11.5px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc-num{font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.mc.part{background:linear-gradient(180deg,#fff,#F6F3FF)}
.mc.part .mc-num{color:var(--violet)}
.mc.full{background:linear-gradient(180deg,#F3FDF9,#E6F8F1)}
.mc.full .mc-num{color:var(--mint)}
.mc.lk{opacity:.55}
.mc.empty{background:#F4F3FB;box-shadow:none;color:#C9C5DE;align-items:center;justify-content:center;display:grid;min-height:78px}
.maplegend{display:flex;gap:14px;margin:10px 4px 0;flex-wrap:wrap}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:4px;background:#fff;border:1px solid var(--line);display:inline-block}
.lg.full{background:#DFF6EC;border-color:#BFEBDC}
.lg.part{background:#EDE7FF;border-color:#DCD3FF}
.lg.lk{background:#EFEDF7;border-color:#E2DFF0;opacity:.7}
.lbl-full{display:none}

/* ---------- sidebar buddy (desktop only) ---------- */
.side-buddy{display:none}




/* ---------- roadmap ---------- */
.roadcard{padding:18px 14px 14px}
.road-inner{position:relative;padding-top:46px}
.road-bar{position:absolute;left:5%;right:5%;top:calc(46px + 15px);height:6px;border-radius:99px;background:#EDEBF8;overflow:hidden}
.road-bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5B3DF5,#17B98A);transition:width .6s cubic-bezier(.2,.9,.25,1)}
.road-nodes{position:relative;display:flex}
.rn{flex:1;min-width:0;display:flex;justify-content:center;position:relative}
.rn-dot{width:min(30px,100%);aspect-ratio:1;height:auto;border-radius:50%;background:#fff;border:2px solid #E0DDF0;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px;color:var(--ink2);
  display:grid;place-items:center;position:relative;z-index:2;transition:.2s}
.rn-you{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;z-index:3}
.rn-you.edgeL{left:0;transform:none}
.rn-you.edgeR{left:auto;right:0;transform:none}
.rn-you b{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--violet);border-radius:99px;padding:2px 8px}
.rn-you.tag{bottom:40px}
.rn-pod{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,#36425F,#141A2B)}
.road-tiers{display:flex;margin-top:9px}
.road-tiers span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--ink3);letter-spacing:.02em;
  border-top:1px solid var(--line);padding-top:6px;margin:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc.now{outline:2px solid rgba(91,61,245,.35)}
.mc.empty.now{outline:2px solid rgba(91,61,245,.2)}
@media (min-width:900px){
  .roadcard{padding:22px 22px 16px}
  .rn-dot{width:min(36px,100%);font-size:13.5px}
  .road-bar{top:calc(46px + 18px)}
  .rn-you{bottom:44px}
  .rn-pod{width:44px;height:44px}
  .road-tiers span{font-size:11px}
}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:40}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.tabbar button.on{color:var(--violet)}
.tabbar svg{width:22px;height:22px}

/* ---------- toast / evolution ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 20px);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:99px;box-shadow:0 10px 24px -8px rgba(24,18,64,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.toast.xp{background:var(--violet)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
#evo{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:24px;overflow:hidden;background:rgba(19,14,52,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#evo.on{display:grid;animation:fade .28s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.evo-card{background:var(--surface);border-radius:28px;padding:22px 22px 24px;text-align:center;max-width:340px;width:100%;position:relative;overflow:hidden;z-index:2;animation:rise .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
.sfx-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:#F4F2FD;color:var(--ink2);display:grid;place-items:center;z-index:4}
.evo-stage{position:relative;display:grid;place-items:center;height:178px}
.evo-stage>*{grid-area:1/1}
.rays{width:320px;height:320px;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,rgba(255,196,77,.8) 0 5deg,rgba(255,196,77,0) 5deg 28deg);
  -webkit-mask-image:radial-gradient(circle,transparent 30%,#000 40%,#000 60%,transparent 72%);
  mask-image:radial-gradient(circle,transparent 30%,#000 40%,#000 60%,transparent 72%);
  animation:raysIn .6s .62s forwards,spin 14s linear infinite}
@keyframes raysIn{to{opacity:.9}}
.glow{width:230px;height:230px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,214,120,.95),rgba(255,214,120,0) 62%);
  animation:glowP 1.1s .5s ease-out}
@keyframes glowP{0%{opacity:0;transform:scale(.5)}22%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.shock{width:110px;height:110px;border-radius:50%;border:4px solid #FFC44D;opacity:0;animation:shockW .85s .62s ease-out}
.shock.s2{border-color:#FF9F45;animation-delay:.8s}
@keyframes shockW{0%{opacity:.95;transform:scale(.35)}100%{opacity:0;transform:scale(3)}}
.fig{display:grid;place-items:center;z-index:2}
.fig.old{animation:oldGo 1.05s forwards}
@keyframes oldGo{
  0%{opacity:1;transform:scale(1);filter:none}
  18%{filter:brightness(2.4) saturate(.2)}
  30%{filter:none}
  46%{filter:brightness(2.6) saturate(.2)}
  56%{filter:none;transform:scale(1.06)}
  62%{opacity:1;transform:scale(1.22);filter:brightness(3.4) saturate(0)}
  70%{opacity:0;transform:scale(1.42)}
  100%{opacity:0;transform:scale(1.42)}}
.fig.new{opacity:0;animation:newIn .8s .68s cubic-bezier(.16,1.5,.4,1) forwards}
.fig.new.solo{animation-delay:.3s}
@keyframes newIn{0%{opacity:0;transform:scale(.32) rotate(-14deg)}55%{opacity:1;transform:scale(1.14) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.evo-card .kick{font-size:11px;letter-spacing:.22em;color:var(--violet);font-weight:800;animation:upIn .5s .95s backwards}
.evo-card h2{font-size:27px;margin:6px 0 2px;animation:upIn .5s 1.06s backwards}

<body>
<div id="gate">
  <div class="gbox">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="disp" style="font-size:18px;letter-spacing:.06em">STEP</span>
      <span class="tiny muted" style="letter-spacing:.14em">CAREER LOG</span>
    </div>
    <h1 class="disp">はじめに</h1>
    <p class="tiny muted" style="margin:0 0 16px" id="gateLead">自分の名前を選んでください。</p>
    <div id="gateErr"></div>
    <div id="gateBody"></div>
  </div>
</div>
<div id="app">
  <div class="top">
    <div class="brand">
      <span class="mark">STEP</span>
      <span class="sub">CAREER LOG</span>
    </div>
    <span class="saved" id="saved">保存しました</span>
  </div>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none">
<div id="toasts"></div>
<div id="evo"></div>
<script src="shared/config.js"></script>
<script src="shared/steps.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/store.js"></script>
<script>
/* ============================================================
   STATE
   ------------------------------------------------------------
   D は画面が読み書きする手元の状態。中身の形はこれまでと同じ。
   保存先は shared/store.js が面倒を見る（Supabaseの1か所に集まる）。
   ============================================================ */
const DEFAULT={
  profile:{name:'',join:'',grade:'',unit:'',ul:'',mentor:''}, buddy:'', sound:true,
  goals:{basic:'',skill:''},
  creed:[{t:'',s:0},{t:'',s:0},{t:'',s:0},{t:'',s:0},{t:'',s:0}],
  atarimae:{}, checks:{}, custom:{}, log:[], seen:[]
};
let D=JSON.parse(JSON.stringify(DEFAULT));
let view='home', openG=null, ready=false, profileDirty=false;
/* 記録タブ */
let ROSTER=[];   /* 既存のUnit・UL・メンターを選択肢に出すために使う */
let LOG={ seg:'notes', rkind:'ywt', notes:[], scores:[], reviews:[], loaded:false,
          ywtPeriod:ywtPeriod(), monthPeriod:monthlyPeriod(), draft:{}, saving:false };

async function load(){
  const d=await Store.myData();
  D=JSON.parse(JSON.stringify(DEFAULT));
  D.profile={ name:d.member.name||'', join:d.member.join_date||'', grade:d.member.certified_grade||'',
              unit:d.member.unit||'', ul:d.member.ul||'', mentor:d.member.mentor||'' };
  Object.keys(d.checks).forEach(k=>{ if(d.checks[k]) D.checks[k]=true; });
  const s=d.state||{};
  D.buddy=s.buddy||'';
  D.goals=Object.assign({basic:'',skill:''},s.goals||{});
  if(Array.isArray(s.creed)&&s.creed.length) D.creed=s.creed.concat(DEFAULT.creed.slice(s.creed.length)).slice(0,5);
  D.atarimae=s.atarimae||{}; D.custom=s.custom||{}; D.seen=s.seen||[];
  D.sound=s.sound!==false; D.log=s.log||[];
  ready=true;
}

let saveT=null;
/* 入力は少し待ってからまとめて保存する（打っている途中で毎回通信しない） */
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      await Store.saveState({ buddy:D.buddy, goals:D.goals, creed:D.creed,
        atarimae:D.atarimae, custom:D.custom, seen:D.seen, sound:D.sound });
      if(profileDirty){
        await Store.saveProfile({ name:D.profile.name, join_date:D.profile.join||null,
          certified_grade:D.profile.grade?+D.profile.grade:null,
          unit:D.profile.unit||null, ul:D.profile.ul||null, mentor:D.profile.mentor||null });
        profileDirty=false;
      }
      flash('ok');
    }catch(e){ flash('err',e.message); }
  },450);
}
function flash(kind,msg){
  const el=document.getElementById('saved');
  if(kind==='err'){ el.textContent=msg||'保存できませんでした'; el.style.color='var(--coral)'; el.classList.add('on');
    setTimeout(()=>el.classList.remove('on'),3000); return; }
  el.style.color='';
  el.textContent = '保存しました';
  el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1200);
}

/* ============================================================
   MODEL HELPERS
   計算式は shared/steps.js にひとつだけ置いて、管理者画面と共通にしている。
   ============================================================ */
function done(g){return gDone(D.checks,g);}
function total(g){return gTotal(g);}
function isDone(g){return gIsDone(D.checks,g);}
function isLocked(n){return gIsLocked(D.checks,n);}
function currentGrade(){return gCurrentGrade(D.checks);}
function stage(){return gStage(D.checks);}
function totalChecked(){return gTotalChecked(D.checks);}
function totalItems(){return TOTAL_ITEMS;}
function weekCount(){const wk=Date.now()-6048e5;return D.log.filter(t=>t>wk).length;}

/* ============================================================
   SOUND
   ============================================================ */
function actx(){
  try{
    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(f,at,dur,type,vol,f2){
  const a=actx(); if(!a) return;
  const t0=a.currentTime+at, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||.15,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.06);
}
function whoosh(at,dur,vol){
  const a=actx(); if(!a) return;
  const t0=a.currentTime+at, n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(i/n,1.6);
  const src=a.createBufferSource(); src.buffer=buf;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(300,t0); bp.frequency.exponentialRampToValueAtTime(5200,t0+dur);
  const g=a.createGain(); g.gain.value=vol||.16;
  src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t0);
}
function blip(prog){
  if(!D.sound) return;
  const f=392*Math.pow(2,Math.min(1,prog||0));
  tone(f,0,.11,'triangle',.075); tone(f*2,0.01,.07,'sine',.02);
}
function fanfare(big){
  if(!D.sound) return;
  whoosh(0.05,.62,.13);
  tone(70,.62,.55,'sine',.22,42);
  const ch=big?[523.25,659.25,783.99,1046.5,1318.5]:[523.25,659.25,783.99,1046.5];
  ch.forEach((f,i)=>{ tone(f,.62+i*0.085,.5,'triangle',.16); tone(f*2,.62+i*0.085,.32,'sine',.04); });
  for(let i=0;i<8;i++) tone(1400+Math.random()*1500,.95+i*0.06,.22,'sine',.045);
  if(big){ tone(1046.5,1.5,1.1,'triangle',.1); tone(1567.98,1.52,1.1,'sine',.05); }
}

/* ============================================================
   VIEWS
   ============================================================ */
function cutTxt(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }
/* すでに登録されている表記を選択肢にする。表記ゆれを増やさないため */
function uniqSorted(list){ return Array.from(new Set(list.filter(x=>x&&String(x).trim()))).sort((a,b)=>String(a).localeCompare(String(b),'ja')); }
function rosterUnits(){ return uniqSorted(ROSTER.map(m=>m.unit)); }
function rosterUls(){   return uniqSorted(ROSTER.map(m=>m.ul)); }
function rosterNames(){ return uniqSorted(ROSTER.map(m=>m.name)); }
function dl(id,items){ return '<datalist id="'+id+'">'+items.map(v=>'<option value="'+esc(v)+'">').join('')+'</datalist>'; }
function vHome(){
  const cg=currentGrade(), g=GRADES[cg-1], t=tierOf(cg);
  const dn=done(cg), tt=total(cg), pct=Math.round(dn/tt*100);
  const st=stage(), sg=STAGES[st-1];
  const rest=tt-dn;
  const nm=D.profile.name?esc(D.profile.name)+' さん':'名前を登録しよう';
  const nexts=ITEMS[cg].filter(i=>!D.checks[i.id]).slice(0,3);

  let h='<div class="home-grid"><div class="hg-l"><section class="hero">'+
   '<div class="hero-top"><div>'+
     '<div class="hero-grade">GRADE '+cg+' ／ '+t.name+'（'+g.period+'）</div>'+
     '<div class="hero-title disp">'+(D.buddy?esc(D.buddy):'なまえ未設定')+'</div>'+
     '<div class="hero-name">'+nm+(D.buddy?'':' ・ <button data-act="tab" data-tab="sheet" style="color:var(--violet);font-weight:700;font-size:12px">名前をつける</button>')+'</div>'+
   '</div><div style="text-align:right"><div class="pct" style="color:'+t.hex+'">'+pct+'<small>%</small></div></div></div>'+
   '<div class="capsule-wrap">'+porthole(st,pct,t.hex)+'</div>'+
   '<div class="bar"><i style="width:'+pct+'%;background:linear-gradient(90deg,#C9202B,'+t.hex+')"></i></div>'+
   '<div class="hero-foot"><span class="muted">'+dn+' / '+tt+' 項目 ・ 第'+st+'形態「'+sg.t+'」</span>'+
     '<b style="color:'+t.hex+'">'+(rest===0?'昇格条件クリア！':'あと '+rest+' 項目で進化')+'</b></div>'+
   '</section>';

  h+='<div class="stats">'+
    '<div class="stat"><b style="color:var(--violet)">Lv.'+(Math.floor(totalChecked()/5)+1)+'</b><span>レベル</span></div>'+
    '<div class="stat"><b>'+totalChecked()+'</b><span>達成した項目</span></div>'+
    '<div class="stat"><b style="color:var(--mint)">+'+weekCount()+'</b><span>今週の達成</span></div>'+
  '</div>';

  h+='</div><div class="hg-r">';
  h+='<div class="sec-label">つぎの一歩</div><div class="card">';
  if(nexts.length===0){
    h+='<div style="text-align:center;padding:10px 0"><b style="font-size:15px">Grade '+cg+' はコンプリート！</b>'+
       '<p class="tiny muted" style="margin:6px 0 0">メンターとの定例で昇格を相談しよう。</p></div>';
  }else{
    nexts.forEach(i=>{
      h+='<button class="next-item" data-act="toggle" data-id="'+i.id+'"><span class="box">'+CHECK+'</span>'+
         '<span class="txt"><span class="cat">'+esc(i.cat)+'</span>'+esc(i.t)+'</span></button>';
    });
    h+='<button class="next-item" data-act="openGrade" data-g="'+cg+'" style="border-top:1px solid var(--line);color:var(--violet);font-weight:700;font-size:13px;justify-content:center;padding-top:14px">Grade '+cg+' の項目をすべて見る →</button>';
  }
  h+='</div>';

  /* ULやメンターからの共有事項。あれば新しいものを2件だけ出す */
  const sn=(LOG.notes||[]).slice(0,2);
  if(sn.length){
    h+='<div class="sec-label">ULからの共有</div><div class="card">';
    sn.forEach(n=>{
      const k=NOTE_KIND[n.kind]||NOTE_KIND.memo;
      h+='<div class="nt"><div class="top"><b style="font-size:12.5px">'+fmtDateFull(n.occurred_on)+'</b>'+
        '<span class="pill '+k.c+'">'+k.n+'</span>'+
        (n.author_name?'<span class="tiny muted" style="margin-left:auto">'+esc(n.author_name)+'</span>':'')+
        '</div><div class="bd">'+esc(cutTxt(n.body,110))+'</div></div>';
    });
    h+='<button class="next-item" data-act="tab" data-tab="log" style="border-top:1px solid var(--line);color:var(--violet);font-weight:700;font-size:13px;justify-content:center;padding-top:14px">共有事項をすべて見る →</button></div>';
  }

  const cleared=GRADES.filter(x=>isDone(x.n)).length;
  h+='<div class="sec-label">全体の歩み</div><div class="card roadcard">'+roadmap(false)+
   '<div style="height:12px"></div>'+
   '<div class="tiny muted">10グレード中 <b style="color:var(--ink)">'+cleared+'</b> グレード達成／全'+totalItems()+'項目のうち '+totalChecked()+' 項目クリア</div>'+
   '</div></div></div>';
  return h;
}

function vGrades(){
  let h='<div class="sec-label">キャリアステップ</div>'+
   '<div class="note" style="background:var(--violet-soft)">メンターとの隔週定例、ULとの月次定例で随時チェックボックスを確認。チェックボックスがすべて埋まったら昇格を検討します。</div>'+
   '<div class="glist">';
  const cg=currentGrade();
  GRADES.forEach(g=>{
    const t=tierOf(g.n), dn=done(g.n), tt=total(g.n), pct=Math.round(dn/tt*100);
    const dd=dn===tt, lk=isLocked(g.n);
    h+='<button class="gcard'+(dd?' done':'')+(lk?' lk':'')+'" data-act="openGrade" data-g="'+g.n+'">'+
      ring(pct,dd?'#17B98A':(lk?'#C9C5DE':t.hex),dd?'✓':pct)+
      '<span style="flex:1">'+
        '<span class="gnum" style="color:'+(lk?'#A5A0C0':t.hex)+'">GRADE '+g.n+(lk?' 🔒':'')+'</span>'+
        '<div class="gtitle">'+t.name+'<span class="muted" style="font-weight:400;font-size:12px">（'+g.period+'）</span></div>'+
        '<div class="gmeta">'+(lk?'Grade '+(g.n-1)+' を埋めると開く':dn+' / '+tt+' 項目'+(g.n===cg?' ・ 挑戦中':''))+'</div>'+
      '</span>'+
      '<span style="color:var(--ink3);font-size:18px">›</span></button>';
  });
  return h+'</div>';
}

function vDetail(n){
  const g=GRADES[n-1], t=tierOf(n), dn=done(n), tt=total(n), pct=Math.round(dn/tt*100), lk=isLocked(n);
  let h='<div class="dhead"><button class="back" data-act="back">‹ グレード一覧</button>'+
    '<div class="gnum" style="color:'+t.hex+'">GRADE '+n+' ／ '+g.period+'</div>'+
    '<div class="dtitle disp">'+t.name+'</div>'+
    '<div class="bar"><i style="width:'+pct+'%;background:'+t.hex+'"></i></div>'+
    '<div class="hero-foot"><span class="tiny muted">'+dn+' / '+tt+' 項目</span><b class="tiny" style="color:'+t.hex+'">'+pct+'%</b></div></div>';

  if(lk) h+='<div class="note lockbox">Grade '+(n-1)+' がすべて埋まると、ここにチェックを入れられます。内容の確認は先にできます。</div>';
  if(g.note) h+='<div class="note">'+esc(g.note)+'</div>';

  h+='<div class="vision"><h3>なりたい姿</h3>';
  g.vision.forEach((v,i)=>{h+=itemHTML('g'+n+'.v.'+i,v,null,false,lk);});
  h+='</div>';

  h+='<div class="blocks">';
  g.sections.forEach((s,si)=>{
    h+='<div class="block'+(s.ai?' ai':'')+'"><h3>'+(s.ai?'<span>🤖</span>':'')+'<span>'+esc(s.title)+'</span></h3>';
    if(s.note) h+='<p class="tiny muted" style="margin:2px 0 6px">'+esc(s.note)+'</p>';
    const render=(list,gl)=>list.forEach((it,ii)=>{
      const base='g'+n+'.'+si+'.'+(gl!=null?gl+'-':'')+ii;
      if(s.custom){ h+=customHTML(base,it,lk); return; }
      if(typeof it==='string'){ h+=itemHTML(base,it,null,false,lk); }
      else{
        h+=itemHTML(base,it.t,it.link,false,lk);
        (it.sub||[]).forEach((st,k)=>{h+=itemHTML(base+'.'+k,st,null,true,lk);});
      }
    });
    if(s.groups) s.groups.forEach((gr,gl)=>{h+='<div class="grp">'+esc(gr.label)+'</div>';render(gr.items,gl);});
    else render(s.items,null);
    h+='</div>';
  });
  h+='</div>';
  return h;
}
function itemHTML(id,txt,link,sub,lk){
  const on=!!D.checks[id];
  return '<button class="item'+(on?' on':'')+(sub?' sub':'')+(lk&&!on?' lk':'')+'" data-act="toggle" data-id="'+id+'">'+
    '<span class="box'+(on?' on':'')+'">'+(lk&&!on?LOCK:CHECK)+'</span>'+
    '<span class="txt">'+esc(txt)+(link?'<br><a href="'+link+'" target="_blank" rel="noopener" class="tiny">クイズを開く →</a>':'')+'</span></button>';
}
function customHTML(id,label,lk){
  const on=!!D.checks[id];
  return '<div style="padding:11px 0;border-top:1px solid var(--line)">'+
   '<div style="font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:6px">'+esc(label)+'</div>'+
   '<div style="display:flex;gap:10px;align-items:center">'+
   '<button class="box'+(on?' on':'')+(lk&&!on?' lkbox':'')+'" data-act="toggle" data-id="'+id+'" aria-label="達成">'+(lk&&!on?LOCK:CHECK)+'</button>'+
   '<input type="text" data-custom="'+id+'" value="'+esc(D.custom[id]||'')+'" placeholder="面談ですり合わせた内容を入力" style="flex:1;border:1.5px solid var(--line);background:#FBFAFF;border-radius:10px;padding:9px 11px;font-size:13.5px">'+
   '</div></div>';
}

function roadmap(showBuddy){
  const cg=currentGrade(), st=stage(), dn=done(cg), tt=total(cg);
  const pos=Math.max(0,Math.min(100,((cg-1)+dn/tt)/9*100));
  let nodes='';
  GRADES.forEach(g=>{
    const t=tierOf(g.n), dd=isDone(g.n), cur=g.n===cg, lk=isLocked(g.n);
    const edge = g.n<=2?' edgeL':(g.n>=9?' edgeR':'');
    nodes+='<div class="rn'+(dd?' done':'')+(cur?' cur':'')+'">'+
      (cur&&showBuddy?'<div class="rn-you'+edge+'"><div class="rn-pod">'+creature(st,34,'')+'</div><b>いまここ</b></div>':
       (cur?'<div class="rn-you tag'+edge+'"><b>いまここ</b></div>':''))+
      '<button class="rn-dot" data-act="openGrade" data-g="'+g.n+'" title="Grade '+g.n+' '+t.name+'" '+
        'style="'+(dd?'background:'+t.hex+';border-color:'+t.hex+';color:#fff':(cur?'border-color:'+t.hex+';color:'+t.hex+';box-shadow:0 0 0 4px '+t.hex+'22':(lk?'color:#B7B2CE':'color:'+t.hex)))+'">'+
        (dd?'✓':g.n)+'</button>'+
    '</div>';
  });
  const tiers=[['スターター',2],['プレイヤー',2],['プロフェッショナル',2],['リーダー',2],['エグゼクティブ',2]]
    .map(x=>'<span style="flex:'+x[1]+'">'+x[0]+'</span>').join('');
  return '<div class="road">'+
    '<div class="road-inner"><div class="road-bar"><i style="width:'+pos.toFixed(1)+'%"></i></div>'+
    '<div class="road-nodes">'+nodes+'</div></div>'+
    '<div class="road-tiers">'+tiers+'</div></div>';
}

function vMap(){
  const cg=currentGrade();
  let h='<div class="sec-label">現在地</div><div class="card roadcard">'+roadmap(true)+'</div>'+
   '<div class="sec-label">ステップ一覧</div>'+
   '<div class="note" style="background:var(--violet-soft)">いま埋めている項目が、次のグレードでどう発展するかを横に並べています。セルを押すとそのグレードの詳細に飛べます。</div>'+
   '<div class="maprail"><div class="mapgrid">';
  h+='<div class="mh mh-cat">カテゴリ</div>';
  GRADES.forEach(g=>{
    const t=tierOf(g.n), dd=isDone(g.n), lk=isLocked(g.n);
    h+='<div class="mh'+(g.n===cg?' now':'')+'">'+
      '<span class="mh-g" style="color:'+(lk?'#A5A0C0':t.hex)+'">G'+g.n+(dd?' ✓':'')+'</span>'+
      '<span class="mh-t">'+t.name+'</span>'+
      (g.n===cg?'<span class="mh-now">挑戦中</span>':'')+
    '</div>';
  });
  CATS.forEach(c=>{
    h+='<div class="mc-cat">'+c.n+'</div>';
    GRADES.forEach(g=>{
      const lk=isLocked(g.n);
      let cells=[], dn=0, tt=0;
      if(c.k==='vision'){
        const st=visStats(D.checks,g.n); dn=st.d; tt=st.t;
        if(tt) cells.push(g.vision.join(' / '));
      }else{
        g.sections.forEach((sec,si)=>{
          if(sec.title.indexOf(c.k)!==0) return;
          const st=secStats(D.checks,g.n,si); dn+=st.d; tt+=st.t;
          cells.push(subLabel(sec.title,c.k));
        });
      }
      if(!tt){ h+='<div class="mc empty'+(g.n===cg?' now':'')+'">–</div>'; return; }
      const full=dn===tt, cls=(full?' full':(dn>0?' part':''))+(lk?' lk':'')+(g.n===cg?' now':'');
      h+='<button class="mc'+cls+'" data-act="openGrade" data-g="'+g.n+'" title="'+esc(cells.join(' / '))+'">'+
        '<span class="mc-txt">'+esc(cells.join('｜'))+'</span>'+
        '<span class="mc-num">'+(full?'✓ ':'')+dn+'/'+tt+'</span>'+
      '</button>';
    });
  });
  h+='</div></div>';
  h+='<div class="maplegend tiny muted"><span><i class="lg full"></i>達成</span><span><i class="lg part"></i>進行中</span><span><i class="lg"></i>未着手</span><span><i class="lg lk"></i>ロック中</span></div>';
  return h;
}

/* ============================================================
   記録タブ — ULからの共有事項・テスト点数・振り返り
   ============================================================ */
const NOTE_KIND={
  memo:{n:'メモ',c:'g'}, handover:{n:'申し送り',c:'s'}, interview:{n:'面談',c:'v'},
  promotion:{n:'昇格面談',c:'a'}, escalation:{n:'エスカレ',c:'c'}, praise:{n:'称賛',c:'m'}
};
async function loadLog(){
  if(LOG.loaded) return;
  const [n,s,r]=await Promise.all([Store.myNotes(),Store.myScores(),Store.myReviews()]);
  LOG.notes=n||[]; LOG.scores=s||[]; LOG.reviews=r||[]; LOG.loaded=true;
}
function reviewOf(kind,period){ return LOG.reviews.find(r=>r.kind===kind&&r.period===period)||null; }

function vLog(){
  let h='<div class="logwrap"><div class="segs">'+
    [['notes','共有事項'],['scores','テスト'],['reviews','振り返り']].map(x=>
      '<button data-act="seg" data-s="'+x[0]+'" class="'+(LOG.seg===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+
    '</div>';
  if(!LOG.loaded) return h+'<div class="card"><div style="text-align:center;padding:24px 0" class="tiny muted">読み込んでいます…</div></div></div>';
  if(LOG.seg==='notes')   h+=logNotes();
  else if(LOG.seg==='scores') h+=logScores();
  else h+=logReviews();
  return h+'</div>';
}

/* ---------- 共有事項 ---------- */
function logNotes(){
  let h='<div class="note" style="background:var(--sky-soft)">ULやメンターが、あなたとのやりとりを残した記録です。'+
    '面談で決めたことや申し送りをあとから見返せます。</div>';
  if(!LOG.notes.length) return h+'<div class="card"><div style="text-align:center;padding:26px 0" class="tiny muted">'+
    'まだ共有事項はありません。<br>面談や定例のあとにここへ追加されます。'+
    '</div></div>';
  h+='<div class="card">';
  LOG.notes.forEach(n=>{
    const k=NOTE_KIND[n.kind]||NOTE_KIND.memo;
    h+='<div class="nt"><div class="top">'+
      '<b style="font-size:13px">'+fmtDateFull(n.occurred_on)+'</b>'+
      '<span class="pill '+k.c+'">'+k.n+'</span>'+
      (n.grade?'<span class="pill g">Grade '+n.grade+'</span>':'')+
      (n.author_name?'<span class="tiny muted" style="margin-left:auto">'+esc(n.author_name)+'</span>':'')+
    '</div><div class="bd">'+esc(n.body)+'</div>'+
    (n.next_action?'<div class="na">→ 次にやること：'+esc(n.next_action)+'</div>':'')+
    '</div>';
  });
  return h+'</div>';
}

/* ---------- テスト点数 ---------- */
function logScores(){
  let h='<div class="note" style="background:var(--mint-soft)">ラーニングボックスなどのテスト結果です。'+
    '<a href="https://orient-quiz.vercel.app/" target="_blank" rel="noopener">クイズを開く →</a></div>';
  if(!LOG.scores.length) return h+'<div class="card"><div style="text-align:center;padding:26px 0" class="tiny muted">'+
    'まだ結果が登録されていません。<br>受験するとここに点数がたまっていきます。'+
    '</div></div>';

  /* テストごとに最新の結果でまとめる */
  const byQuiz={};
  LOG.scores.forEach(s=>{ (byQuiz[s.quiz_name]=byQuiz[s.quiz_name]||[]).push(s); });
  const names=Object.keys(byQuiz);
  const rates=[];
  names.forEach(q=>{ byQuiz[q].sort((a,b)=>String(b.taken_on).localeCompare(String(a.taken_on)));
    const s=byQuiz[q][0]; if(s.max_score) rates.push(Math.round(+s.score/+s.max_score*100)); });
  const avg=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):null;

  h+='<div class="stats">'+
    '<div class="stat"><b>'+names.length+'</b><span>受けたテスト</span></div>'+
    '<div class="stat"><b style="color:var(--mint)">'+(avg==null?'—':avg+'%')+'</b><span>平均正答率</span></div>'+
    '<div class="stat"><b style="color:var(--violet)">'+rates.filter(x=>x>=90).length+'</b><span>9割以上</span></div>'+
  '</div>';

  h+='<div class="sec-label">テストごとの最新の結果</div><div class="card">';
  names.forEach(q=>{
    const list=byQuiz[q], s=list[0];
    const rate=s.max_score?Math.round(+s.score/+s.max_score*100):null;
    const cls=(s.passed===true||(rate!=null&&rate>=90))?'m':(rate!=null&&rate>=70?'a':'c');
    h+='<div class="sc"><div class="nm">'+esc(q)+
      '<small>'+fmtDateFull(s.taken_on)+(list.length>1?'　'+list.length+'回受験':'')+'</small></div>'+
      (rate!=null?'<span class="pill '+cls+'">'+rate+'%</span>':'')+

function pastReviews(kind,skip){
  const list=LOG.reviews.filter(r=>r.kind===kind&&r.period!==skip&&r.submitted_at)
    .sort((a,b)=>String(b.period).localeCompare(String(a.period)));
  if(!list.length) return '';
  let h='<div class="sec-label">これまでの振り返り</div><div class="card">';
  list.forEach(rv=>{
    const rows = kind==='ywt'
      ? [['Y',rv.y],['W',rv.w],['T',rv.t]]
      : [['振り返り',rv.looking_back],['次月目標',rv.next_goal]];
    h+='<div class="nt"><div class="top"><b style="font-size:13px">'+periodLabel(kind,rv.period)+'</b>'+
      (rv.ul_comment?'<span class="pill v">ULコメントあり</span>':'')+
      '<span class="tiny muted" style="margin-left:auto">'+relDays(rv.submitted_at)+'</span></div>'+
      rows.filter(x=>x[1]).map(x=>'<div style="margin-bottom:5px"><span class="tiny" style="font-weight:700;color:var(--ink2)">'+x[0]+'</span>'+
        '<div class="bd">'+esc(x[1])+'</div></div>').join('')+
      (rv.ul_comment?'<div class="ul">UL：'+esc(rv.ul_comment)+'</div>':'')+
    '</div>';
  });
  return h+'</div>';
}
async function saveReview(kind,period){
  const g=f=>{ const el=document.querySelector('[data-draft="'+kind+':'+period+':'+f+'"]'); return el?el.value:''; };
  const payload = kind==='ywt'
    ? {kind:'ywt', period:period, y:g('y'), w:g('w'), t:g('t')}
    : {kind:'monthly', period:period, looking_back:g('looking_back'), next_goal:g('next_goal')};
  const filled=Object.keys(payload).filter(k=>k!=='kind'&&k!=='period').some(k=>String(payload[k]||'').trim());
  if(!filled){ toast('内容を入力してください'); return; }
  LOG.saving=true; render(true);
  try{
    await Store.submitReview(payload);
    LOG.loaded=false; LOG.draft={};
    await loadLog();
    toast('提出しました','xp');
  }catch(e){ toast(e.message||'保存に失敗しました'); }
  LOG.saving=false; render(true);
}

  if(a==='tab'){

  }
  else if(a==='openGrade'){ openG=+el.dataset.g; view='grades'; render(); }
  else if(a==='back'){ openG=null; render(); }
  else if(a==='toggle'){ toggle(el.dataset.id); }
  else if(a==='creed'){ const i=+el.dataset.i,v=+el.dataset.v; D.creed[i].s=(D.creed[i].s===v?0:v); save(); render(true); }
  else if(a==='atari'){ const k=el.dataset.k,v=el.dataset.v; D.atarimae[k]=(D.atarimae[k]===v?null:v); save(); render(true); }
  else if(a==='sfx'){
    D.sound=!D.sound; save();
    if(el.dataset.icon){ el.innerHTML=D.sound?SPK_ON:SPK_OFF; if(D.sound) blip(.7); }
    else { if(D.sound) blip(.7); render(true); }
  }
  else if(a==='seg'){ LOG.seg=el.dataset.s; render(); }
  else if(a==='rkind'){ LOG.rkind=el.dataset.k; render(); }
  else if(a==='pick'){
    if(el.dataset.kind==='ywt') LOG.ywtPeriod=el.dataset.p; else LOG.monthPeriod=el.dataset.p;
    render(true);
  }
  else if(a==='saveReview'){ await saveReview(el.dataset.kind,el.dataset.p); }
  else if(a==='export'){ exportData(); }
  else if(a==='import'){ document.getElementById('importFile').click(); }
  else if(a==='logout'){
    if(!confirm('ログアウトします。よろしいですか？')) return;
    await Store.signOut(); location.reload();
  }
  else if(a==='claimManager'){
    const el2=document.getElementById('adminKey');

    if(confirm('チェック・入力内容をすべて消去します。よろしいですか？')){
      const ids=Object.keys(D.checks);
      for(const id of ids) await Store.setCheck(id,false);

async function toggle(id){
  const gn=gradeOf(id);
  if(!D.checks[id] && isLocked(gn)){
    toast('Grade '+(gn-1)+' を埋めると開きます');
    return;
  }
  const before=GRADES.filter(g=>isDone(g.n)).map(g=>g.n), st0=stage();
  const now=!D.checks[id];
  if(now){ D.checks[id]=true; D.log.push(Date.now()); if(D.log.length>400) D.log=D.log.slice(-400); }
  else delete D.checks[id];
  const after=GRADES.filter(g=>isDone(g.n)).map(g=>g.n);
  const newly=after.filter(n=>!before.includes(n)&&!D.seen.includes(n));
  render(true);
  if(newly.length){ newly.forEach(n=>D.seen.push(n)); save(); evolve(Math.max.apply(null,newly),st0,stage()); }
  else if(now){ blip(done(gn)/total(gn)); toast('+10 XP','xp'); }
  try{ await Store.setCheck(id,now); flash('ok'); }
  catch(e){
    /* 保存できなかったら画面も元に戻す（ズレたまま進まないように） */
    if(now) delete D.checks[id]; else D.checks[id]=true;
    render(true); flash('err',e.message);
  }
}

async function importData(file){
  try{
    const txt=await file.text();

    if(!confirm('いまの入力内容をこのファイルの内容で置きかえます。よろしいですか？')) return;

    profileDirty=true;
    for(const id of Object.keys(D.checks)) if(D.checks[id]) await Store.setCheck(id,true);

  }catch(e){ toast('読み込めませんでした'); }

        '<input type="text" id="rName" value="'+esc(GATE.reg.name)+'" placeholder="山田 太郎"></div>'+
      '<div class="field"><label>所属Unit</label>'+
        '<input type="text" id="rUnit" list="rdUnit" value="'+esc(GATE.reg.unit)+'" placeholder="例：Unit A">'+
        dl('rdUnit',gUnits())+
        '<p class="tiny muted" style="margin:4px 0 0">'+(gUnits().length?'入力欄を押すと、登録済みのUnitから選べます。':'最初の人なので、そのまま入力してください。')+'</p></div>'+
      '<div class="field"><label>UL（ユニットリーダー）</label>'+
        '<input type="text" id="rUl" list="rdUl" value="'+esc(GATE.reg.ul)+'" placeholder="ULの名前">'+dl('rdUl',gUls())+'</div>'+
      '<div class="field"><label>メンター</label>'+
        '<input type="text" id="rMentor" list="rdName" value="'+esc(GATE.reg.mentor)+'" placeholder="メンターの名前">'+dl('rdName',gNames())+'</div>'+
      '<div class="field"><label>入社日<span class="muted" style="font-weight:400">（昇格予定の計算に使います）</span></label>'+
        '<input type="date" id="rJoin" value="'+esc(GATE.reg.join)+'"></div>'+
      '<div class="field"><label>いま認定されているGrade</label>'+
        '<select id="rGrade"><option value="">まだ決まっていない／わからない</option>'+
        GRADES.map(g=>'<option value="'+g.n+'"'+(String(GATE.reg.grade)===String(g.n)?' selected':'')+'>Grade '+g.n+'｜'+tierOf(g.n).name+'</option>').join('')+
        '</select></div>'+
      '<div class="field"><label>部署共通のパスコード<span style="color:var(--coral)"> ※必須</span></label>'+
        '<input type="password" id="rCode" autocomplete="off" placeholder="ULから共有されたパスコード">'+
        '<p class="tiny muted" style="margin:4px 0 0">全員で同じものを使います。登録のときだけ必要です。</p></div>'+
      '<div class="field"><label>自分のパスワード<span style="color:var(--coral)"> ※必須</span></label>'+
        '<input type="password" id="rPw" autocomplete="new-password" placeholder="自分で決めてください">'+PW_HINT+'</div>'+
      '<div class="field"><label>パスワード（確認）</label>'+
        '<input type="password" id="rPw2" autocomplete="new-password" placeholder="もう一度入力"></div>'+
      '<button class="gbtn" data-act="register">登録してはじめる</button>'+
      '<button class="gbtn alt" data-act="toPick">登録した人はこちら</button>'+
      '<p class="tiny muted" style="margin:12px 0 0">氏名やUnitは、あとから「マイシート」で直せます。</p>';
    const n=document.getElementById('rName');
    n.oninput=e=>{ GATE.reg.name=e.target.value; };
    ['Unit','Ul','Mentor','Join','Grade'].forEach(k=>{
      const el=document.getElementById('r'+k);
      el.oninput=el.onchange=ev=>{ GATE.reg[k.toLowerCase()]=ev.target.value; };
    });
    document.getElementById('rPw2').onkeydown=ev=>{ if(ev.key==='Enter') doRegister(); };
    return;
  }

  if(GATE.mode==='pick'){
    lead.textContent='自分の名前を選んでください。';
    const q=GATE.q.trim();
    const list=GATE.roster.filter(m=>!q||String(m.name).indexOf(q)>=0||String(m.unit||'').indexOf(q)>=0);
    let h='';
    if(GATE.roster.length){
      h+='<input class="who" id="gq" placeholder="名前で絞り込む" value="'+esc(GATE.q)+'">';
      h+='<div class="glist">';
      if(!list.length) h+='<div style="padding:22px 12px;text-align:center" class="tiny muted">見つかりませんでした。</div>';
      let lastUnit='__';
      list.forEach(m=>{
        const u=m.unit||'（Unit未設定）';
        if(u!==lastUnit){ lastUnit=u; h+='<div class="gunit">'+esc(u)+'</div>'; }
        h+='<button class="gitem" data-act="pick" data-id="'+m.id+'"><b>'+esc(m.name)+'</b>'+
           '<span>'+(m.linked?'選ぶ ›':'パスワード設定 ›')+'</span></button>';
      });
      h+='</div>';
    }else{
      h+='<div class="note" style="background:var(--violet-soft);margin-bottom:12px">'+
         'まだ誰も登録していません。あなたが最初の登録者です。</div>';
    }
    h+='<button class="gbtn'+(GATE.roster.length?' alt':'')+'" data-act="toReg">'+
       (GATE.roster.length?'はじめて使う（新規登録）':'はじめる（新規登録）')+'</button>';
    body.innerHTML=h;
    const gq=document.getElementById('gq');
    if(gq) gq.oninput=e=>{ GATE.q=e.target.value; const p=e.target.selectionStart; showGate();
      const n=document.getElementById('gq'); n.focus(); try{ n.setSelectionRange(p,p); }catch(x){} };
    return;
  }

  const who='<div class="card" style="margin-bottom:12px;padding:13px 15px">'+
      '<div class="tiny muted">選んだ名前</div><b style="font-size:16px">'+esc(GATE.picked.name)+'</b>'+
      (GATE.picked.unit?'<span class="tiny muted"> ・ '+esc(GATE.picked.unit)+'</span>':'')+'</div>';

  /* まだパスワードが決まっていない人（登録直後・ULがリセットした直後） */
  if(GATE.mode==='setpw'){
    lead.textContent='パスワードを設定してください。';
    body.innerHTML=who+
      '<div class="note" style="background:var(--violet-soft);margin-bottom:12px">'+
        'この名前にはまだパスワードがありません。ここで決めたパスワードで、次回からログインします。'+
        'これまでの記録はそのまま残ります。</div>'+
      '<div class="field"><label>部署共通のパスコード</label>'+
        '<input type="password" id="sCode" autocomplete="off" placeholder="ULから共有されたパスコード"></div>'+
      '<div class="field"><label>新しいパスワード</label>'+
        '<input type="password" id="sPw" autocomplete="new-password" placeholder="自分で決めてください">'+PW_HINT+'</div>'+
      '<div class="field"><label>パスワード（確認）</label>'+
        '<input type="password" id="sPw2" autocomplete="new-password" placeholder="もう一度入力"></div>'+
      '<button class="gbtn" data-act="setpw">設定してはじめる</button>'+
      '<button class="gbtn alt" data-act="toPick">名前を選びなおす</button>';
    const f=document.getElementById('sCode'); f.focus();
    document.getElementById('sPw2').onkeydown=ev=>{ if(ev.key==='Enter') doSetPw(); };
    return;
  }

  lead.textContent='パスワードを入力してください。';
  body.innerHTML=who+
    '<input class="who" id="gpass" type="password" inputmode="text" autocomplete="current-password" placeholder="自分のパスワード">'+
    '<button class="gbtn" data-act="signin">はじめる</button>'+
    '<button class="gbtn alt" data-act="toPick">名前を選びなおす</button>'+
    '<p class="tiny muted" style="margin:12px 0 0">パスワードを忘れたときは、ULに「ログインのリセット」を頼んでください。'+
    'これまでの記録は消えずに、パスワードだけ決め直せます。</p>';
  const gp=document.getElementById('gpass');
  gp.focus();
  gp.onkeydown=ev=>{ if(ev.key==='Enter') doSignIn(); };
}
function gateBusy(sel,label){
  const b=document.querySelector(sel);
  if(b){ b.disabled=true; b.textContent=label; }
}
/* 端末に残っていた古い記録を引き継いだときだけ知らせる */
function migrateToast(){
  if(Store.migratedCount>0) toast('この端末に残っていた記録 '+Store.migratedCount+' 件を引き継ぎました','xp');
}
function checkPw(a,b){
  if(!a) return 'パスワードを入力してください';
  if(a.length<6) return 'パスワードは6文字以上にしてください';
  if(a!==b) return 'パスワード（確認）が一致しません';
  return '';
}
async function doSignIn(){
  const pw=(document.getElementById('gpass')||{}).value||'';
  if(!pw){ showGate('パスワードを入力してください'); return; }
  gateBusy('[data-act="signin"]','確認しています…');
  try{
    await Store.signInMember(GATE.picked,pw);
    await boot();
    migrateToast();
  }catch(e){ showGate(e.message||String(e)); }
}
async function doSetPw(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const code=g('sCode'), pw=g('sPw'), pw2=g('sPw2');
  if(!code){ showGate('パスコードを入力してください'); return; }
  const bad=checkPw(pw,pw2);
  if(bad){ showGate(bad); return; }
  gateBusy('[data-act="setpw"]','設定しています…');
  try{
    await Store.setPassword(GATE.picked,code,pw);
    await boot();
    toast('パスワードを設定しました','xp');
    migrateToast();
  }catch(e){ showGate(e.message||String(e)); }
}
async function doRegister(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const r={ name:g('rName').trim(), unit:g('rUnit').trim(), ul:g('rUl').trim(),
            mentor:g('rMentor').trim(), join_date:g('rJoin')||null, certified_grade:g('rGrade')||null };
  const code=g('rCode'), pw=g('rPw'), pw2=g('rPw2');
  Object.assign(GATE.reg,{name:r.name,unit:r.unit,ul:r.ul,mentor:r.mentor,join:r.join_date||'',grade:r.certified_grade||''});
  if(!r.name){ showGate('氏名を入力してください'); return; }
  if(!code){ showGate('部署共通のパスコードを入力してください'); return; }
  const bad=checkPw(pw,pw2);
  if(bad){ showGate(bad); return; }
  gateBusy('[data-act="register"]','登録しています…');
  try{
    await Store.registerMember(r,code,pw);
    await boot();
    toast('登録しました','xp');
    migrateToast();
  }catch(e){ showGate(e.message||String(e)); }
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('#gate [data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='pick'){
    GATE.picked=GATE.roster.find(m=>String(m.id)===el.dataset.id);
    GATE.mode = GATE.picked && GATE.picked.linked ? 'pass' : 'setpw';
    showGate();
  }
  else if(a==='retry'){ location.reload(); }
  else if(a==='toPick'){ GATE.mode='pick'; showGate(); }
  else if(a==='toReg'){ GATE.mode='reg'; showGate(); }
  else if(a==='signin'){ await doSignIn(); }
  else if(a==='setpw'){ await doSetPw(); }
  else if(a==='register'){ await doRegister(); }
});

/* ============================================================
   起動
   ============================================================ */
async function boot(){
  document.getElementById('gate').classList.remove('on');
  document.getElementById('app').style.display='';
  await load();
  render();
  /* 共有事項とテスト結果は裏で読んで、記録タブを開いたときに待たせない */
  loadLog().then(()=>render(true)).catch(()=>{});
  /* Unit・UL・メンターの選択肢に使う名簿。失敗しても画面は動く */
  Store.roster().then(r=>{ ROSTER=r||[]; if(view==='sheet') render(true); }).catch(()=>{});
}
(async()=>{
  /* 電波が悪くてSDKやサーバーに届かないことは普通に起きる。
     ここで例外を素通しすると真っ白な画面になってしまうので、必ず受け止める。 */
  try{
    await Store.init();
    if(Store.mode!=='cloud'){ showGate(''); return; }
    const me=await Store.restore();
    if(me){ await boot(); return; }   /* 前回のログインが残っている */
    GATE.roster=await Store.roster();
    showGate('');
  }catch(e){
    GATE.offline=true;
    showGate(String((e&&e.message)||e));
  }
})();

</script>
</body>
</html>
