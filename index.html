<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEP｜キャリアステップシート</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='34' fill='%23151C2E'/><ellipse cx='90' cy='96' rx='70' ry='21' fill='none' stroke='%23FFC44D' stroke-width='10' transform='rotate(-16 90 96)'/><circle cx='90' cy='94' r='46' fill='%23FAF8FF'/><circle cx='75' cy='92' r='7' fill='%232C2748'/><circle cx='105' cy='92' r='7' fill='%232C2748'/><path d='M81 106 q9 9 18 0' stroke='%232C2748' stroke-width='5.5' fill='none' stroke-linecap='round'/><circle cx='146' cy='52' r='9' fill='%23FFC44D'/></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDECF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STEP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#181240;
  --ink2:#615C88;
  --ink3:#9A95B8;
  --base:#EDECF9;
  --surface:#FFFFFF;
  --line:#E4E2F3;
  --violet:#5B3DF5;
  --violet-soft:#EEEAFF;
  --mint:#17B98A;
  --mint-soft:#E1F8F0;
  --sky:#2E8FE0;
  --sky-soft:#E4F1FC;
  --amber:#F59E17;
  --amber-soft:#FDF0DA;
  --coral:#F2536A;
  --coral-soft:#FDE7EA;
  --radius:20px;
  --shadow:0 2px 3px rgba(24,18,64,.04), 0 12px 28px -12px rgba(24,18,64,.18);
  --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -8%, #DCD8FB 0%, transparent 60%),
    radial-gradient(700px 480px at 105% 4%, #D9F3EA 0%, transparent 58%),
    var(--base);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px)}
.disp{font-family:'Bricolage Grotesque','Noto Sans JP',sans-serif;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .mark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em}
.brand .sub{font-size:10.5px;color:var(--ink2);letter-spacing:.16em}
.saved{font-size:10.5px;color:var(--ink2);opacity:0;transition:opacity .3s;letter-spacing:.04em}
.saved.on{opacity:1}
main{padding:0 16px}

/* ---------- generic ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.sec-label{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:700;margin:22px 4px 10px}
.muted{color:var(--ink2)}
.tiny{font-size:11.5px;line-height:1.7}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}

/* ---------- capsule / hero ---------- */
.hero{position:relative;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:20px 20px 18px;margin-bottom:14px;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:28px;border:1px solid rgba(255,255,255,.7)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-grade{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:700}
.hero-title{font-size:26px;line-height:1.15;margin:2px 0 6px}
.hero-name{font-size:12.5px;color:var(--ink2)}
.capsule-wrap{display:flex;justify-content:center;margin:6px 0 2px}
.pct{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1}
.pct small{font-size:15px;margin-left:2px}
.bar{height:9px;border-radius:99px;background:#EDEBF8;overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.25,1)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:16px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800}
.stat span{font-size:10px;color:var(--ink2);letter-spacing:.06em}

/* ---------- next-up list ---------- */
.next-item{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.next-item:first-of-type{border-top:0}
.next-item .cat{font-size:10px;color:var(--ink2);letter-spacing:.04em;display:block;margin-bottom:2px}
.next-item .txt{font-size:13.5px;line-height:1.55}
.box{width:22px;height:22px;border-radius:8px;border:2px solid #D6D2ED;flex:0 0 auto;margin-top:1px;display:grid;place-items:center;transition:.18s;background:#fff}
.box svg{opacity:0;transform:scale(.5);transition:.18s}
.box.on{background:var(--violet);border-color:var(--violet)}
.box.on svg{opacity:1;transform:scale(1)}

/* ---------- grade list ---------- */
.glist{display:flex;flex-direction:column;gap:10px}
.gcard{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);width:100%;text-align:left;transition:transform .15s}
.gcard:active{transform:scale(.985)}
.gcard.done{background:linear-gradient(180deg,#fff,#F7FFFC)}
.gnum{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em}
.gtitle{font-size:14.5px;font-weight:700;line-height:1.35}
.gmeta{font-size:11px;color:var(--ink2);margin-top:2px}
.ring{position:relative;width:46px;height:46px;flex:0 0 auto}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-size:12px;font-weight:800}

/* ---------- detail ---------- */
.dhead{padding:6px 4px 14px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:700;padding:6px 0}
.dtitle{font-size:23px;margin:8px 0 4px}
.block{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 6px;margin-bottom:12px}
.block > h3{font-size:13px;margin:0 0 4px;line-height:1.45;display:flex;gap:8px;align-items:baseline}
.block .grp{font-size:11.5px;font-weight:700;color:var(--ink2);margin:14px 0 2px;letter-spacing:.04em}
.block.ai{background:linear-gradient(180deg,#FFFDF7,#FFF8EA);border:1px solid #F7E7C4}
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-of-type{border-top:0}
.item .txt{font-size:13.5px;line-height:1.6;flex:1}
.item.on .txt{color:var(--ink2);text-decoration:line-through;text-decoration-color:#CFCBE6}
.item.sub{padding-left:30px}
.item.lk{cursor:default}
.item.lk .txt{color:var(--ink3)}
.item.lk .box{border-color:#EAE7F5;background:#F6F5FB}
.box.lkbox{border-color:#EAE7F5;background:#F6F5FB}
.note.lockbox{background:#F1EFFA;color:var(--ink2)}
.gcard.lk .gtitle{color:var(--ink3)}
.item a{color:var(--violet);word-break:break-all}
.note{background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.7;margin-bottom:12px}
.vision{background:linear-gradient(135deg,#F4F1FF,#EAFBF4);border-radius:var(--radius);padding:16px 16px 6px;margin-bottom:12px}
.vision h3{font-size:12px;letter-spacing:.1em;margin:0 0 2px;color:var(--ink2)}

/* ---------- dex ---------- */
.dex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:var(--surface);border-radius:18px;padding:12px 10px 14px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.dcard .stage-no{position:absolute;top:8px;left:11px;font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:800;color:var(--ink3);opacity:.7}
.dcard .nm{font-weight:700;font-size:14px;margin-top:4px}
.dcard .dsc{font-size:10.5px;color:var(--ink2);line-height:1.55;margin-top:3px;min-height:32px}
.dcard.lock{background:#F6F5FC}
.dcard.lock .nm{color:var(--ink3)}
.dcard.now::after{content:'いま';position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;background:var(--violet);color:#fff;padding:2px 7px;border-radius:99px;letter-spacing:.06em}

/* ---------- sheet form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px;letter-spacing:.04em}
.field input[type=text],.field input[type=date],.field textarea,.field select{
  width:100%;border:1.5px solid var(--line);background:#FBFAFF;border-radius:12px;padding:11px 12px;font-size:14.5px;transition:.15s
}
.field textarea{min-height:78px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--violet);background:#fff;outline:none}
.creed{border-top:1px solid var(--line);padding:12px 0}
.creed:first-of-type{border-top:0}
.creed .row{display:flex;align-items:center;gap:9px}
.creed .no{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;color:var(--ink3);width:16px;flex:0 0 auto}
.creed input{flex:1;border:0;border-bottom:1.5px solid var(--line);background:none;padding:6px 2px;font-size:14px}
.creed input:focus{border-color:var(--violet);outline:none}
.scores{display:flex;gap:6px;margin:9px 0 0 25px}
.scores button{width:32px;height:32px;border-radius:10px;background:#F4F2FD;font-size:12.5px;font-weight:700;color:var(--ink2);font-family:'Bricolage Grotesque',sans-serif}
.scores button.on{background:var(--violet);color:#fff}
.atari{border-top:1px solid var(--line);padding:13px 0}
.atari:first-of-type{border-top:0}
.atari .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.atari .h b{font-size:13.5px}
.atari p{margin:5px 0 0;font-size:11.5px;color:var(--ink2);line-height:1.65}
.seg{display:flex;gap:5px;flex:0 0 auto}
.seg button{width:36px;height:29px;border-radius:9px;background:#F4F2FD;font-size:12px;font-weight:700;color:var(--ink2)}
.seg button.ok.on{background:var(--mint);color:#fff}
.seg button.ng.on{background:var(--coral);color:#fff}
.danger{width:100%;padding:13px;border-radius:14px;background:#fff;border:1.5px solid var(--coral);color:var(--coral);font-weight:700;font-size:13px;margin-top:6px}


/* ---------- step map ---------- */
.maprail{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.mapgrid{display:grid;grid-template-columns:104px repeat(10,168px);gap:6px;min-width:max-content}
.mh{background:var(--surface);border-radius:12px;padding:9px 8px;text-align:center;box-shadow:var(--shadow);position:relative}
.mh-cat{display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:.06em;position:sticky;left:0;z-index:3}
.mh-g{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px}
.mh-t{display:block;font-size:10px;color:var(--ink2);margin-top:1px}
.mh.now{outline:2px solid var(--violet)}
.mh-now{display:inline-block;margin-top:4px;font-size:9px;font-weight:700;color:#fff;background:var(--violet);border-radius:99px;padding:1px 7px}
.mc-cat{background:var(--surface);border-radius:12px;padding:12px 10px;font-size:11.5px;font-weight:700;line-height:1.4;display:flex;align-items:center;box-shadow:var(--shadow);position:sticky;left:0;z-index:2}
.mc{background:var(--surface);border-radius:12px;padding:10px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:78px;transition:transform .12s}
.mc:active{transform:scale(.98)}
.mc-txt{font-size:11.5px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc-num{font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.mc.part{background:linear-gradient(180deg,#fff,#F6F3FF)}
.mc.part .mc-num{color:var(--violet)}
.mc.full{background:linear-gradient(180deg,#F3FDF9,#E6F8F1)}
.mc.full .mc-num{color:var(--mint)}
.mc.lk{opacity:.55}
.mc.empty{background:#F4F3FB;box-shadow:none;color:#C9C5DE;align-items:center;justify-content:center;display:grid;min-height:78px}
.maplegend{display:flex;gap:14px;margin:10px 4px 0;flex-wrap:wrap}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:4px;background:#fff;border:1px solid var(--line);display:inline-block}
.lg.full{background:#DFF6EC;border-color:#BFEBDC}
.lg.part{background:#EDE7FF;border-color:#DCD3FF}
.lg.lk{background:#EFEDF7;border-color:#E2DFF0;opacity:.7}
.lbl-full{display:none}

/* ---------- sidebar buddy (desktop only) ---------- */
.side-buddy{display:none}




/* ---------- roadmap ---------- */
.roadcard{padding:18px 14px 14px}
.road-inner{position:relative;padding-top:46px}
.road-bar{position:absolute;left:5%;right:5%;top:calc(46px + 15px);height:6px;border-radius:99px;background:#EDEBF8;overflow:hidden}
.road-bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5B3DF5,#17B98A);transition:width .6s cubic-bezier(.2,.9,.25,1)}
.road-nodes{position:relative;display:flex}
.rn{flex:1;min-width:0;display:flex;justify-content:center;position:relative}
.rn-dot{width:min(30px,100%);aspect-ratio:1;height:auto;border-radius:50%;background:#fff;border:2px solid #E0DDF0;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px;color:var(--ink2);
  display:grid;place-items:center;position:relative;z-index:2;transition:.2s}
.rn-you{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;z-index:3}
.rn-you.edgeL{left:0;transform:none}
.rn-you.edgeR{left:auto;right:0;transform:none}
.rn-you b{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--violet);border-radius:99px;padding:2px 8px}
.rn-you.tag{bottom:40px}
.rn-pod{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,#36425F,#141A2B)}
.road-tiers{display:flex;margin-top:9px}
.road-tiers span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--ink3);letter-spacing:.02em;
  border-top:1px solid var(--line);padding-top:6px;margin:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc.now{outline:2px solid rgba(91,61,245,.35)}
.mc.empty.now{outline:2px solid rgba(91,61,245,.2)}
@media (min-width:900px){
  .roadcard{padding:22px 22px 16px}
  .rn-dot{width:min(36px,100%);font-size:13.5px}
  .road-bar{top:calc(46px + 18px)}
  .rn-you{bottom:44px}
  .rn-pod{width:44px;height:44px}
  .road-tiers span{font-size:11px}
}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:40}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.tabbar button.on{color:var(--violet)}
.tabbar svg{width:22px;height:22px}

/* ---------- toast / evolution ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 20px);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:99px;box-shadow:0 10px 24px -8px rgba(24,18,64,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.toast.xp{background:var(--violet)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
#evo{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:24px;overflow:hidden;background:rgba(19,14,52,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#evo.on{display:grid;animation:fade .28s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.evo-card{background:var(--surface);border-radius:28px;padding:22px 22px 24px;text-align:center;max-width:340px;width:100%;position:relative;overflow:hidden;z-index:2;animation:rise .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
.sfx-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:#F4F2FD;color:var(--ink2);display:grid;place-items:center;z-index:4}
.evo-stage{position:relative;display:grid;place-items:center;height:178px}
.evo-stage>*{grid-area:1/1}
.rays{width:320px;height:320px;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,rgba(255,196,77,.8) 0 5deg,rgba(255,196,77,0) 5deg 28deg);
  -webkit-mask-image:radial-gradient(circle,transparent 30%,#000 40%,#000 60%,transparent 72%);
  mask-image:radial-gradient(circle,transparent 30%,#000 40%,#000 60%,transparent 72%);
  animation:raysIn .6s .62s forwards,spin 14s linear infinite}
@keyframes raysIn{to{opacity:.9}}
.glow{width:230px;height:230px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,214,120,.95),rgba(255,214,120,0) 62%);
  animation:glowP 1.1s .5s ease-out}
@keyframes glowP{0%{opacity:0;transform:scale(.5)}22%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.shock{width:110px;height:110px;border-radius:50%;border:4px solid #FFC44D;opacity:0;animation:shockW .85s .62s ease-out}
.shock.s2{border-color:#FF9F45;animation-delay:.8s}
@keyframes shockW{0%{opacity:.95;transform:scale(.35)}100%{opacity:0;transform:scale(3)}}
.fig{display:grid;place-items:center;z-index:2}
.fig.old{animation:oldGo 1.05s forwards}
@keyframes oldGo{
  0%{opacity:1;transform:scale(1);filter:none}
  18%{filter:brightness(2.4) saturate(.2)}
  30%{filter:none}
  46%{filter:brightness(2.6) saturate(.2)}
  56%{filter:none;transform:scale(1.06)}
  62%{opacity:1;transform:scale(1.22);filter:brightness(3.4) saturate(0)}
  70%{opacity:0;transform:scale(1.42)}
  100%{opacity:0;transform:scale(1.42)}}
.fig.new{opacity:0;animation:newIn .8s .68s cubic-bezier(.16,1.5,.4,1) forwards}
.fig.new.solo{animation-delay:.3s}
@keyframes newIn{0%{opacity:0;transform:scale(.32) rotate(-14deg)}55%{opacity:1;transform:scale(1.14) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.evo-card .kick{font-size:11px;letter-spacing:.22em;color:var(--violet);font-weight:800;animation:upIn .5s .95s backwards}
.evo-card h2{font-size:27px;margin:6px 0 2px;animation:upIn .5s 1.06s backwards}

<script>
/* ============================================================
   STATE + STORAGE
   ============================================================ */
const KEY='careerstep:v1';
/* 保存先：Claudeのアーティファクト内では window.storage、
   Vercel等の通常のWebでは localStorage、どちらも使えなければメモリのみ */
const STORE=(()=>{
  let api=false;
  try{ api = !!(window.storage && typeof window.storage.get==='function'); }catch(e){ api=false; }
  let ls=false;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ls=true; }catch(e){ ls=false; }
  const mem={};
  return {
    mode: api?'app':(ls?'local':'none'),
    async get(k){
      if(api){ try{ const r=await window.storage.get(k); return (r&&r.value)||null; }catch(e){} }
      if(ls){ try{ return localStorage.getItem(k); }catch(e){} }
      return mem[k]||null;
    },
    async set(k,v){
      if(api){ try{ await window.storage.set(k,v); return 'app'; }catch(e){} }
      if(ls){ try{ localStorage.setItem(k,v); return 'local'; }catch(e){} }
      mem[k]=v; return 'none';
    }
  };
})();
const DEFAULT={
  profile:{name:'',join:'',grade:''}, buddy:'', sound:true,
  goals:{basic:'',skill:''},
  creed:[{t:'',s:0},{t:'',s:0},{t:'',s:0},{t:'',s:0},{t:'',s:0}],
  atarimae:{}, checks:{}, custom:{}, log:[], seen:[]
};
let D=JSON.parse(JSON.stringify(DEFAULT));
let view='home', openG=null, ready=false;

async function load(){
  try{
    const v=await STORE.get(KEY);
    if(v) D=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(v));
  }catch(e){ /* 初回 */ }
  ready=true;
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const m=await STORE.set(KEY,JSON.stringify(D));
    flash(m);
  },400);
}
function flash(m){
  const el=document.getElementById('saved');
  if(m==='none'){ el.textContent='保存できません'; el.style.color='var(--coral)'; el.classList.add('on'); return; }
  el.textContent = m==='local' ? 'この端末に保存しました' : '保存しました';
  el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1200);
}

/* ============================================================

   ============================================================ */
function gradeItems(g){
  const out=[];
  const gi=GRADES.findIndex(x=>x.n===g.n);
  g.vision.forEach((t,i)=>out.push({id:'g'+g.n+'.v.'+i,t:t,cat:'なりたい姿',vision:true}));
  g.sections.forEach((s,si)=>{
    const push=(list,gl)=>list.forEach((it,ii)=>{
      const base='g'+g.n+'.'+si+'.'+(gl!=null?gl+'-':'')+ii;
      if(typeof it==='string'){ out.push({id:base,t:it,cat:s.title,custom:!!s.custom}); }
      else{
        out.push({id:base,t:it.t,cat:s.title,link:it.link,custom:!!s.custom});
        (it.sub||[]).forEach((st,k)=>out.push({id:base+'.'+k,t:st,cat:s.title,sub:true}));
      }
    });
    if(s.groups) s.groups.forEach((gr,gl)=>push(gr.items,gl));
    else push(s.items,null);
  });
  return out;
}
const ITEMS={}; GRADES.forEach(g=>ITEMS[g.n]=gradeItems(g));
function done(g){return ITEMS[g].filter(i=>D.checks[i.id]).length;}
function total(g){return ITEMS[g].length;}
function isDone(g){return done(g)===total(g);}
function gradeOf(id){return +id.slice(1).split('.')[0];}
function isLocked(n){return n>currentGrade();}
function currentGrade(){for(const g of GRADES){if(!isDone(g.n))return g.n;}return 10;}
function stage(){let c=0;GRADES.forEach(g=>{if(isDone(g.n))c++;});return Math.min(c+1,10);}
function totalChecked(){return Object.values(D.checks).filter(Boolean).length;}
function totalItems(){return GRADES.reduce((a,g)=>a+total(g.n),0);}
function weekCount(){const wk=Date.now()-6048e5;return D.log.filter(t=>t>wk).length;}

function star(cx,cy,r,f){
  return '<path d="M'+cx+' '+(cy-r)+' L'+(cx+r*0.32)+' '+(cy-r*0.32)+' L'+(cx+r)+' '+cy+' L'+(cx+r*0.32)+' '+(cy+r*0.32)+' L'+cx+' '+(cy+r)+' L'+(cx-r*0.32)+' '+(cy+r*0.32)+' L'+(cx-r)+' '+cy+' L'+(cx-r*0.32)+' '+(cy-r*0.32)+' Z" fill="'+f+'"/>';
}

function creature(st,size,cls){

  const moon=(deg,rad,mr)=>{const t=deg*Math.PI/180;
    return '<circle cx="'+(cx+Math.cos(t)*rad).toFixed(1)+'" cy="'+(cy+Math.sin(t)*rad).toFixed(1)+'" r="'+mr+'" fill="'+A+'"/>';};

  if(st>=10) p.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+22)+'" fill="'+A+'" opacity=".10"/>');
  if(st>=8)  p.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+11)+'" fill="'+A+'" opacity=".13"/>');

  if(st>=4) p.push('<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(r+14)+'" ry="'+((r+14)*0.3).toFixed(1)+'" fill="none" stroke="'+A+'" stroke-width="3" transform="rotate(-16 '+cx+' '+cy+')"/>');

  p.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+W+'"/>');
  p.push('<circle cx="'+(cx-r*0.34).toFixed(1)+'" cy="'+(cy-r*0.3).toFixed(1)+'" r="'+(r*0.3).toFixed(1)+'" fill="#fff" opacity=".7"/>');

  const er=2.5+st*0.14, ex=r*0.33, ey=cy-r*0.05;
  p.push('<g class="eyes"><circle cx="'+(cx-ex).toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="'+er.toFixed(1)+'" fill="'+E+'"/>'+
         '<circle cx="'+(cx+ex).toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="'+er.toFixed(1)+'" fill="'+E+'"/></g>');
  if(st>=2) p.push('<path d="M'+(cx-r*0.2).toFixed(1)+' '+(ey+r*0.32).toFixed(1)+' q'+(r*0.2).toFixed(1)+' '+(r*0.22).toFixed(1)+' '+(r*0.4).toFixed(1)+' 0" stroke="'+E+'" stroke-width="2.1" fill="none" stroke-linecap="round"/>');

  const ms=[];

  if(st>=5) ms.push(moon(150,r+17,3.6));
  if(st>=7) ms.push(moon(75,r+17,3));
  if(ms.length) p.push('<g class="orbit">'+ms.join('')+'</g>');

  if(st>=9) p.push(sp(104,26,5,A)+sp(18,44,3.6,A)+sp(96,102,3.2,A));

  return '<svg class="art '+(cls||'')+'" viewBox="0 0 120 120" width="'+size+'" height="'+size+'" aria-hidden="true">'+
    '<g class="mochi">'+p.join('')+'</g></svg>';
}

/* 丸窓：月に向かって相棒が進んでいく。進捗＝月までの距離 */
function porthole(st,pct,accent){
  const cx=110, cy=100, R=78;
  const P0=[88,132], C=[60,100], P1=[132,68];
  const at=t=>[Math.pow(1-t,2)*P0[0]+2*(1-t)*t*C[0]+t*t*P1[0], Math.pow(1-t,2)*P0[1]+2*(1-t)*t*C[1]+t*t*P1[1]];
  const poly=n=>{let d='';for(let i=0;i<=n;i++){const q=at(i/n);d+=(i?' L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}return d;};
  const t=Math.min(1,Math.max(0,pct/100)), pos=at(t);

   '<circle cx="'+cx+'" cy="'+cy+'" r="84" fill="#F5F4FB"/>'+bolts+
   '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#ph_sky)"/>'+
   '<g clip-path="url(#ph_c)">'+stars+
     '<circle cx="152" cy="52" r="30" fill="#fff" opacity=".08"/>'+
     '<circle cx="152" cy="52" r="20" fill="#EFEDE2"/>'+

     '<path d="M40 44 l16 -12" stroke="#fff" stroke-width="1.6" opacity=".5" stroke-linecap="round"/>'+
     '<path d="M74 152 l14 -11" stroke="#fff" stroke-width="1.4" opacity=".35" stroke-linecap="round"/>'+
     '<path d="'+poly(24)+'" stroke="#fff" stroke-width="1.6" fill="none" opacity=".25" stroke-dasharray="3 5"/>'+
     (t>0.02?'<path d="'+poly(Math.max(2,Math.round(24*t)))+'" stroke="'+accent+'" stroke-width="2.4" fill="none" opacity=".9" stroke-linecap="round"/>':'')+
     '<g transform="translate('+(pos[0]-41).toFixed(1)+','+(pos[1]-41).toFixed(1)+') scale(.68)">'+creature(st,120,'float')+'</g>'+
   '</g>'+
   '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#E4E2F2" stroke-width="4"/>'+
   '<circle cx="'+cx+'" cy="'+cy+'" r="88" fill="none" stroke="#EDEBF7" stroke-width="5"/>'+
   '<circle cx="'+cx+'" cy="'+cy+'" r="88" fill="none" stroke="'+accent+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+arc+'" stroke-dashoffset="'+(arc*(1-t))+'" transform="rotate(-90 '+cx+' '+cy+')"/>'+
   '</svg>';
}

  return {t:its.length, d:its.filter(i=>D.checks[i.id]).length};
}
function subLabel(title,cat){
  let r=title.slice(cat.length);
  if(r.charAt(0)==='｜') r=r.slice(1);
  if(r.charAt(0)==='（'&&r.charAt(r.length-1)==='）') r=r.slice(1,-1);
  return r||title;
}

/* ============================================================
   SOUND — 音源ファイルなし、Web Audioで生成
   ============================================================ */
let AC=null;
function actx(){
  try{
    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(f,at,dur,type,vol,f2){
  const a=actx(); if(!a) return;
  const t0=a.currentTime+at, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||.15,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.06);
}
function whoosh(at,dur,vol){
  const a=actx(); if(!a) return;
  const t0=a.currentTime+at, n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(i/n,1.6);
  const src=a.createBufferSource(); src.buffer=buf;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(300,t0); bp.frequency.exponentialRampToValueAtTime(5200,t0+dur);
  const g=a.createGain(); g.gain.value=vol||.16;
  src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t0);
}
function blip(prog){
  if(!D.sound) return;
  const f=392*Math.pow(2,Math.min(1,prog||0));
  tone(f,0,.11,'triangle',.075); tone(f*2,0.01,.07,'sine',.02);
}
function fanfare(big){
  if(!D.sound) return;
  whoosh(0.05,.62,.13);
  tone(70,.62,.55,'sine',.22,42);
  const ch=big?[523.25,659.25,783.99,1046.5,1318.5]:[523.25,659.25,783.99,1046.5];
  ch.forEach((f,i)=>{ tone(f,.62+i*0.085,.5,'triangle',.16); tone(f*2,.62+i*0.085,.32,'sine',.04); });
  for(let i=0;i<8;i++) tone(1400+Math.random()*1500,.95+i*0.06,.22,'sine',.045);
  if(big){ tone(1046.5,1.5,1.1,'triangle',.1); tone(1567.98,1.52,1.1,'sine',.05); }
}

function vDetail(n){

  if(g.note) h+='<div class="note">'+esc(g.note)+'</div>';

    h+='<div class="block'+(s.ai?' ai':'')+'"><h3>'+(s.ai?'<span>🤖</span>':'')+'<span>'+esc(s.title)+'</span></h3>';
    if(s.note) h+='<p class="tiny muted" style="margin:2px 0 6px">'+esc(s.note)+'</p>';

function roadmap(showBuddy){
  const cg=currentGrade(), st=stage(), dn=done(cg), tt=total(cg);
  const pos=Math.max(0,Math.min(100,((cg-1)+dn/tt)/9*100));
  let nodes='';
  GRADES.forEach(g=>{
    const t=tierOf(g.n), dd=isDone(g.n), cur=g.n===cg, lk=isLocked(g.n);
    const edge = g.n<=2?' edgeL':(g.n>=9?' edgeR':'');
    nodes+='<div class="rn'+(dd?' done':'')+(cur?' cur':'')+'">'+
      (cur&&showBuddy?'<div class="rn-you'+edge+'"><div class="rn-pod">'+creature(st,34,'')+'</div><b>いまここ</b></div>':
       (cur?'<div class="rn-you tag'+edge+'"><b>いまここ</b></div>':''))+
      '<button class="rn-dot" data-act="openGrade" data-g="'+g.n+'" title="Grade '+g.n+' '+t.name+'" '+
        'style="'+(dd?'background:'+t.hex+';border-color:'+t.hex+';color:#fff':(cur?'border-color:'+t.hex+';color:'+t.hex+';box-shadow:0 0 0 4px '+t.hex+'22':(lk?'color:#B7B2CE':'color:'+t.hex)))+'">'+
        (dd?'✓':g.n)+'</button>'+
    '</div>';
  });
  const tiers=[['スターター',2],['プレイヤー',2],['プロフェッショナル',2],['リーダー',2],['エグゼクティブ',2]]
    .map(x=>'<span style="flex:'+x[1]+'">'+x[0]+'</span>').join('');
  return '<div class="road">'+
    '<div class="road-inner"><div class="road-bar"><i style="width:'+pos.toFixed(1)+'%"></i></div>'+
    '<div class="road-nodes">'+nodes+'</div></div>'+
    '<div class="road-tiers">'+tiers+'</div></div>';
}

    h+='<div class="dcard'+(un?'':' lock')+(s2===st?' now':'')+'">'+
      '<span class="stage-no">'+String(s2).padStart(2,'0')+'</span>'+
      '<div class="pod">'+creature(s2,92,'')+'</div>'+
      '<div class="nm">'+(un?esc(c.t):'？？？')+'</div>'+
      '<div class="dsc">'+(un?esc(c.dsc):'Grade '+(s2-1)+' を達成すると解放')+'</div>'+
    '</div>';
  });
  return h+'</div>';
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
const TABS=[
  {k:'home',n:'ホーム',i:'<path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>'},
  {k:'map',n:'<span class="lbl-full">ステップ一覧</span><span class="lbl-short">マップ</span>',i:'<path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17M9 4v16M15 4v16" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>'},
  {k:'grades',n:'グレード',i:'<path d="M4 18h4v3H4zM10 12h4v9h-4zM16 6h4v15h-4z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>'},
  {k:'dex',n:'ずかん',i:'<path d="M12 3l2.2 5.2 5.8.5-4.4 3.8 1.3 5.6L12 15.2 7.1 18.1l1.3-5.6L4 8.7l5.8-.5z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/>'},
  {k:'sheet',n:'マイシート',i:'<circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4.5 20c1.2-3.7 4-5.6 7.5-5.6S18.3 16.3 19.5 20" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>'}
];
function renderTabs(){
  const st=stage(), cg=currentGrade(), dn=done(cg), tt=total(cg), tc=tierOf(cg);
  document.getElementById('tabbar').innerHTML=
   '<div class="side-buddy">'+
     '<div class="pod" style="width:96px;height:96px;margin:0 auto">'+creature(st,84,'float')+'</div>'+
     '<div class="sb-name">'+(D.buddy?esc(D.buddy):'なまえ未設定')+'</div>'+
     '<div class="sb-meta">Grade '+cg+'／'+tc.name+' ・ 第'+st+'形態</div>'+
     '<div class="bar" style="margin-top:9px"><i style="width:'+Math.round(dn/tt*100)+'%;background:'+tc.hex+'"></i></div>'+
     '<div class="sb-meta" style="margin-top:6px">'+dn+' / '+tt+' 項目</div>'+
   '</div>'+
   TABS.map(t=>
    '<button data-act="tab" data-tab="'+t.k+'" class="'+(view===t.k&&openG===null?'on':'')+'">'+
    '<svg viewBox="0 0 24 24">'+t.i+'</svg>'+t.n+'</button>').join('');
}
function render(keepScroll){
  const y=window.scrollY;
  const v=document.getElementById('view');
  if(openG) v.innerHTML=vDetail(openG);
  else if(view==='home') v.innerHTML=vHome();
  else if(view==='grades') v.innerHTML=vGrades();
  else if(view==='map') v.innerHTML=vMap();
  else if(view==='dex') v.innerHTML=vDex();
  else v.innerHTML=vSheet();
  renderTabs();
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='tab'){ view=el.dataset.tab; openG=null; render(); }
  else if(a==='openGrade'){ openG=+el.dataset.g; view='grades'; render(); }
  else if(a==='back'){ openG=null; render(); }
  else if(a==='toggle'){ toggle(el.dataset.id); }
  else if(a==='creed'){ const i=+el.dataset.i,v=+el.dataset.v; D.creed[i].s=(D.creed[i].s===v?0:v); save(); render(true); }
  else if(a==='atari'){ const k=el.dataset.k,v=el.dataset.v; D.atarimae[k]=(D.atarimae[k]===v?null:v); save(); render(true); }
  else if(a==='sfx'){
    D.sound=!D.sound; save();
    if(el.dataset.icon){ el.innerHTML=D.sound?SPK_ON:SPK_OFF; if(D.sound) blip(.7); }
    else { if(D.sound) blip(.7); render(true); }
  }
  else if(a==='export'){ exportData(); }
  else if(a==='import'){ document.getElementById('importFile').click(); }
  else if(a==='reset'){
    if(confirm('チェック・入力内容をすべて消去します。よろしいですか？')){
      D=JSON.parse(JSON.stringify(DEFAULT)); save(); render(); toast('リセットしました');
    }
  }
  else if(a==='closeEvo'){ document.getElementById('evo').classList.remove('on'); render(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'&&e.target.files[0]){ importData(e.target.files[0]); e.target.value=''; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.field){
    const k=t.dataset.field.split('.');
    if(k.length===1) D[k[0]]=t.value; else D[k[0]][k[1]]=t.value;
    save();
    if(k[0]==='buddy'){ const ht=document.querySelector('.hero-title'); if(ht) ht.textContent=t.value||'なまえ未設定'; }
  }else if(t.dataset.creed!=null){ D.creed[+t.dataset.creed].t=t.value; save(); }
  else if(t.dataset.custom){ D.custom[t.dataset.custom]=t.value; save(); }
});

function toggle(id){
  const gn=gradeOf(id);
  if(!D.checks[id] && isLocked(gn)){
    toast('Grade '+(gn-1)+' を埋めると開きます');
    return;
  }
  const before=GRADES.filter(g=>isDone(g.n)).map(g=>g.n), st0=stage();
  const now=!D.checks[id];
  if(now){ D.checks[id]=true; D.log.push(Date.now()); if(D.log.length>400) D.log=D.log.slice(-400); }
  else delete D.checks[id];
  save();
  const after=GRADES.filter(g=>isDone(g.n)).map(g=>g.n);
  const newly=after.filter(n=>!before.includes(n)&&!D.seen.includes(n));
  render(true);
  if(newly.length){ newly.forEach(n=>D.seen.push(n)); save(); evolve(Math.max.apply(null,newly),st0,stage()); }
  else if(now){ blip(done(gn)/total(gn)); toast('+10 XP','xp'); }
}

function evolve(gradeN,oldSt,newSt){
  const t=tierOf(gradeN), sg=STAGES[newSt-1], nm=D.buddy?esc(D.buddy):'相棒';
  const fin = (gradeN===10 || oldSt===newSt);
  const box=document.getElementById('evo');
  const COL=['#5B3DF5','#17B98A','#FFC44D','#F2536A','#2E8FE0','#FF9F45'];
  let conf='';
  for(let i=0;i<46;i++){
    const round=i%4===0;
    conf+='<span class="conf'+(round?' r':'')+'" style="left:'+(Math.random()*100).toFixed(1)+'%;'+
      'background:'+COL[i%COL.length]+';animation-delay:'+(0.66+Math.random()*0.7).toFixed(2)+'s;'+
      'animation-duration:'+(2.2+Math.random()*1.6).toFixed(2)+'s;'+
      'width:'+(round?7+Math.random()*5:6+Math.random()*4).toFixed(0)+'px;'+
      'height:'+(round?7+Math.random()*5:10+Math.random()*8).toFixed(0)+'px"></span>';
  }
  box.innerHTML=conf+
   '<div class="evo-card">'+
     '<button class="sfx-btn" data-act="sfx" data-icon="1" aria-label="効果音">'+(D.sound?SPK_ON:SPK_OFF)+'</button>'+
     '<div class="evo-stage">'+
       '<span class="rays"></span><span class="glow"></span><span class="shock"></span><span class="shock s2"></span>'+
       (fin?'':'<span class="fig old">'+creature(oldSt,150,'')+'</span>')+
       '<span class="fig new'+(fin?' solo':'')+'">'+creature(newSt,150,'float')+'</span>'+
     '</div>'+
     '<div class="kick">'+(fin?'ALL GRADE CLEAR':'GRADE '+gradeN+' CLEAR')+'</div>'+
     '<h2 class="disp">'+(fin?nm+' 完成！':nm+' が進化！')+'</h2>'+
     '<p class="cap">第'+newSt+'形態「'+esc(sg.t)+'」<br>'+esc(sg.dsc)+
       '<br><span style="color:'+t.hex+';font-weight:700">'+(fin?'全'+totalItems()+'項目、走り切りました':t.name+'として次のステップへ')+'</span></p>'+
     '<button class="evo-btn" data-act="closeEvo">'+(fin?'やりきった':'よし、次へ')+'</button>'+
   '</div>';
  box.classList.add('on');
  fanfare(fin);
}

/* boot */
(async()=>{ await load(); render(); })();
</script>
</body>
</html>
